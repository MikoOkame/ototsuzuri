canvas.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p) return;
  if(manualCam){ p.x = e.clientX; p.y = e.clientY; return; }   // 手入力の画角で固定中
  if(pointers.size === 1){
    if(p.pan) panBy(e.clientX - p.x, e.clientY - p.y);
    else { ORBIT.az -= (e.clientX - p.x)*.005; ORBIT.el += (e.clientY - p.y)*.004; }
  }
  p.x = e.clientX; p.y = e.clientY;
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    if(lastPinch) ORBIT.dist *= lastPinch/d;
    if(lastMid) panBy(mx - lastMid.x, my - lastMid.y);
    lastPinch = d; lastMid = { x:mx, y:my };
  }
  clampO();
});
function endPointer(e){ pointers.delete(e.pointerId); lastPinch = 0; lastMid = null; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e=>e.preventDefault());    // 右ドラッグの邪魔をさせない
canvas.addEventListener('mousedown', e=>{ if(e.button === 1) e.preventDefault(); });   // 中ボタンの自動スクロールを出さない
/* ホイール：マウスのホイールは寄る・引く、トラックパッドの2本指スクロールは平行移動。
   ブラウザからはどちらも wheel なので値の形で見分ける。ホイールは行単位か、横が 0 で縦が大きな整数で来る。
   トラックパッドは小さい値・小数・横成分が混じる。一連の動き（間が 200ms 未満）の途中では判定を変えない
   （ただしトラックパッドらしい値が来たらそちらに倒す）。見分けを誤ると平行移動になる（以前の動き） */
let wheelKind = 'pad', lastWheelT = 0;
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  if(manualCam) return;
  const now = performance.now();
  const padLike = e.deltaMode === 0 && (e.deltaX !== 0 || !Number.isInteger(e.deltaY) || Math.abs(e.deltaY) < 50);
  if(now - lastWheelT > 200) wheelKind = padLike ? 'pad' : 'mouse';
  else if(padLike) wheelKind = 'pad';
  lastWheelT = now;
  if(e.ctrlKey) ORBIT.dist *= 1 + e.deltaY*.01;           // トラックパッドのピンチ
  else if(wheelKind === 'mouse'){                          // マウスのホイール：1目盛り（100px）で約 16%
    const dy = e.deltaMode === 1 ? e.deltaY*33 : e.deltaMode === 2 ? e.deltaY*400 : e.deltaY;
    ORBIT.dist *= Math.exp(dy*.0015);
  }
  else panBy(-e.deltaX, -e.deltaY);                        // 2本指スクロール
  clampO();
  hideHint();
}, { passive:false });

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 70 : 52;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();


/* ================================================================
   書き出し（制作用。?export のときだけ）：オルゴールを箱ごと GLB にする。
   輪郭線の殻は外し、ピンは1本ずつのメッシュに展開し、動く部品は静止の姿勢（蓋は閉じる）に戻す。
   単位は実寸の m（窓辺と同じ 0.02 倍を形に焼き込む）。FBX への変換は Blender で行う（orgel_handoff.md §5）
================================================================ */
if(PARAMS.has('export')){
  window.__exportOrgel = async (trackId)=>{
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const tr = TRACKS.find(t=>t.id === trackId) || TRACKS[0];
    orgel.setTrack(tr);
    const P = orgel.exportParts();
    const baseOf = new Map(interior.map(o=>[o.m, o.base]));
    const NAMES = { 0xa98549:'Brass', 0x7f6038:'Brass_Dark', 0xb6b8bb:'Steel', 0x7a7c80:'Steel_Dark', 0x55535c:'Lead',
                    0x6f4a3c:'Wood', 0x533427:'Wood_Dark', 0xd6bd96:'Inlay', 0xa6c0c8:'Lining', 0xeef3f7:'Mirror', 0x4a3346:'Keyhole', 0xc3c9d6:'Pin' };
    const mats = new Map();
    const matFor = (m, hexOverride)=>{
      const c = hexOverride !== undefined ? new THREE.Color(hexOverride) : (baseOf.get(m) || m.color);
      const hex = c.getHex();
      if(!mats.has(hex)) mats.set(hex, new THREE.MeshStandardMaterial({ name:NAMES[hex] || ('Color_' + hex.toString(16)), color:c.clone(), roughness:.7, metalness:0, side:m.side }));
      return mats.get(hex);
    };
    const isOutline = m=>m.isMeshBasicMaterial && m.side === THREE.BackSide;
    const K = ORGEL_SCALE;
    // 静止の姿勢
    const saved = [P.cyl, P.shaft2, P.shaft3, P.fan, P.barrel, P.lidPivot, ...P.teeth.map(t=>t.pivot)].map(o=>[o, o.rotation.clone()]);
    for(const [o] of saved) o.rotation.set(0, 0, 0);
    orgelRoot.updateMatrixWorld(true);
    const counter = {};
    function copy(src, parentName){
      if(src.isLight || src.isPoints) return null;
      if(src.isMesh && !Array.isArray(src.material) && isOutline(src.material)) return null;
      let node;
      if(src.isInstancedMesh){
        node = new THREE.Group();
        const m4 = new THREE.Matrix4();
        for(let i=0;i<src.count;i++){
          src.getMatrixAt(i, m4);
          const g = src.geometry.clone(); g.applyMatrix4(m4); g.scale(K, K, K);
          const pm = new THREE.Mesh(g, matFor(src.material, P.PIN_BASE.getHex())); pm.name = 'Pin_' + String(i+1).padStart(3,'0');
          node.add(pm);
        }
      } else if(src.isMesh){
        const g = src.geometry.clone(); g.scale(K, K, K);
        node = new THREE.Mesh(g, Array.isArray(src.material) ? src.material.map(m=>matFor(m)) : matFor(src.material));
      } else node = new THREE.Group();
      node.name = src.name || (()=>{ const k = (parentName || 'Part') + (src.isMesh ? '_Mesh' : '_Group'); counter[k] = (counter[k] || 0) + 1; return k + counter[k]; })();
      node.position.copy(src.position).multiplyScalar(K);
      node.quaternion.copy(src.quaternion);
      for(const ch of src.children){ const c = copy(ch, node.name); if(c) node.add(c); }
      return node;
    }
    const root = new THREE.Group(); root.name = 'Orgel';
    for(const ch of orgelRoot.children){ const c = copy(ch, 'Orgel'); if(c) root.add(c); }
    if(P.pins){ const pg = root.getObjectByName('Cylinder'); const pins = pg && pg.children.find(c=>c.name.startsWith('Cylinder_Group') || c.children.some(x=>x.name.startsWith('Pin_'))); if(pins) pins.name = 'Pins'; }
    const anchor = new THREE.Object3D(); anchor.name = 'MechAnchor'; root.add(anchor);   // 機構の底面中心（箱の差し替えの仕様）
    for(const [o, r] of saved) o.rotation.copy(r);
    const glb = await new GLTFExporter().parseAsync(root, { binary:true, onlyVisible:false });
    let bin = ''; const u8 = new Uint8Array(glb);
    for(let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
    let meshes = 0; root.traverse(o=>{ if(o.isMesh) meshes++; });
    return { b64:btoa(bin), meshes, teeth:P.teeth.length, track:tr.title };
  };
}

/* ---- フレームレート表示（?fps のときだけ。制作用。公開時はこの節と #fps の CSS を外す） ---- */
const fpsMeter = (()=>{
  if(!PARAMS.has('fps')) return null;
  const el = document.createElement('div'); el.id = 'fps'; el.textContent = 'fps …'; document.body.appendChild(el);
  let n = 0, t0 = performance.now(), worst = 0, prev = t0;
  return now=>{
    n++; worst = Math.max(worst, now - prev); prev = now;
    if(now - t0 >= 1000){
      el.textContent = `fps ${(n*1000/(now - t0)).toFixed(0)}  平均 ${((now - t0)/n).toFixed(1)}ms  最長 ${worst.toFixed(0)}ms`;
      n = 0; t0 = now; worst = 0;
    }
  };
})();


/* ================================================================
   撮影モード（?capture、制作版のみ）：宣伝動画を1コマずつ書き出すための仕組み。
   tools/promo/render.mjs が使う。手順と設定は tools/promo/README.md
   ・時間は実時間でなく、1コマ = 1/fps 秒ずつ進める（重い環境でも動きと音がずれない）
   ・曲は鳴らさず、曲の位置だけをコマに合わせて進める。音はあとでオフラインで同じ時間軸に書き出す
   ・鳥の声は撮影中に起きた時刻を記録しておき、音の書き出しで同じ時刻に鳴らす
================================================================ */
const CAP = { cam:null, time:0, rec:false, chirps:[], offline:false, playing:false, pos0:0, daySpeed:0, hold:null, day0:0 };
if(CAPTURE){
  document.body.classList.add('capturing');
  const V = a=>new THREE.Vector3(...a);
  const ease = t=>t*t*(3 - 2*t);   // 端でゆっくり、中で速い
  /* 単調な3次補間（Fritsch–Carlson）。キーの間で行き過ぎたり戻ったりしない */
  function smoothKeys(K, t){
    const n = K.length;
    if(t <= K[0][0]) return K[0][1];
    if(t >= K[n-1][0]) return K[n-1][1];
    const d = [], m = [];
    for(let i=0;i<n-1;i++) d.push((K[i+1][1] - K[i][1])/(K[i+1][0] - K[i][0]));
    m.push(d[0]);
    for(let i=1;i<n-1;i++) m.push(d[i-1]*d[i] <= 0 ? 0 : (d[i-1] + d[i])/2);
    m.push(d[n-2]);
    for(let i=0;i<n-1;i++){
      if(d[i] === 0){ m[i] = m[i+1] = 0; continue; }
      const a = m[i]/d[i], b = m[i+1]/d[i], h = a*a + b*b;
      if(h > 9){ const r = 3/Math.sqrt(h); m[i] = r*a*d[i]; m[i+1] = r*b*d[i]; }
    }
    let i = 0; while(t > K[i+1][0]) i++;
    const h = K[i+1][0] - K[i][0], u = (t - K[i][0])/h, u2 = u*u, u3 = u2*u;
    return (2*u3 - 3*u2 + 1)*K[i][1] + (u3 - 2*u2 + u)*h*m[i] + (-2*u3 + 3*u2)*K[i+1][1] + (u3 - u2)*h*m[i+1];
  }
  CAP.advance = dt=>{
    CAP.time += dt;
    if(CAP.daySpeed){ dayT += dt*CAP.daySpeed; if(dayT >= 1){ dayT -= 1; dayCount++; } }
    if(CAP.playing){ song.pos = (song.pos + dt) % song.track.loopSec; }
  };
  window.__cap = {
    ready:()=>birds.length > 0 && birds.every(b=>b.mode !== 'fly' && !b.loading),
    // 撮る前の準備：時刻・曲・鳥を決め、warmup 秒だけ（曲を止めたまま）進めて落ち着かせる
    setup:cfg=>{
      timeSpeed = 0; dayT = cfg.dayKeys ? cfg.dayKeys[0][1] % 1 : cfg.dayT; CAP.daySpeed = 0;
      CAP.hold = cfg.birdArrive || null;   // 鳥ごとの「飛来を始めてよい撮影の秒」。準備の間は全員待たせる
      // 飛来の秒を指定した鳥は、居なかったことにして始める（?birds だと開いた時点で止まり木に居るため）
      if(CAP.hold) for(const b of birds) if(CAP.hold[b.idx] != null){
        b.mode = 'away'; b.model.visible = false; b.arriveAt = -1; b.leaveAt = -1; b.singing = false; b.seated = false;
      }   // 準備の間は時刻を止める（撮影の 0 秒が cfg.dayT になるように）
      const idx = Math.max(0, TRACKS.findIndex(t=>t.id === cfg.track));
      currentTrackIdx = idx; song.track = TRACKS[idx]; orgel.setTrack(song.track);
      song.pos = 0; song.speed = 1; song.started = false; isPlaying = false; CAP.playing = false;
      CAP.cam = { pos:V(cfg.camA.pos), target:V(cfg.camA.target), fov:cfg.camA.fov };
      const n = Math.round((cfg.warmup || 0)*cfg.fps);
      for(let i=0;i<n;i++) stepFrame(1/cfg.fps, 0, true);   // 準備のコマは描かない（描画が溜まって遅くなる）
      return { warmFrames:n };
    },
    // 撮影開始：曲を頭から（曲の位置 0）。ここからの時刻が動画の 0 秒
    start:cfg=>{
      CAP.time = 0; CAP.rec = true; CAP.chirps = []; CAP.daySpeed = cfg.dayKeys ? 0 : cfg.daySeconds ? 1/cfg.daySeconds : 0;
      CAP.day0 = dayCount;
      if(cfg.play){ song.pos = 0; song.started = true; isPlaying = true; CAP.playing = true; }
      window.__cap.pose(cfg, 0); renderer.render(scene, camera);
    },
    // 画角：keys（[{t, pos, target, fov}…]、時刻順）があれば隣り合う画角の間を滑らかに移る（同じ画角を続けると留まる）。
    // 無ければ camA → camB を move の間に移る
    pose:(cfg, t)=>{
      // 時刻：dayKeys（[秒, 時刻]…。時刻は 1 を越えて翌日へ続けてよい）があれば、その間を滑らかに（速さが急に変わらないように）つなぐ
      if(cfg.dayKeys){ const v = smoothKeys(cfg.dayKeys, t); dayT = v - Math.floor(v); dayCount = CAP.day0 + Math.floor(v); }
      let a, b, k;
      if(cfg.keys){
        const K = cfg.keys; let i = 0;
        while(i < K.length - 2 && t >= K[i+1].t) i++;
        a = K[i]; b = K[Math.min(i + 1, K.length - 1)];
        k = b.t > a.t ? ease(Math.min(1, Math.max(0, (t - a.t)/(b.t - a.t)))) : 0;
      } else {
        a = cfg.camA; b = cfg.camB || cfg.camA;
        k = cfg.move ? ease(Math.min(1, Math.max(0, (t - (cfg.move.start || 0))/cfg.move.seconds))) : 0;
      }
      CAP.cam.pos.copy(V(a.pos)).lerp(V(b.pos), k);
      CAP.cam.target.copy(V(a.target)).lerp(V(b.target), k);
      CAP.cam.fov = a.fov + (b.fov - a.fov)*k;
    },
    // 1コマ進める（frame 1 以降）
    frame:(cfg, i)=>{ window.__cap.pose(cfg, i/cfg.fps); stepFrame(1/cfg.fps, 0); },
    // 音の書き出し：同じ時間軸で曲（全パート）と鳥の声をオフラインで合成し、WAV（base64）を返す
    renderAudio:async (cfg, seconds)=>{
      const SR = 48000, tail = 2.5;
      const off = new OfflineAudioContext(2, Math.ceil(SR*(seconds + tail)), SR);
      CAP.offline = true; activeNodes = [];
      buildAudioGraph(off); masterGain.gain.value = volume;
      const tr = TRACKS.find(t=>t.id === cfg.track), insts = trackInstruments(tr);
      for(const part of PARTS){
        for(const [t, midi, dur, vel] of (tr[part] || [])){
          for(let loop = 0; loop*tr.loopSec + t < seconds; loop++){
            const at = loop*tr.loopSec + t;
            (INSTRUMENTS[insts[part]] || INSTRUMENTS[DEFAULT_INSTRUMENTS[part]])(at, midi, dur, vel);
          }
        }
      }
      for(const [t, m, vol, style, cents] of CAP.chirps) if(t < seconds) chirp(m, vol, style, cents, t);
      const buf = await off.startRendering();
      CAP.offline = false;
      // 16bit の WAV にする（尾の残響も含める）
      const n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(1)];
      const out = new DataView(new ArrayBuffer(44 + n*4));
      const str = (o, x)=>{ for(let i=0;i<x.length;i++) out.setUint8(o + i, x.charCodeAt(i)); };
      str(0,'RIFF'); out.setUint32(4, 36 + n*4, true); str(8,'WAVE'); str(12,'fmt '); out.setUint32(16, 16, true);
      out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, SR, true); out.setUint32(28, SR*4, true);
      out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36,'data'); out.setUint32(40, n*4, true);
      for(let i=0, o=44; i<n; i++) for(let c=0;c<2;c++, o+=2){ const v = Math.max(-1, Math.min(1, ch[c][i])); out.setInt16(o, v < 0 ? v*0x8000 : v*0x7fff, true); }
      const u8 = new Uint8Array(out.buffer); let bin = '';
      for(let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return { b64:btoa(bin), chirps:CAP.chirps.length };
    },
  };
}

/* ---------- ループ ---------- */
let last = performance.now(), clock = 0, curtainTick = 0;
const LOOK = new THREE.Vector3();
applyTime(dayT);
paintWindows(cur, litFrac(dayT), true);
function stepFrame(dt, now, noRender){
  clock += dt;
  if(CAPTURE) CAP.advance(dt);

  dayT += dt*timeSpeed/DAY_LEN;
  if(dayT >= 1){ dayT -= 1; dayCount++; }
  applyTime(dayT);
  refreshDebug();

  const k = Math.min(1, dt*6);
  ORBIT.cAz += (ORBIT.az - ORBIT.cAz)*k; ORBIT.cEl += (ORBIT.el - ORBIT.cEl)*k;
  ORBIT.cDist += (ORBIT.dist - ORBIT.cDist)*k; ORBIT.cPan.lerp(ORBIT.pan, k);
  LOOK.copy(ORBIT_CENTER).addScaledVector(ORBIT.cPan, Math.min(1, ORBIT.cDist/3.2));
  camera.position.set(
    LOOK.x + Math.sin(ORBIT.cAz)*Math.cos(ORBIT.cEl)*ORBIT.cDist,
    LOOK.y + Math.sin(ORBIT.cEl)*ORBIT.cDist,
    LOOK.z + Math.cos(ORBIT.cAz)*Math.cos(ORBIT.cEl)*ORBIT.cDist);
  // カメラは部屋の中に留める（壁・床・天井を抜けて外が見えないように）
  camera.position.x = THREE.MathUtils.clamp(camera.position.x, -ROOM_W/2 + .3, ROOM_W/2 - .3);
  camera.position.y = THREE.MathUtils.clamp(camera.position.y, ROOM_FLOOR + .3, ROOM_CEIL - .3);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, .25, ROOM_D - .3);
  camera.lookAt(LOOK);
  const fixedCam = CAPTURE ? CAP.cam : manualCam;   // 撮影、またはデバッグの手入力：画角を数値で直接与える
  if(fixedCam){
    camera.position.copy(fixedCam.pos); LOOK.copy(fixedCam.target);
    camera.fov = fixedCam.fov; camera.updateProjectionMatrix(); camera.lookAt(LOOK);
  }

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  hills.position.set(camera.position.x, 0, camera.position.z);
  sun.position.copy(camera.position).addScaledVector(sunDir, ORB_DIST); sun.lookAt(camera.position);
  moon.position.copy(camera.position).addScaledVector(moonDir, ORB_DIST); moon.lookAt(camera.position);
  seaMat.uniforms.uT.value = clock*MOTION;
  starMat.uniforms.uTime.value = clock;

  clouds.forEach(c=>{
    c.position.x += c.userData.v*dt;
    if(c.position.x > 600) c.position.x = -600;
  });
  boats.forEach(b=>{
    const ph = b.userData.phase;
    b.position.y = SEA_Y + .12 + Math.sin(clock*1.1 + ph)*.06*MOTION;
    b.rotation.z = Math.sin(clock*.9 + ph)*.05*MOTION;
  });

  beamPivot.rotation.y = clock*.7*MOTION;
  {
    const bx = Math.cos(beamPivot.rotation.y), bz = -Math.sin(beamPivot.rotation.y);
    const tx = camera.position.x - lhX, tz = camera.position.z - lhZ;
    const tl = Math.hypot(tx,tz);
    const facing = Math.max(0, (bx*tx + bz*tz)/tl);
    const flash = Math.pow(facing, 30);
    const s = 1.6 + flash*6*beamMat.uniforms.uOp.value/.18;
    lhGlow.scale.set(s, s, 1);
  }

  curtainTick += dt;
  if(curtainTick > 1/30){
    curtainTick = 0;
    curtains.forEach(c=>{
      const pa = c.m.geometry.attributes.position;
      const arr = pa.array, b = c.base;
      for(let i=0;i<pa.count;i++){
        const x = b[i*3], y = b[i*3+1];
        const u = (x + c.w/2)/c.w;
        const v = (c.h/2 - y)/c.h;
        const pleat = Math.sin(u*19)*.035;
        const wave = Math.sin(u*6 + clock*1.2 + c.sign*2)*.045*v*MOTION;
        const breeze = (Math.sin(clock*.55 + c.sign) *.5 + .5) * v*v * .09 * MOTION;
        arr[i*3] = x - c.sign*breeze*.6;
        arr[i*3+2] = pleat + wave + breeze*.5;
      }
      pa.needsUpdate = true;
      c.m.geometry.computeVertexNormals();
    });
  }
  orgel.update(dt);
  birdsUpdate(dt);
  // 発光する鳥：明るさがゆっくり脈打つ（正弦波。点滅に見えないよう穏やかに）
  for(const b of birds) if(b.glowPh >= 0) b.body.material.emissiveIntensity = BIRD_GLOW.BASE + BIRD_GLOW.PULSE*Math.sin(clock*Math.PI*2/BIRD_GLOW.PERIOD + b.glowPh);
  for(const b of birds){
    if(b.neck) b.neck.quaternion.copy(b.neckClip);
    if(b.head) b.head.quaternion.copy(b.headClip);
    b.mixer.update(dt);
    if(b.neck) b.neckClip.copy(b.neck.quaternion);
    if(b.head) b.headClip.copy(b.head.quaternion);
    birdNeck(b, dt);
  }
  // ピンが櫛歯を弾いた位置に音符
  for(const ti of orgel.struck){ orgel.tipWorld(ti, _beak); emitNote(_beak, orgel.teeth[ti].midi, .6); }
  updateNotes(dt);
  if(guide.visible) ring.material.opacity = .55 + Math.sin(clock*3)*.35;

  if(!noRender) renderer.render(scene, camera);
  if(fpsMeter) fpsMeter(now);
}
if(!CAPTURE) renderer.setAnimationLoop(now=>{
  const dt = Math.min((now - last)/1000, .05);
  last = now;
  stepFrame(dt, now);
});
</script>
