<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音綴り - OtoTsuzuri -</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --bg:#141238; --ink:#fff4dc; --ink-dim:rgba(255,244,220,.7);
    --panel:rgba(30,24,58,.5); --line:rgba(255,228,196,.28);
    --accent:#ffd494; --accent-ink:#3a2a30;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; }
  body{
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #c{ position:fixed; top:0; left:0; width:100%; height:100%; display:block; }
  #paper{
    position:fixed; inset:0; pointer-events:none; opacity:.32; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .52  0 0 0 0 .47  0 0 0 0 .44  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(18,12,38,.42) 100%);
  }
  #tag{ position:fixed; top:0; left:0; padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0; pointer-events:none; }
  #tag h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:.1em; text-shadow:0 1px 10px rgba(20,10,40,.5); }
  #tag h1 span{ font-size:12px; font-weight:500; letter-spacing:.06em; color:var(--ink-dim); margin-left:.4em; }
  #hint{
    position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom,0px));
    margin:0; text-align:center; font-size:12px; color:var(--ink-dim); letter-spacing:.08em;
    pointer-events:none; transition:opacity 1.2s;
  }
  /* デバッグ表示（?debug のときだけ出す） */
  #dbg{
    display:none; position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding:8px 10px; border-radius:12px; background:var(--panel); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); font-size:12px;
  }
  #dbg.on{ display:block; }
  #dbg .row{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  #dbg input[type=range]{ flex:1; }
  #dbg button{
    font-family:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer;
  }
  #dbg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  #dbg #tLabel{ min-width:9em; }
  #dbg #camEdit{ flex-wrap:wrap; }
  #dbg #camEdit[hidden]{ display:none; }
  #dbg #camEdit label{ display:flex; align-items:center; gap:4px; }
  /* 16px 未満だと iPhone は入力のときに画面を拡大してしまう */
  #dbg #camEdit input{ font:16px ui-monospace,Menlo,monospace; width:10.5em; padding:2px 6px; border-radius:6px;
    border:1px solid var(--line); background:rgba(255,255,255,.08); color:var(--ink); }
  #dbg #camEdit input.short{ width:3.5em; }
  #dbg #camLabel{ flex:1; font:12px/1.35 ui-monospace,Menlo,monospace; white-space:pre; user-select:text; -webkit-user-select:text; }
  /* 再生の操作（v10 の構成。鍵盤はない）
     アイコンと外枠はユーザーの手描きに差し替える前提。
     アイコン：ICONS（script 内）に画像を入れるとボタンの文字の代わりに表示される。
     外枠：assets/ui/player_frame.png を置くだけで差し替わる（無いあいだは今の枠）。9分割で使う。
       --frame-corner  画面上の隅の寸法（四隅は変形させない）。画像の切り位置はこの3倍（3倍で描く前提）
       上下左右の辺は伸ばさずに繰り返す（round）。中央の地は今の背景のまま */
  :root{ --frame-corner:60px; --player-max:520px; }
  #player.has-frame{
    border:1px solid transparent; border-image-source:var(--frame-img);
    border-image-width:var(--frame-corner); border-image-repeat:round;   /* border-image-slice は JS が隅×3 で入れる */
  }
  /* 手描きのボタン：ボタン全体を画像で描く（円・縁取り・地の色も画像の中）。CSS の縁取りと地の色は消す */
  /* ボタンごとの指定（#playBtn の background 一括指定など）に負けないよう !important で上書きする */
  button.hasIcon{ font-size:0 !important; color:transparent !important; padding:0 !important; border:0 !important; border-radius:0 !important;
    background-color:transparent !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
    background-size:contain !important; background-position:center !important; background-repeat:no-repeat !important; }
  #listBtn{
    position:fixed; top:0; right:16px; margin-top:calc(14px + env(safe-area-inset-top,0px));
    font:500 12.5px/1 inherit; font-family:inherit; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 14px;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer;
  }
  #player{
    position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:var(--player-max);   /* 広い画面では中央に寄せる */
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding:10px 14px 8px; border-radius:16px; background:var(--panel); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  #nowPlaying{ text-align:center; }
  #npTitle{ font-size:15px; font-weight:700; letter-spacing:.06em; }
  #npSubtitle{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  #transport{ display:flex; justify-content:center; align-items:center; gap:18px; margin-top:6px; }
  .transportBtn{
    font-family:inherit; font-size:18px; color:var(--ink); background:transparent; border:1px solid var(--line);
    border-radius:999px; width:44px; height:44px; cursor:pointer;
  }
  #playBtn{ width:54px; height:54px; font-size:22px; background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  #subRow{ display:flex; align-items:center; gap:10px; margin-top:6px; }
  #modeBtn, #birdBtn{ font-family:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  #muteBtn{ font-size:16px; background:transparent; border:0; color:var(--ink); cursor:pointer; }
  #volSlider{ flex:1; accent-color:var(--accent); }
  .modalOverlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,8,24,.55); z-index:10; }
  .modalOverlay.show{ display:flex; }
  .modal{ width:min(92vw, 420px); max-height:80vh; overflow:auto; padding:14px; border-radius:16px; background:rgba(30,24,58,.92); border:1px solid var(--line); }
  .modal h2{ margin:0 0 10px; font-size:15px; }
  .trackRow{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px; cursor:pointer; }
  .trackRow.active, .trackRow:hover{ background:rgba(255,255,255,.08); }
  .trackRow .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .tTitle{ font-size:14px; font-weight:700; }
  .tSub{ font-size:11px; color:var(--ink-dim); }
  .modalCloseBtn{ margin-top:10px; width:100%; font-family:inherit; font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:8px; cursor:pointer; }
  #hint{ bottom:calc(192px + env(safe-area-inset-bottom,0px)); }
  #dbg{ bottom:calc(186px + env(safe-area-inset-bottom,0px)); }
  /* フレームレート表示（?fps のときだけ。制作用。公開時はこの1行と、末尾の「フレームレート表示」節を外す） */
  #fps{ position:fixed; left:8px; top:calc(52px + env(safe-area-inset-top,0px)); z-index:30; font:11px/1.3 ui-monospace,Menlo,monospace; color:#fff; background:rgba(10,8,24,.72); border-radius:6px; padding:4px 7px; pointer-events:none; white-space:pre; }
  /* 撮影中は UI を出さない（紙目と周辺減光は絵の一部なので残す） */
  body.capturing #tag, body.capturing #hint, body.capturing #player, body.capturing #listBtn, body.capturing #dbg, body.capturing #fps, body.capturing .modalOverlay{ display:none !important; }
</style>
</head>
<body>
<canvas id="c" aria-label="海辺の町を見下ろす窓辺の風景"></canvas>
<div id="paper"></div>
<div id="vignette"></div>

<header id="tag">
  <h1>音綴り<span>- OtoTsuzuri -</span></h1>
</header>
<button id="listBtn">🎵 曲一覧</button>
<div id="player">
  <div id="nowPlaying"><div id="npTitle">-</div><div id="npSubtitle">タップして再生</div></div>
  <div id="transport">
    <button class="transportBtn" id="prevBtn" aria-label="前の曲">⏮</button>
    <button class="transportBtn" id="playBtn" aria-label="再生">▶</button>
    <button class="transportBtn" id="nextBtn" aria-label="次の曲">⏭</button>
  </div>
  <div id="subRow">
    <button id="modeBtn">🔂 1曲</button>
    <button id="birdBtn" aria-pressed="true">🐦 声</button>
    <button id="muteBtn" aria-label="消音">🔊</button>
    <input type="range" id="volSlider" min="0" max="100" value="55" aria-label="音量">
  </div>
</div>
<div class="modalOverlay" id="listModal">
  <div class="modal" role="dialog" aria-label="曲一覧">
    <h2>曲一覧</h2>
    <div id="trackList"></div>
    <button class="modalCloseBtn" id="listCloseBtn">とじる</button>
  </div>
</div>
<p id="hint">ドラッグで回る／二本指で寄る／鳥に触れると鳴く</p>

<div id="dbg">
  <div class="row"><span id="tLabel">-</span><span id="buildTag" style="opacity:.6">build 0603a</span><input type="range" id="tSlider" min="0" max="1000" value="0"></div>
  <div class="row"><span id="camLabel">-</span><button id="camCopy">画角をコピー</button><button id="camEditBtn" aria-pressed="false">入力</button></div>
  <div class="row" id="camEdit" hidden>
    <label>位置<input id="camPos" inputmode="decimal" autocomplete="off" spellcheck="false"></label>
    <label>注視<input id="camTgt" inputmode="decimal" autocomplete="off" spellcheck="false"></label>
    <label>画角<input id="camFov" inputmode="decimal" autocomplete="off" class="short"></label>
    <button id="camApply">適用</button><button id="camFree">解除</button>
  </div>
  <div class="row">
    <span>速さ</span>
    <button data-speed="0">停止</button><button data-speed="1">×1</button><button data-speed="10">×10</button><button data-speed="60">×60</button>
    <button id="spotBtn" aria-pressed="false">置き場所</button><button id="windBtn">ゼンマイ切れ</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script>
  window.__err = null;
  window.addEventListener('error', e=>{ window.__err = (window.__err||'') + e.message + '\n'; });
  window.addEventListener('unhandledrejection', e=>{ window.__err = (window.__err||'') + String(e.reason) + '\n'; });
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reduceMotion ? 0.25 : 1;
/* 制作版と公開版の切り替え。公開版（リポジトリ直下の index.html）は tools/build_public.mjs が
   このファイルから作り、DEV を false・素材の場所を書き換える。公開版では URL 引数を読まないので、
   デバッグ表示・?fps・?export・確認用の引数・テスト用の覗き窓はすべて動かない */
const DEV = true;
const ROOT = '../';                                   // リポジトリ直下への相対パス（公開版では ''）
const PARAMS = new URLSearchParams(DEV ? location.search : '');
/* 撮影モード（?capture、制作版のみ）：時間をコマ単位で進めて書き出す。乱数も種で固定して、毎回同じ絵にする */
const CAPTURE = PARAMS.has('capture');
if(CAPTURE){
  let sd = (parseInt(PARAMS.get('seed')) || 1) >>> 0;
  Math.random = ()=>{ sd |= 0; sd = sd + 0x6D2B79F5 | 0; let t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; };
}

/* ================================================================
   一日の時計
   dayT：0 が真夜中、1 で一周。一日の長さは DAY_LEN 秒（ここだけで変える）。
   ?t=0.66 で時刻を固定、?speed=60 で早送り、?debug でスライダーを出す。
================================================================ */
const DAY_LEN = 720;                 // 一日 = 12 分
const DAY_START = 0.62;              // 開いたときは夕方
const SUNRISE = 0.08, SUNSET = 0.70; // 太陽が水平線を越える時刻
const MOONRISE = 0.74, MOONSET = 1.06;   // 月（翌朝 0.06 に沈む）
const MOON_CYCLE_DAYS = 30;          // 満ち欠けの一周り（ゲーム内の日数。実時間で6時間）
let dayT = PARAMS.has('t') ? parseFloat(PARAMS.get('t')) : DAY_START;
let dayCount = 0;                    // 経過した日数（満ち欠け用）
let timeSpeed = PARAMS.has('t') ? 0 : (parseFloat(PARAMS.get('speed')) || 1);

/* ---------- 乱数（毎回同じ町並みになるよう固定シード） ---------- */
let seed = 20260924;
function rnd(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
const clamp01 = x => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a)/(b - a)); return t*t*(3 - 2*t); };

/* ---------- レンダラ ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);   // 画素密度の上限（羽結びと同じ）
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x34325f, 40, 420);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 4000);

/* ---------- 色の受け渡し ---------- */
// 自前シェーダーは色空間の変換を通らないので、sRGB の値にして渡す
function srgb(hex){ const c = new THREE.Color(hex); c.convertLinearToSRGB(); return new THREE.Vector3(c.r, c.g, c.b); }
function toSrgb(v, c){ const s = c.clone().convertLinearToSRGB(); v.set(s.r, s.g, s.b); return v; }

const GLSL_NOISE = `
// sin(巨大な数) は iOS の GPU で精度が落ちて画素がばらける（海に白い斑が出た）。sin を使わない式にする
float hash(vec2 p){ p=fract(p*vec2(.1031,.1030)); p+=dot(p,p.yx+33.33); return fract((p.x+p.y)*p.x); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.),f.x), f.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+17.; a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=p*2.03+17.; a*=.5; } return v*1.107; }
`;

/* ================================================================
   配色：夜明け・朝・昼・夕方・夜 の5つを基準点にして補間する
   昼は羽結び（一日目・海渡り）の配色を下敷きにしている。
================================================================ */
const KEYS = [
  { t:.07, name:'夜明け',
    skyTop:0x5a6aa8, skyBot:0xf1c9b4, glow:0xffb98a, fog:0xd9c9c9,
    seaDeep:0x4f6893, seaLight:0xa8b4c8, hills:[0x8f9ab8,0x74809f,0x5e6a8a], cloud:0xe8c9c6,
    hemiSky:0xc9c7de, hemiGround:0x6a6480, hemiI:1.2, sunColor:0xffd3b0, sunI:1.0,
    stars:.25, inLight:0x6c6a80, ground:0x7a7693, glass:0x9ca6c8 },
  { t:.18, name:'朝',
    skyTop:0x7fa8d8, skyBot:0xf3e4cf, glow:0xfff0cc, fog:0xe6e1d2,
    seaDeep:0x6f9fae, seaLight:0xbfd5cf, hills:[0xb7c6c4,0x9bb0b0,0x80999a], cloud:0xfffaf2,
    hemiSky:0xe8eef5, hemiGround:0xa8b0c8, hemiI:1.8, sunColor:0xfff1d6, sunI:2.2,
    stars:0, inLight:0xaaa49c, ground:0x8f9a86, glass:0xb9c9d8 },
  { t:.42, name:'昼',
    skyTop:0xf4c49a, skyBot:0xf2e5c9, glow:0xffd9a8, fog:0xf0e2c6,
    seaDeep:0x7fa3a0, seaLight:0xc2d3c2, hills:[0xc2cfb2,0xa7bca6,0x87a39a], cloud:0xfff6e8,
    hemiSky:0xfbe6cc, hemiGround:0xc6bff4, hemiI:1.7, sunColor:0xffe4c0, sunI:1.8,
    stars:0, inLight:0xb8b2a8, ground:0x9aa88c, glass:0xc6d3c9 },
  { t:.66, name:'夕方',
    skyTop:0x6a6eae, skyBot:0xffd3a2, glow:0xffb070, fog:0xefbba1,
    seaDeep:0x4d6098, seaLight:0xc3919e, hills:[0xa08aa6,0x7f6d92,0x68587e], cloud:0xf4baae,
    hemiSky:0xf2c4b5, hemiGround:0x6b5b7b, hemiI:1.3, sunColor:0xffc79f, sunI:1.6,
    stars:.1, inLight:0x8c8088, ground:0x8e80a1, glass:0xcaa0a8 },
  { t:.85, name:'夜',
    skyTop:0x15133a, skyBot:0x474486, glow:0x8d8fc0, fog:0x4c487c,
    seaDeep:0x1a2654, seaLight:0x34427e, hills:[0x393a6c,0x2f2f5e,0x27274f], cloud:0x56548a,
    hemiSky:0x6c72b8, hemiGround:0x2c2648, hemiI:.9, sunColor:0xb7c3ff, sunI:.6,
    stars:1, inLight:0x4a4864, ground:0x4a4878, glass:0x363566 },
];
const COLOR_KEYS = ['skyTop','skyBot','glow','fog','seaDeep','seaLight','cloud','hemiSky','hemiGround','sunColor','inLight','ground','glass'];
const NUM_KEYS = ['hemiI','sunI','stars'];
function makePal(src){
  const p = { hills:[] };
  for(const k of COLOR_KEYS) p[k] = new THREE.Color(src ? src[k] : 0);
  for(const k of NUM_KEYS) p[k] = src ? src[k] : 0;
  for(let i=0;i<3;i++) p.hills.push(new THREE.Color(src ? src.hills[i] : 0));
  return p;
}
const PALS = KEYS.map(makePal);
const cur = makePal(null);
let curName = '';
function evalPalette(t){
  t = ((t % 1) + 1) % 1;
  let i = KEYS.length - 1;
  for(let k=0;k<KEYS.length;k++){ if(t >= KEYS[k].t) i = k; }
  const j = (i + 1) % KEYS.length;
  const a = KEYS[i].t, b = KEYS[j].t + (j === 0 ? 1 : 0);
  const tt = t < a ? t + 1 : t;
  const e = sstep(a, b, tt);
  const A = PALS[i], B = PALS[j];
  for(const k of COLOR_KEYS) cur[k].copy(A[k]).lerp(B[k], e);
  for(const k of NUM_KEYS) cur[k] = A[k] + (B[k] - A[k])*e;
  for(let h=0;h<3;h++) cur.hills[h].copy(A.hills[h]).lerp(B.hills[h], e);
  curName = e < .5 ? KEYS[i].name : KEYS[j].name;
}

/* ---------- 時刻から決まる量 ---------- */
// 上がる区間 [a,b] と下がる区間 [c,d] を持つ 0/1 のスイッチ
function onOff(t, a, b, c, d){
  const rise = sstep(a, b, t), fall = 1 - sstep(c, d, t);
  if(a < c) return Math.min(rise, fall);          // 同じ日の中で点いて消える
  return Math.max(rise, fall);                      // 日をまたぐ（夜に点いて朝に消える）
}
const lampsOn   = t => onOff(t, .63, .70, .05, .10);   // 街灯・灯台・ランタン・小舟
const roomOn    = t => onOff(t, .58, .62, .79, .81);   // 室内の照明。家主は早寝
// 鳥が座って休む時間：完全に夜になってから（0.80〜0.83）、空が白み始めて明るくなってきた頃（0.955〜0.975）まで
const BIRD_WAKE_T = .965;                                 // 起きる時刻（birdNight が 0.5 を下回る）
const birdNight = t => onOff(t, .80, .83, BIRD_WAKE_T - .01, BIRD_WAKE_T + .01);
const BIRD_SIT_T = .815;                                 // 座り始める時刻（birdNight が 0.5 を越える）
const beforeSit = sec => BIRD_SIT_T - sec/DAY_LEN;      // 座り始める sec 秒前の時刻（一日の長さを変えても秒で保つ）
const afterWake = sec => (BIRD_WAKE_T + sec/DAY_LEN) % 1; // 起きてから sec 秒後の時刻
function litFrac(t){                                   // 町の窓明かりの割合
  if(t < .04) return .12;
  if(t < .10) return .12*(1 - sstep(.04, .10, t));
  if(t < .60) return 0;
  if(t < .74) return .85*sstep(.60, .74, t);
  if(t < .80) return .85;
  if(t < .95) return .85 - .73*sstep(.80, .95, t);
  return .12;
}

// 窓は南向き。太陽は左（東）から昇って右（西）へ沈む。弧は画角に寄せて狭めてある
// 窓の上端は視線から約17°。太陽は沈む前、月は一晩じゅう窓の中に入る高さにしてある
const sunDir = new THREE.Vector3(0, 1, 0), moonDir = new THREE.Vector3(0, 1, 0);
function arcDir(out, p, azSpan, elMax){
  const az = (p - .5)*azSpan, el = Math.sin(Math.PI*p)*elMax;
  out.set(Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el));
}
let sunUp = 0, moonUp = 0, moonPhase = 0;
function updateSky(t){
  const p = (t - SUNRISE)/(SUNSET - SUNRISE);
  arcDir(sunDir, p, THREE.MathUtils.degToRad(24), THREE.MathUtils.degToRad(66));
  sunUp = sstep(-.04, .04, sunDir.y);
  let tm = t < MOONSET - 1 ? t + 1 : t;
  const q = (tm - MOONRISE)/(MOONSET - MOONRISE);
  arcDir(moonDir, q, THREE.MathUtils.degToRad(40), THREE.MathUtils.degToRad(14));
  moonUp = (q >= 0 && q <= 1) ? sstep(-.02, .06, moonDir.y) : 0;
  moonPhase = ((dayCount + t)/MOON_CYCLE_DAYS) % 1;
}

const outlineMats = {};
function outlineMat(col){
  if(!outlineMats[col]) outlineMats[col] = new THREE.MeshBasicMaterial({ color:col, side:THREE.BackSide });

function addOutline(mesh, t, col){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = new THREE.Vector3(); g.boundingBox.getSize(s);
  const o = new THREE.Mesh(g, outlineMat(col));
  o.scale.set(s.x > 1e-4 ? (s.x + 2*t)/s.x : 1, s.y > 1e-4 ? (s.y + 2*t)/s.y : 1, s.z > 1e-4 ? (s.z + 2*t)/s.z : 1);
  mesh.add(o);

}
function box(w,h,d,mat,x,y,z,parent,outline,oc){

/* ---------- テクスチャ ----------
   透明に近い画素を持つものは、キャンバスのグラデーションでなく画素を直接書く
   （iOS でキャンバスの半透明画素が虹色の点々に崩れるため） */
function radialTex(n, fn){
  const px = new Uint8Array(n*n*4), c = n/2;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const d = Math.min(1, Math.hypot(x - c + .5, y - c + .5)/c);
    const [r,g,b,a] = fn(d), o = (y*n + x)*4;
    px[o] = r; px[o+1] = g; px[o+2] = b; px[o+3] = a;
  }
  const t = new THREE.DataTexture(px, n, n);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
const glowTex = radialTex(64, d => [255,255,255, 255*Math.pow(1 - d, 2.2)]);
function canvasTex(size, draw, h){
  const c = document.createElement('canvas');
  c.width = size; c.height = h || size;
  draw(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const doilyTex = canvasTex(256, (g,w)=>{
  const c = w/2;
  g.fillStyle = '#fbf3e6';
  g.beginPath();
  for(let i=0;i<=240;i++){
    const a = i/240*Math.PI*2, r = 118 + Math.sin(a*24)*7;
    const x = c + Math.cos(a)*r, y = c + Math.sin(a)*r;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.fill();
  g.globalCompositeOperation = 'destination-out';
  for(let ring=0; ring<3; ring++){
    const rr = 44 + ring*26, n = 12 + ring*8, size = 5 + ring*1.2;
    for(let i=0;i<n;i++){
      const a = i/n*Math.PI*2 + ring*.2;
      g.beginPath(); g.arc(c+Math.cos(a)*rr, c+Math.sin(a)*rr, size, 0, Math.PI*2); g.fill();
    }
  }
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(190,160,140,.5)'; g.lineWidth = 2;
  g.beginPath(); g.arc(c,c,30,0,Math.PI*2); g.stroke();
});

/* ================================================================
   遠山：地平を囲む重なったシルエット。頂点色で下端を霧色へ寄せる。
   海の先は水平線にしたいので、正面は低く、左右の端ほど高くする。
================================================================ */
const HILLS = [
  { r:900, h:60, seed:1.3, bias:-.05, fade:.8 },
  { r:820, h:46, seed:4.1, bias:-.15, fade:.65 },
  { r:740, h:32, seed:7.7, bias:-.30, fade:.5 },
];
const hills = new THREE.Group();
const hillMeshes = [];
for(const L of HILLS){
  const N = 420, pos=[], col=[], mask=[], idx=[];
  for(let i=0;i<=N;i++){
    const a = i/N*Math.PI*2;
    let n = 0.55*Math.sin(a*3+L.seed) + 0.30*Math.sin(a*7+L.seed*2.3)
          + 0.18*Math.sin(a*13+L.seed*5.1) + 0.11*Math.sin(a*29+L.seed*9.7)
          + 0.07*Math.sin(a*61+L.seed*3.3) + 0.04*Math.sin(a*131+L.seed*7.9);
    n = Math.max(0, n*0.5+0.5+L.bias);
    // 視線（-z）からの方位。正面は低くなだらかに、横へ行くほど高く
    let da = a + Math.PI/2; da = Math.atan2(Math.sin(da), Math.cos(da));
    const side = .6 + .4*sstep(.3, 1.1, Math.abs(da));
    const h = (L.h * Math.pow(n,1.1) + 2) * side;
    const x = Math.cos(a)*L.r, z = Math.sin(a)*L.r;
    pos.push(x,h,z, x,-60,z);
    col.push(0,0,0, 0,0,0);
    mask.push(side*L.fade, 0);
    if(i<N){ const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, fog:false, side:THREE.DoubleSide }));
  m.renderOrder = -1;
  hills.add(m);
  hillMeshes.push({ m, mask });
}
scene.add(hills);
const _hc = new THREE.Color();
function paintHills(p){
  hillMeshes.forEach((H, li)=>{
    const top = p.hills[li], fog = p.fog, ca = H.m.geometry.attributes.color;
    for(let i=0;i<ca.count;i++){
      // 下端は霧色、上端も霧色に大きく寄せて、水平線の向こうにうっすら見える程度にする
      _hc.copy(fog).lerp(top, H.mask[i]);
      ca.setXYZ(i, _hc.r, _hc.g, _hc.b);
    }
    ca.needsUpdate = true;
  });
}

/* ================================================================
   海：fbm で歪ませた水彩の濃淡、うねり、太陽と月の照り返し、きらめき、霧。
   波紋・浅瀬・鳥の影は持ってこない。
================================================================ */
const SEA_Y = -6;
const seaMat = new THREE.ShaderMaterial({
  fog:false,
  uniforms:{ uT:{value:0}, uDeep:{value:new THREE.Vector3()}, uLight:{value:new THREE.Vector3()},
             uFog:{value:new THREE.Vector3()}, uNear:{value:50}, uFar:{value:470},
             uSun:{value:sunDir}, uGlow:{value:new THREE.Vector3()}, uSunUp:{value:0}, uSunLow:{value:0},
             uMoon:{value:moonDir}, uMoonCol:{value:new THREE.Vector3(.85,.87,1)}, uMoonUp:{value:0} },
  vertexShader:`varying vec3 vW;
    void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  // 窓から見下ろす静かな海だけを描く。羽結びの海から、この距離では見えない計算を外してある：
  //   近景の細波・近景の波頭・きらめき（静かな海では描いていなかった）、中くらいの模様（5段のノイズ。効きが1割で見えない）。
  //   残したもの：大きな濃淡、細かい波の場（r1/r2）、うねりの法線、照り返し、霧。
  fragmentShader:`precision highp float; varying vec3 vW;
    uniform float uT,uNear,uFar,uSunUp,uSunLow,uMoonUp; uniform vec3 uDeep,uLight,uFog,uSun,uGlow,uMoon,uMoonCol;
    ${GLSL_NOISE}
    vec3 waves(vec2 p, float t){
      vec2 D[4]; D[0]=vec2(.8,.6); D[1]=vec2(-.5,.87); D[2]=vec2(.2,-.98); D[3]=vec2(-.9,-.3);
      float F[4]; F[0]=.35; F[1]=.62; F[2]=1.1; F[3]=1.9;
      float h=0.; vec2 g=vec2(0.);
      for(int i=0;i<4;i++){
        float ph=dot(p,D[i])*F[i] + t*1.6*sqrt(9.8*F[i]);
        float a=.12/F[i];
        h+=a*sin(ph); g+=a*F[i]*cos(ph)*D[i];
      }
      return vec3(g,h);
    }
    void main(){
      vec2 p=vW.xz;
      float dist=length(p-cameraPosition.xz);
      if(dist>=uFar){ gl_FragColor=vec4(uFog,1.); return; }
      float t=uT*2.2;
      float near=1.-smoothstep(25.,110.,dist);

      // 大きな濃淡：歪ませた座標で水彩のむらにする
      vec2 q=p+8.*vec2(fbm3(p*.02+vec2(t*.05,0.)), fbm3(p*.02+vec2(0.,-t*.04)));
      float big=fbm3(q*.005+vec2(t*.012,0.));
      vec3 col=mix(uDeep,uLight,smoothstep(.3,.72,big));
      // 細かい波の場（交差する2方向）。見えている「波」はこれとうねりの法線
      float r1=fbm3(vec2(q.x*.07,q.y*.24)+vec2(t*.35,t*.12));
      float r2=fbm3(vec2(q.x*.22,q.y*.08)+vec2(-t*.22,t*.3));
      col+=(smoothstep(.6,.76,r1)*.05 + smoothstep(.62,.78,r2)*.035)*.3;
      col-=smoothstep(.6,.3,r1*r2*2.)*.006;

      // うねり：風の強いところだけ法線を立てる
      vec3 w=waves(mix(p,q,.7),uT);
      float gust=mix(.3,1.35,smoothstep(.28,.72,fbm3(q*.011+vec2(-t*.03,t*.02))));
      vec2 gsum=w.xy*1.6*gust*.8*.25;
      vec3 n=normalize(vec3(-gsum.x,1.,-gsum.y));
      vec3 v=normalize(vW-cameraPosition);
      vec3 r=reflect(v,n);
      float s=max(dot(r,uSun),0.);

const cloudMats = [];
{
  const cn = (x,y,sd)=>{
    let v=0,a=.5,f=1;
    for(let o=0;o<4;o++){
      const X=x*f+sd*13.1, Y=y*f+sd*7.7, xi=Math.floor(X), yi=Math.floor(Y);
      const fx=X-xi, fy=Y-yi, u=fx*fx*(3-2*fx), w=fy*fy*(3-2*fy);
      const h=(p,q)=>{ const t=Math.sin(p*127.1+q*311.7)*43758.5453; return t-Math.floor(t); };
      v+=a*((h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-w)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*w);
      a*=.5; f*=2;
    }
    return v;
  };
  for(let k=0;k<4;k++){
    const W=256,H=128, px=new Uint8Array(W*H*4);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const nx=(x-W/2)/(W/2), ny=(y-H*.62)/(H*.5);
      let body = 1 - (nx*nx + (ny<0? ny*ny*.9 : ny*ny*4.0));
      body += (cn(x/40,y/40,k)-.5)*1.1;
      const d = Math.min(1, Math.max(0, body*2.2));
      const rim = Math.max(0, 1-Math.abs(body-.08)/.08);
      const ex = Math.min(x, W-1-x)/(W*.12), ey = Math.min(y, H-1-y)/(H*.12);
      const edge = Math.min(1, ex)*Math.min(1, ey);
      const al = (d*.55 + rim*.25) * edge*edge*(3-2*edge);
      const shade = 1 - rim*.08 - Math.max(0,ny)*.06;
      const o=((H-1-y)*W+x)*4;
      px[o]=255*shade; px[o+1]=250*shade; px[o+2]=240*shade; px[o+3]=Math.min(255,al*255);
    }
    const t=new THREE.DataTexture(px,W,H); t.colorSpace=THREE.SRGBColorSpace;
    t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearFilter; t.needsUpdate=true;
    cloudMats.push(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false, opacity:.85 }));
  }
}

function bump(x,z,cx,cz,h,sx,sz){ return h*Math.exp(-(((x-cx)*(x-cx))/sx + ((z-cz)*(z-cz))/sz)); }
function groundY(x,z){
  const d = -z;
  let y;
  if(d < 6) y = -1.5;
  else if(d < 34) y = -1.5 - (d-6)/28*4.3;
  else y = -5.8 - (d-34)*.35;
  y += Math.pow(Math.abs(x)/34, 2) * 7 * Math.min(1, Math.max(0, (d-4)/10));
  y += bump(x,z,19,-47,6,70,140) + bump(x,z,-30,-62,11,160,220);
  return y;
}

const casMat = inToon(0xf5efe6);
function casement(sign){
  const pivot = new THREE.Group();
  pivot.position.set(sign < 0 ? WIN_L : WIN_R, WIN_B, -.3);
  const g = new THREE.Group();
  const W = (WIN_R - WIN_L)/2, H = WIN_T - WIN_B, b = .065;
  g.position.x = -sign * W/2;
  pivot.add(g);
  const f = casMat;
  box(W, b, .05, f, 0, H - b/2, 0, g, .01);
  box(W, b, .05, f, 0, b/2, 0, g, .01);
  box(b, H, .05, f, -W/2 + b/2, H/2, 0, g, .01);
  box(b, H, .05, f,  W/2 - b/2, H/2, 0, g, .01);
  box(.035, H, .04, f, 0, H/2, 0, g);
  box(W, .035, .04, f, 0, H*.36, 0, g);
  box(W, .035, .04, f, 0, H*.68, 0, g);
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(W-.1, H-.1),
    new THREE.MeshBasicMaterial({ color:0xc9d8f2, transparent:true, opacity:.14, side:THREE.DoubleSide, depthWrite:false }));
  gl.position.y = H/2; g.add(gl);
  pivot.rotation.y = sign < 0 ? 1.15 : -1.15;
  scene.add(pivot);
  return pivot;
}

   違いは予約の仕方だけ。曲の位置（songPos）はシリンダーの回転速度 speed で進み、

   ゼンマイが切れると speed が落ち、テンポと弾く力だけが弱まる。音程は変えない。
================================================================ */
let audioCtx = null, masterGain = null, masterCompressor = null, reverbConvolver = null, reverbWet = null;

function midiToFreq(m){ return 440*Math.pow(2, (m-69)/12); }
function clampNum(v,min,max){ return Math.max(min, Math.min(max, v)); }

function ensureAudioCtx(){
  if(CAPTURE && !audioCtx) return null;   // 撮影中は実時間の音を鳴らさない（音は後でオフラインで書き出す）
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    buildAudioGraph(new Ctx());
  }
  return audioCtx;
}
// 音の経路（masterGain → コンプレッサー → 出力、リバーブ）を ctx に組む。撮影の音の書き出しではオフラインの ctx で使う
function buildAudioGraph(ctx){
  {
    audioCtx = ctx;
    reverbConvolver = null; reverbWet = null; sfxGain = null;
    for(const k in reverbSends) delete reverbSends[k];
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : volume;
    masterCompressor = audioCtx.createDynamicsCompressor();
    masterCompressor.threshold.value = -12;
    masterCompressor.knee.value = 18;
    masterCompressor.ratio.value = 6;
    masterCompressor.attack.value = .003;
    masterCompressor.release.value = .25;
    masterGain.connect(masterCompressor);
    masterCompressor.connect(audioCtx.destination);
    ensureReverb();
  }
  return audioCtx;
}
function buildImpulseResponse(ctx, seconds, decay){
  const rate = ctx.sampleRate, length = Math.max(1, Math.floor(rate*seconds));
  const impulse = ctx.createBuffer(2, length, rate);
  for(let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i=0;i<length;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/length, decay);
  }
  return impulse;
}
function ensureReverb(){
  if(reverbConvolver) return;
  reverbConvolver = audioCtx.createConvolver();
  reverbConvolver.buffer = buildImpulseResponse(audioCtx, 2.8, 2.6);
  reverbWet = audioCtx.createGain();
  reverbWet.gain.value = .22;
  reverbConvolver.connect(reverbWet);

const reverbSends = {};
function sendToReverb(g, sendAmount){

function trackNode(node){

const INSTRUMENTS = { musicbox:playMusicBoxNote, triangle:playTriangleNote, pad:playPadNote, bass:playBassNote,
  flue:playFlueNote, feltpiano:playFeltPianoNote, mutedmusicbox:playMutedMusicBoxNote, bell:playBellNote, strings:playStringsNote };
const DEFAULT_INSTRUMENTS = { melody:'musicbox', arp:'triangle', pad:'pad', bass:'bass', bell:'bell', strings:'strings' };
const PARTS = ['melody','arp','pad','bass','bell','strings'];
function trackInstruments(track){ return Object.assign({}, DEFAULT_INSTRUMENTS, track.instruments || {}); }

function stopAllAudio(){
  playGeneration++;
  if(bgmLoopTimer){ clearTimeout(bgmLoopTimer); bgmLoopTimer = null; }
  if(audioCtx && masterGain){
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(.0001, now + .04);   // 瞬断するとクリックノイズになる
  }

/* ---- 鳥の声（羽結び J節の chirp をそのまま）----
   BGM とは別のバス sfxGain に出す。音量は SFX_LEVEL × 全体の音量。 */
let sfxGain = null;
const SFX_LEVEL = .9;
function ensureSfx(){
  if(sfxGain || !audioCtx) return;
  sfxGain = audioCtx.createGain(); sfxGain.gain.value = muted ? 0 : volume*SFX_LEVEL;
  sfxGain.connect(masterCompressor);
}
// 個体ごとの声の高さ：id から ±30 セントのずれ
function voiceCents(id){ let h = 0; for(const c of (id||'')) h = (h*31 + c.charCodeAt(0))%997; return (h%61) - 30; }
// さえずり：正弦波が音程へしゃくり上がる（style 0）か、上から降りる（style 1：応える側）
function chirp(m, vol=1, style=0, cents=0, at){
  if(CAPTURE && !CAP.offline){ if(CAP.rec) CAP.chirps.push([CAP.time, m, vol, style, cents]); return; }
  const ctx = ensureAudioCtx(); if(!ctx || vol <= .01) return;
  ensureSfx();
  const t = (at !== undefined ? at : ctx.currentTime) + .005, f = midiToFreq(m)*Math.pow(2, cents/1200), dur = .26;
  const out = ctx.createGain(); out.gain.value = vol; out.connect(sfxGain);
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.22, t+.012);
  g.gain.exponentialRampToValueAtTime(.0001, t+.012+dur);
  g.connect(out); sendToReverb(g, .6);
  const a = trackNode(ctx.createOscillator()); a.type = 'sine';
  a.frequency.setValueAtTime(f*(style ? 1.12 : .82), t);
  a.frequency.exponentialRampToValueAtTime(f*(style ? .99 : 1.015), t+.05);
  a.frequency.exponentialRampToValueAtTime(f, t+.09);
  const lfo = trackNode(ctx.createOscillator()); lfo.frequency.value = style ? 9 : 7;
  const lg = ctx.createGain(); lg.gain.value = f*.012; lfo.connect(lg); lg.connect(a.frequency);
  const b = trackNode(ctx.createOscillator()); b.type = 'triangle'; b.frequency.value = f*2;
  const g2 = ctx.createGain(); g2.gain.value = style ? .05 : .08; b.connect(g2); g2.connect(g);
  a.connect(g);
  const stop = t+dur+.06;
  for(const o of [a,b,lfo]){ o.start(t); o.stop(stop); }
  a.addEventListener('ended', ()=>{ g.disconnect(); g2.disconnect(); lg.disconnect(); out.disconnect(); });
}

/* ---- 先読みスケジューラ（回転速度に追従） ----
   25ms ごとに起き、曲の位置 song.pos を audio の時計 × speed で進める。
   予約するのは「曲の位置が pos + 先読み秒×speed までのノート」。
   発音時刻 = 今 + (ノートの位置 - pos)/speed。長さも /speed で伸びる。 */
const LOOKAHEAD_INTERVAL_MS = 25, SCHEDULE_AHEAD_SEC = .2;
function scheduleTrackLoop(track, startAt, gen){
  const insts = trackInstruments(track);
  const flat = [];
  for(const part of PARTS){
    const events = track[part];
    if(!events || !events.length) continue;
    const fn = INSTRUMENTS[insts[part]] || INSTRUMENTS[DEFAULT_INSTRUMENTS[part]];
    for(const [t,midi,dur,vel] of events) flat.push({ t, midi, dur, vel, fn });
  }
  flat.sort((a,b)=>a.t - b.t);
  let cursor = 0, loopIdx = 0;   // flat の次の予約位置と、何周目を予約しているか
  let absPos = 0, lastNow = startAt;
  song.pos = 0; song.started = true;

  function tick(){
    if(gen !== playGeneration) return;
    const now = audioCtx.currentTime;
    const n = Math.max(now, startAt);
    // ゼンマイ切れ：テンポが落ち、やがて止まる
    if(song.winding){
      song.windT += n - lastNow;
      song.speed = Math.max(0, 1 - Math.pow(song.windT/WIND_SEC, 1.7));
      if(song.speed <= .015){ stopAllAudio(); return; }
    }
    absPos += (n - lastNow)*song.speed;
    lastNow = n;
    song.pos = absPos % track.loopSec;

    // 1曲モード以外は1周で次へ（タブ復帰などで大きく進んでいても1周で区切る）
    if(playMode !== 'single' && absPos >= track.loopSec){ advanceTrack(); return; }
    // タブ復帰で何周も進んでいたら予約位置を追いつかせる（重ね鳴り防止）
    while(absPos >= (loopIdx + 1)*track.loopSec){ loopIdx++; cursor = 0; }

    const velK = .35 + .65*Math.sqrt(song.speed);          // 弾く力
    const ahead = absPos + SCHEDULE_AHEAD_SEC*song.speed;
    if(song.speed > 0){
      for(;;){
        if(cursor >= flat.length){
          if(playMode !== 'single') break;                  // 次の曲へ回すので先の周は予約しない
          loopIdx++; cursor = 0;
        }
        const ev = flat[cursor], evAbs = ev.t + loopIdx*track.loopSec;
        if(evAbs > ahead) break;
        const at = n + (evAbs - absPos)/song.speed;
        ev.fn(Math.max(at, now), ev.midi, ev.dur/song.speed, ev.vel*velK);
        cursor++;
      }
    }
    bgmLoopTimer = setTimeout(tick, LOOKAHEAD_INTERVAL_MS);
  }
  tick();
}
function advanceTrack(){
  let nextIdx;
  if(playMode === 'shuffle'){
    if(TRACKS.length <= 1) nextIdx = currentTrackIdx;
    else { do { nextIdx = Math.floor(Math.random()*TRACKS.length); } while(nextIdx === currentTrackIdx); }
  } else {
    const order = FIXED_ORDER_IDS.map(id => TRACKS.findIndex(t=>t.id===id)).filter(i=>i>=0);
    const pos = order.indexOf(currentTrackIdx);
    nextIdx = order[(pos+1) % order.length];
  }
  playTrack(nextIdx, .8);
}
function playTrack(idx, gapSec){
  if(gapSec === undefined) gapSec = .12;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume();
  stopAllAudio();
  currentTrackIdx = idx;
  const track = TRACKS[idx];
  song.track = track; song.pos = 0; song.speed = 1; song.winding = false; song.windT = 0;
  orgel.setTrack(track);
  const gen = playGeneration;
  const startAt = ctx.currentTime + gapSec;
  const targetVol = muted ? 0 : volume;
  masterGain.gain.cancelScheduledValues(ctx.currentTime);
  masterGain.gain.setValueAtTime(.0001, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(targetVol, startAt + .05);
  scheduleTrackLoop(track, startAt, gen);
  isPlaying = true;
  updateNowPlaying(); updatePlayBtn(); renderTrackList();
}
function togglePlay(){ if(isPlaying) stopAllAudio(); else playTrack(currentTrackIdx); }
function nextTrack(){ playTrack((currentTrackIdx+1) % TRACKS.length); }
function prevTrack(){ playTrack((currentTrackIdx-1+TRACKS.length) % TRACKS.length); }
function windDown(){ if(isPlaying && !song.winding){ song.winding = true; song.windT = 0; } }
function setVolume(v){ volume = v; if(masterGain) masterGain.gain.value = muted ? 0 : volume; if(sfxGain) sfxGain.gain.value = muted ? 0 : volume*SFX_LEVEL; }
function setMuted(m){ muted = m; if(masterGain) masterGain.gain.value = muted ? 0 : volume; if(sfxGain) sfxGain.gain.value = muted ? 0 : volume*SFX_LEVEL; setIcon(muteBtn, muted ? 'mute' : 'unmute', muted ? '🔇' : '🔊'); }
function cyclePlayMode(){
  playMode = playMode === 'single' ? 'all' : (playMode === 'all' ? 'shuffle' : 'single');
  updateModeBtn();
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================================================================

const OUT_MECH = 0x3b2a3c;
function obox(w,h,d,mat,x,y,z,parent,t){

const orgel = (()=>{

  const drum = new THREE.Mesh(new THREE.CylinderGeometry(R, R, CYL_LEN, 48), brass);
  drum.rotation.z = Math.PI/2; cyl.add(drum); addOutline(drum, .03, OUT_MECH);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 9.4, 12), steelDk);
  axle.rotation.z = Math.PI/2; axle.position.x = .6; cyl.add(axle);

  /* 歯車 */
  function gearGeo(r, n, depth, hole, windows){
    const sh = new THREE.Shape(), root = r*.87, step = Math.PI*2/n;
    for(let i=0;i<n;i++){

  const ratchet = new THREE.Mesh(gearGeo(.6, 16, .1, .1), brass);

  const click = obox(.5, .08, .12, steelDk, -2.4 + .75, -1.625 + 1.34, -3.2 + .45, mech, .012);

  /* 仮の箱（ユーザーの .glb が届いたら差し替える） */
  const wood = inToon(0x6f4a3c), woodDk = inToon(0x533427), inlay = inToon(0xd6bd96), lining = inToon(0xa6c0c8);
  const boxRoot = new THREE.Group(); orgelRoot.add(boxRoot);
  const IW = 6.1, ID = 5.0, WT = .5, WH = 5.4;
  // 内張り：形はそのまま、箱の内側を向く面だけ蓋裏と同じ布の色にする（?lining=0 で無し）。面の順は +x,-x,+y,-y,+z,-z
  const LINED = PARAMS.get('lining') !== '0';
  const woodIn = LINED ? lining : inToon(0x6f4a3c);
  const lined = face=>{ const a = Array(6).fill(wood); a[face] = woodIn; return a; };
  boxInside.push(brass, brassDk, steel, steelDk, leadMat, woodIn);
  obox(IW*2 + WT*2, .5, ID*2 + WT*2, lined(2), 0, -.25, 0, boxRoot, .03).name = 'Box_Bottom';

  obox(IW*2 + WT*2, WH, WT, lined(4), 0, WH/2 - .5 + .25, -ID - WT/2, boxRoot, .03).name = 'Box_Back';
  obox(WT, WH, ID*2, lined(1), IW + WT/2, WH/2 - .5 + .25, 0, boxRoot, .03).name = 'Box_Right';
  obox(WT, WH, ID*2, lined(0), -IW - WT/2, WH/2 - .5 + .25, 0, boxRoot, .03).name = 'Box_Left';

  const keyhole = new THREE.Mesh(new THREE.CircleGeometry(.13, 16), new THREE.MeshBasicMaterial({ color:0x4a3346 }));
  keyhole.position.set(0, 2.45, ID + WT + .012); boxRoot.add(keyhole);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const f = new THREE.Mesh(new THREE.SphereGeometry(.38, 14, 10), woodDk); f.name = 'Foot_' + (sz < 0 ? 'B' : 'F') + (sx < 0 ? 'L' : 'R');
    f.scale.y = .6; f.position.set(sx*(IW + WT - .5), -.55, sz*(ID + WT - .5)); boxRoot.add(f);
  });
  const lidPivot = new THREE.Group(); lidPivot.position.set(0, WH - .25, -ID - WT); boxRoot.add(lidPivot);
  const LD = ID*2 + WT*2 + .2;
  obox(IW*2 + WT*2 + .2, .6, LD, wood, 0, .3, LD/2 - .1, lidPivot, .03).name = 'Lid_Top';
  obox((IW*2)*.7, .03, LD*.62, inlay, 0, .615, LD/2 - .1, lidPivot, .01).name = 'Lid_Inlay';
  const lin = new THREE.Mesh(new THREE.PlaneGeometry(IW*2 - .2, ID*2 - .2), lining);
  lin.rotation.x = Math.PI/2; lin.position.set(0, -.005, LD/2 - .1); lidPivot.add(lin); lin.name = 'Lid_Lining';
  /* 蓋裏の鏡（?mirror=0 で無し）。映り込みは計算せず、淡い青灰と斜めの光の筋で鏡に見せる。

  /* 弾いたピンの目立たせ方（?pinfx=0〜3 で比較）。0：色が淡い黄に変わるだけ（元）

  const PIN_FX = PARAMS.has('pinfx') ? parseInt(PARAMS.get('pinfx')) : 3;

      .replace('#include <color_fragment>', `vec3 pinGlow = vec3(0.0);
#if defined( USE_COLOR )

  pinGlow = max(vColor - 1.0, 0.0);

    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,240,200,.85)'); gr.addColorStop(1, 'rgba(255,220,150,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();

  let lastPos = 0;
  const _pm = new THREE.Matrix4(), _ps = new THREE.Vector3();
  const struck = [];   // このフレームで弾いた歯（音符の発生に使う）
  function update(dt){
    const pos = song.started ? song.pos : lastPos;
    struck.length = 0;
    if(song.started){
      const a = lastPos, b = pos;
      for(const nt of notes){
        const hit = b >= a ? (nt.t >= a && nt.t < b) : (nt.t >= a || nt.t < b);   // [a, b)：曲の頭（0 秒）の音も弾く。同じ音を二度弾かない
        if(hit){ nt.age = 0; const tt = teeth[nt.tooth]; tt.age = 0; tt.amp = .09*(.35 + .65*Math.sqrt(song.speed)); struck.push(nt.tooth); }
      }
      lastPos = pos;
    }
    const ang = pos/loopSec*Math.PI*2;
    cyl.rotation.x = -ang;
    const w2 = ang*(1.3/.45);
    shaft2.rotation.x = w2;
    shaft3.rotation.x = -w2*(.8/.3);
    fan.rotation.x = -w2*(.8/.3)*5;
    barrel.rotation.y = -ang*.4;
    if(pins){
      const actT = song.started && isPlaying ? Math.min(1, song.speed) : 0;   // 止まっている間は光らせない
      pinAct += (actT - pinAct)*(1 - Math.exp(-dt/(actT < pinAct ? .7 : .12)));   // 消えるときはゆっくり、点くときは素早く
      const act = PIN_FX >= 1 ? pinAct : 1;
      for(let i=0;i<notes.length;i++){
        const nt = notes[i];
        let w = nt.psi + ang;
        w = Math.atan2(Math.sin(w), Math.cos(w));
        // 0：歯に近づくピンを染める（元）。1 以上：弾いた後も光を残し、見える円筒の上側へ回る間に消えていく
        //（櫛は箱の前の壁に隠れて、弾く瞬間はほとんどの画角で見えないため）
        // 1 以上：弾いた瞬間だけ強く光り（PIN_FLASH 秒で引く）、その後は弱い光（PIN_TRAIL_LV）を残して円筒の上側へ流す
        nt.age += dt;
        const flash = PIN_FX >= 1 && nt.age < PIN_FLASH ? Math.pow(1 - nt.age/PIN_FLASH, 2) : 0;
        const trail = w >= 0 && w < PIN_TRAIL && nt.age < loopSec*.9 ? PIN_TRAIL_LV*(1 - w/PIN_TRAIL) : 0;   // 今の一周で弾いたピンだけ（再生し始めにまだ鳴っていないピンを光らせない）
        const hot = (PIN_FX >= 1
          ? Math.max(flash, trail)
          : (w > -.5 && w < .06 ? Math.pow(1 - Math.abs(w + .05)/.55, 2) : 0))*act;
        pins.setColorAt(i, _pc.copy(PIN_BASE).lerp(PIN_FX >= 1 ? PIN_GLOW : PIN_HOT, hot));
        const hit = flash*act;   // 暈と膨らみは弾いた瞬間だけ（残る光には付けない）
        if(halos){ const ca = halos.geometry.attributes.color.array; ca[i*3] = HALO_COL.r*hit; ca[i*3+1] = HALO_COL.g*hit; ca[i*3+2] = HALO_COL.b*hit; }
        if(PIN_FX >= 2 && (hit > 0 || nt.big)){
          nt.big = hit > 0;
          _pm.compose(nt.P, nt.Q, _ps.setScalar(1 + .8*hit)); pins.setMatrixAt(i, _pm);
          pins.instanceMatrix.needsUpdate = true;
        }
      }
      pins.instanceColor.needsUpdate = true;
      if(halos) halos.geometry.attributes.color.needsUpdate = true;
    }
    for(const t of teeth){
      t.age += dt;
      t.pivot.rotation.x = t.age < 3 ? t.amp*Math.exp(-t.age*9)*Math.sin(t.age*70) : 0;
    }
  }
  /* 部品の名前（FBX 書き出し用。Maya で読んだときの名前になる） */
  mechRoot.name = 'MechRoot'; mech.name = 'Mechanism'; cyl.name = 'Cylinder'; drum.name = 'Drum'; axle.name = 'Axle';
  bigGear.name = 'Gear1_Big'; sidePlate.name = 'SidePlate_R'; shaft2.name = 'Gear2'; pin2.name = 'Gear2_Pinion'; g2.name = 'Gear2_Wheel'; a2.name = 'Gear2_Shaft';
  shaft3.name = 'Gear3'; pin3.name = 'Gear3_Pinion'; a3.name = 'Gear3_Shaft'; fan.name = 'Fan';
  barrel.name = 'Barrel'; drumB.name = 'Barrel_Drum'; ratchet.name = 'Barrel_Ratchet'; click.name = 'Barrel_Click';
  boxRoot.name = 'Box'; keyhole.name = 'Keyhole'; lidPivot.name = 'Lid'; lin.name = 'Lid_Lining'; combGroup.name = 'Comb';
  fan.children.forEach((c, i)=>{ if(c.isMesh) c.name = i === 0 ? 'Fan_Hub' : 'Fan_Blade_' + i; });
  setTrack(TRACKS[0]);
  return { update, setTrack, tipWorld, struck, get teeth(){ return teeth; },
    exportParts:()=>{
      if(pins) notes.forEach((nt, i)=>{ _pm.compose(nt.P, nt.Q, _ps.setScalar(1)); pins.setMatrixAt(i, _pm); nt.big = false; });
      return { cyl, shaft2, shaft3, fan, barrel, lidPivot, pins, teeth, PIN_BASE };
    } };
})();

const noteTex = ['Note_01','Note_02','Note_03'].map(n=>{

const NOTE_COL = [0xe58f7a,0xe9a46a,0xe8c15e,0xa9c46c,0x72b89a,0x6fb0c4,0x7d9ad6,0x9f8ad6,0xc486c8,0xde88a8,0xd99a8a,0xb8a27a];

  const nm = new THREE.SpriteMaterial({ map:noteTex[i%noteTex.length], transparent:true, depthWrite:false, fog:false });
  nm.userData.dim = { value:1 };
  nm.onBeforeCompile = sh=>{
    sh.uniforms.uDim = nm.userData.dim;
    sh.fragmentShader = 'uniform float uDim;\n' + sh.fragmentShader;
    sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `
      vec4 tx = texture2D(map, vMapUv);
      float L = dot(tx.rgb, vec3(.299,.587,.114));
      vec3 lite = mix(diffuse, vec3(1.), .42);
      vec3 deep = mix(diffuse, vec3(1.), .08) * .9;
      vec3 nc = mix(deep, lite, smoothstep(.25, .95, L)) * uDim;
      float nl = dot(nc, vec3(.2126,.7152,.0722));
      nc = max(vec3(0.), mix(vec3(nl), nc, 1. + (1. - uDim)*1.6));
      diffuseColor = vec4(nc, opacity * tx.a);`);
  };
  nm.customProgramCacheKey = ()=>'noteTint';
  const sp = new THREE.Sprite(nm);
  sp.visible = false; sp.userData = { life:0, v:new THREE.Vector3(), ph:0 };
  scene.add(sp); notes.push(sp);
}
let noteNext = 0;
const NOTE_SIZE = .06;   // 窓辺の縮尺（羽結びの .5 を鳥の大きさに合わせて縮めた）
function emitNote(pos, midi, big=1){
  const sp = notes[noteNext]; noteNext = (noteNext+1)%notes.length;
  sp.material.map = noteTex[Math.floor(Math.random()*noteTex.length)];
  sp.material.color.setHex(NOTE_COL[((midi%12)+12)%12]);
  sp.position.copy(pos);
  sp.userData.life = 1.6; sp.userData.max = 1.6; sp.userData.ph = Math.random()*6;
  sp.userData.v.set((Math.random()-.5)*.08, .13+Math.random()*.05, (Math.random()-.5)*.08);
  sp.userData.s = NOTE_SIZE*big*(.8 + .2*Math.random());
  sp.material.rotation = (Math.random()*2-1)*Math.PI/6;
  sp.material.userData.dim.value = 1 - .2*Math.random();
  sp.visible = true;
}
function updateNotes(dt){
  for(const sp of notes){
    const u = sp.userData;
    if(!sp.visible) continue;
    u.life -= dt;
    if(u.life <= 0){ sp.visible = false; continue; }
    const k = 1 - u.life/u.max;
    sp.position.addScaledVector(u.v, dt);
    sp.position.x += Math.sin(u.ph + k*9)*dt*.035;
    const pop = Math.min(1, k*6);
    sp.scale.setScalar(u.s*(.6+.4*pop));
    sp.material.opacity = Math.min(1, u.life*1.6)*.95;
  }
}

  const hit = new THREE.Mesh(new THREE.SphereGeometry(.2, 8, 6), new THREE.MeshBasicMaterial({ visible:false }));
  hit.position.y = .12; hit.userData.bird = bird; model.add(hit); bird.hit = hit;
  bird.play = (name, loop=true, fade=.25)=>{
    const c = clips[name]; if(!c) return null;
    const a = mixer.clipAction(c);
    a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity); a.clampWhenFinished = !loop;
    a.reset().play();
    if(bird.current && bird.current !== a) bird.current.crossFadeTo(a, fade, false);
    bird.current = a;
    return a;
  };

}
/* ---- 定位置に鳥を当てる：抽選（または ?birds の指定）→ テクスチャが届いたら、テクスチャ・大きさ・声の高さを替える ---- */
function assignBird(b){
  if(b.loading) return;
  const used = new Set(birds.filter(o=>o !== b && o.id).map(o=>o.id));
  const fixed = FIXED_BIRDS[b.idx];
  const e = fixed && !used.has(fixed) ? bookOf(fixed) : drawBird(used);
  b.loading = true; b.id = e.id;
  return birdTex(e.id).then(tex=>{
    b.body.material.map = tex;
    if(e.glow){ b.body.material.emissive.setHex(e.glow); b.body.material.emissiveMap = tex; b.glowPh = Math.random()*Math.PI*2; }
    else { b.body.material.emissive.setHex(0); b.body.material.emissiveMap = null; b.glowPh = -1; }
    b.body.material.emissiveIntensity = e.glow ? BIRD_GLOW.BASE : 0;
    b.body.material.needsUpdate = true;
    b.model.scale.setScalar(e.scale);
    b.cents = voiceCents(e.id); b.lastPitch = 0;

}
// 帰った鳥：テクスチャを解放し、次に戻るときに抽選し直す
function retireBird(b){
  if(!b.id) return;
  const id = b.id; b.id = ''; b.needDraw = true;
  b.body.material.map = null; b.body.material.emissiveMap = null; b.body.material.emissive.setHex(0); b.glowPh = -1; b.body.material.needsUpdate = true;
  releaseBirdTex(id);
}
/* ---- 首の向き（羽結び H節）----
   首4割・頭6割。Maya の関節の向きのせいでローカル軸で回すとねじれるので、
   モデルの横軸・縦軸を親の空間へ換算して回す。mixer は値の変わらない骨に書き込まないので、
   毎フレーム元の姿勢に戻してから mixer.update → 上乗せ の順にする。 */
const NECK_SHARE = .4, HEAD_SHARE = .6;
const M_X = new THREE.Vector3(1,0,0), M_Y = new THREE.Vector3(0,1,0), M_Z = new THREE.Vector3(0,0,1);
const _nq = new THREE.Quaternion(), _pw = new THREE.Quaternion(), _mw = new THREE.Quaternion(), _ax = new THREE.Vector3();
function boneTurn(model, bone, modelAxis, angle){
  model.getWorldQuaternion(_mw);
  bone.parent.getWorldQuaternion(_pw).invert();
  _ax.copy(modelAxis).applyQuaternion(_mw).applyQuaternion(_pw).normalize();

}
const _lt = new THREE.Vector3();
function birdNeck(b, dt){
  if(!b.neck) return;
  // 見たい地点：触れた指 → オルゴール。夜は正面のまま
  let wantY = 0, wantP = 0;
  // ホバリング中・飛行中は首を振らない（hover の姿勢で下を向かせると、くちばしがお腹に食い込む）。タップした指も見ない
  const still = b.mode === 'hover' || b.mode === 'fly';
  const target = still ? null : (b.lookT > 0 ? b.lookAt : (!isDay() ? null : ORBIT_CENTER));
  if(target){
    _lt.copy(target); b.model.worldToLocal(_lt); _lt.y -= .2;
    wantY = THREE.MathUtils.clamp(Math.atan2(_lt.x, _lt.z), -1.2, 1.2);
    wantP = THREE.MathUtils.clamp(Math.atan2(_lt.y, Math.hypot(_lt.x, _lt.z)), -.7, .6);
  }
  b.lookT -= dt;
  b.yaw += (wantY - b.yaw)*Math.min(1, 3*dt);
  b.pitch += (wantP - b.pitch)*Math.min(1, 3*dt);
  // 首をかしげる：たまに傾けて戻す
  b.tiltT -= dt;
  if(b.tiltT <= 0){ b.tiltT = 2 + Math.random()*5; b.tiltGoal = (Math.random() < .5 ? 0 : (Math.random()-.5)*.7); }
  b.tilt += ((still ? 0 : (b.tiltGoal || 0)) - b.tilt)*Math.min(1, 4*dt);   // 首をかしげるのも止める
  const ns = b.head ? NECK_SHARE : 1;
  boneTurn(b.model, b.neck, M_Y, b.yaw*ns);
  boneTurn(b.model, b.neck, M_X, -b.pitch*ns);
  if(b.head){
    boneTurn(b.model, b.head, M_Y, b.yaw*HEAD_SHARE);
    boneTurn(b.model, b.head, M_X, -b.pitch*HEAD_SHARE);

}
const _beak = new THREE.Vector3(), _fw = new THREE.Vector3();
function beakPos(b, out){
  if(b.head){ b.head.getWorldPosition(out); _fw.set(0,0,1).applyQuaternion(b.model.quaternion); return out.addScaledVector(_fw, .06).add(_fw.set(0,.07,0)); }
  return b.model.getWorldPosition(out).add(_fw.set(0,.26,.1));
}

/* ================================================================
   鳥の振る舞い（状態の一覧は orgel_handoff.md §6）
   鳥ごとの mode：
     'away'  居ない（まだ来ていない／帰っている）
     'fly'   飛来・帰還の途中（触れない、歌わない）
     'perch' 定位置に居る。歌っていない（昼は小さな動作、夜は座る／立って待つ）
     'sing'  定位置で歌っている（昼は sing、夜は sing_hop）
     'hover' 窓の外でホバリングしながら歌っている（昼・外の鳥・同時に1羽まで）
   曲の区切り：小節 = その曲の pad の長さ（いちばん多いもの）からループ長を割り切れる長さ、
   フレーズ = 4小節。自然に歌い出す／やめるのは、曲の頭とフレーズの区切りだけ。
================================================================ */
const MAX_SINGERS = 3;
const STAND_SEC = 10;          // 夜：立ち上がってから座り直すまで
const PHRASE_BARS = 4;
const SING_FADE = .6, SING_FADE_TRACK = 1.2;   // 歌うモーションへの入り方（曲送りのときはさらに緩やかに）
const VOICE_KEY = 'ototsuzuri.birdVoice';
let birdVoice = true;
try{ const v = localStorage.getItem(VOICE_KEY); if(v !== null) birdVoice = v === '1'; }catch(e){}
let firstPlayDone = PARAMS.has('birds');   // 最初に再生したときだけ飛んでくる（?birds で最初から居る）
let singOrderCtr = 0;
let hoverCool = 25 + Math.random()*25;
let pausedSingers = [];

/* ---- 曲の小節とフレーズ ---- */
const barCache = new Map();
function barSecOf(track){
  if(barCache.has(track)) return barCache.get(track);
  const cnt = new Map();
  for(const [, , d] of (track.pad || [])){ const k = d.toFixed(2); cnt.set(k, (cnt.get(k) || 0) + 1); }
  let pad = 0, best = 0;
  for(const [k, n] of cnt) if(n > best){ best = n; pad = +k; }
  if(!pad) pad = 3*60/track.bpm;
  let bar = track.loopSec/Math.max(1, Math.round(track.loopSec/pad));
  bar = THREE.MathUtils.clamp(bar, 1.2, 4.5);
  barCache.set(track, bar);
  return bar;
}

/* ---- 居る時間：外の鳥は夕方に1羽ずつ帰り、夜明けに1羽ずつ戻る。室内の鳥はずっと居る ---- */
function wantPresent(b, t){
  if(!firstPlayDone) return false;
  if(!b.outside) return true;
  return inOutsideHours(b, t);
}
// 外の鳥が居る時間。戻る時刻が真夜中をまたぐ（backT > leaveT）ときは、backT から翌日の leaveT まで
function inOutsideHours(b, t){
  return b.backT < b.leaveT ? (t >= b.backT && t < b.leaveT) : (t >= b.backT || t < b.leaveT);
}
const isDay = ()=>birdNight(dayT) <= .5;
const singingBirds = ()=>birds.filter(b=>b.singing);
const playingNow = ()=>isPlaying && song.started;

/* ---- 動きの切り替え ---- */
function setAnim(b, name, loop=true, fade=.25, force=false){
  if(!force && b.anim === name) return;
  b.anim = name; b.play(name, loop, fade);
}
/* ---- 歌の開始と停止 ---- */
function startSing(b, fade=SING_FADE){
  if(b.singing) return;
  const now = singingBirds();
  if(now.length >= MAX_SINGERS){   // 最初に歌い出した鳥がやめる
    const first = now.reduce((a, c)=>c.singOrder < a.singOrder ? c : a);
    stopSing(first);
  }
  b.singing = true; b.singOrder = ++singOrderCtr; b.singBeat = -1;
  b.seated = false; b.standT = 0;
  b.mode = 'sing';
  b.singPhase = targetPhase();
  setAnim(b, isDay() ? 'sing' : 'sing_hop', true, fade, true);
}
function stopSing(b, opts={}){
  if(!b.singing) return;
  b.singing = false;
  if(b.mode === 'hover'){ b.hv.phase = 'fall'; b.hv.t = 0; b.hv.from.copy(b.model.position); return; }
  b.mode = 'perch';
  if(isDay()){ b.state = ''; b.wait = 0; setAnim(b, 'idle', true, .4); }
  else if(opts.sit){ sitDown(b); }
  else { b.seated = false; b.standT = STAND_SEC; setAnim(b, 'idle', true, .4); }
}
function sitDown(b){ b.seated = true; b.standT = 0; b.state = 'sit_in'; b.wait = .65; setAnim(b, 'sit_in', false, .3, true); }
function standUp(b){ b.seated = false; b.standT = STAND_SEC; b.state = 'sit_out'; b.wait = .65; setAnim(b, 'sit_out', false, .3, true); }
function hopReact(b){ b.state = 'touched'; b.wait = .6; setAnim(b, Math.random() < .5 ? 'hop' : 'hop_big', false, .15, true); }

/* ---- 声（chirp）と音符：歌うときは前の音から ±1〜2 段ずつ歩く（羽結び J節） ---- */
function chordPCs(){
  const tr = song.track, pcs = new Set();
  if(song.started) for(const part of ['pad','bass','arp']) for(const [t,midi,dur] of (tr[part] || [])){ if(song.pos >= t && song.pos < t + dur) pcs.add(midi % 12); }
  if(!pcs.size) for(const [, midi] of tr.melody) pcs.add(midi % 12);
  return pcs;
}
function walkNote(b){
  const pcs = chordPCs(), pool = [];
  for(let m = b.range[0]; m <= b.range[1]; m++) if(pcs.has(m % 12)) pool.push(m);
  if(!pool.length) return b.range[0];
  let i = pool.findIndex(m=>m >= (b.lastPitch || pool[0])); if(i < 0) i = pool.length - 1;
  i = THREE.MathUtils.clamp(i + [-2,-1,-1,1,1,2][Math.floor(Math.random()*6)], 0, pool.length - 1);
  return b.lastPitch = pool[i];
}
const BIRD_NOTE = 2;   // 鳥から出る音符はオルゴールの音符の倍（大きさ）
function voice(b, style, vol, withSound=true){
  const midi = walkNote(b);
  if(withSound) chirp(midi, vol, style, b.cents);
  emitNote(beakPos(b, _beak), midi, BIRD_NOTE*(style ? .7 : 1));
}

/* ---- 拍への同期：2拍で sing／sing_hop の1周。曲送りで拍が飛んでも位相をなめらかに寄せる ---- */
function targetPhase(){ return ((song.pos*song.track.bpm/60)/2) % 1; }
function syncSingPhase(b, dt){
  const act = b.current, clip = b.clips[b.anim];
  if(!act || !clip) return;
  const tgt = targetPhase();
  const diff = ((tgt - b.singPhase + 1.5) % 1) - .5;
  b.singPhase = (b.singPhase + dt*song.track.bpm/120*song.speed + diff*Math.min(1, dt*1.5) + 1) % 1;
  act.time = b.singPhase*clip.duration;
}

/* ---- 飛来・帰還 ---- */
function bez(out, p0, p1, p2, p3, t){
  const u = 1 - t;
  return out.set(0,0,0).addScaledVector(p0, u*u*u).addScaledVector(p1, 3*u*u*t).addScaledVector(p2, 3*u*t*t).addScaledVector(p3, t*t*t);
}
function flightPath(b){
  const h = b.home.pos;
  if(b.outside){
    const sx = Math.sign(h.x) || 1;
    return [ new THREE.Vector3(h.x + sx*2.6, h.y + 1.6, h.z - 5.5), new THREE.Vector3(h.x + sx*1.6, h.y + 1.2, h.z - 3),
             new THREE.Vector3(h.x + sx*.2, h.y + .6, h.z - .9), h.clone() ];
  }
  // 室内の鳥：窓の開口部の中央あたりを通って窓台へ
  return [ new THREE.Vector3(.9, 2.7, -5.5), new THREE.Vector3(.2, 2.0, -2.4),
           new THREE.Vector3(.18, SILL_TOP + .5, -.6), h.clone() ];   // 開いた窓（x≥.68）に翼が掛からないよう、開口部の中央を通る
}
const FLY_SEC = 3.2;
function beginArrive(b){
  b.mode = 'fly'; b.fl = { dir:1, t:0, path:flightPath(b), landed:false };
  b.model.visible = true; b.singing = false; b.seated = false;
  setAnim(b, 'flying', true, .1, true);
}
function beginLeave(b){
  if(b.singing){ b.singing = false; }
  b.mode = 'fly'; b.fl = { dir:-1, t:0, path:flightPath(b), took:false };
  b.fl.path[3].copy(b.model.position);
  setAnim(b, 'takeoff', false, .2, true);
}
const _fp = new THREE.Vector3(), _fq = new THREE.Vector3();
function updateFlight(b, dt){
  const f = b.fl; f.t += dt;
  const TURN = .6;                                   // 帰り：その場で進む向きへ振り向いてから飛び立つ
  if(f.dir < 0 && f.t < TURN){
    if(f.yaw0 === undefined){
      bez(_fp, f.path[0], f.path[1], f.path[2], f.path[3], .97);
      f.yaw0 = b.model.rotation.y;
      f.yaw1 = Math.atan2(_fp.x - f.path[3].x, _fp.z - f.path[3].z);
    }
    const d = Math.atan2(Math.sin(f.yaw1 - f.yaw0), Math.cos(f.yaw1 - f.yaw0));
    b.model.rotation.y = f.yaw0 + d*sstep(0, 1, f.t/TURN);
    return;
  }
  const s = THREE.MathUtils.clamp((f.t - (f.dir < 0 ? TURN : 0))/FLY_SEC, 0, 1);
  const e = f.dir > 0 ? 1 - Math.pow(1 - s, 2.2) : s*s;   // 来るときは減速して降り、帰るときは加速して去る
  const u = f.dir > 0 ? e : 1 - e;
  const P = f.path;
  bez(_fp, P[0], P[1], P[2], P[3], u);
  bez(_fq, P[0], P[1], P[2], P[3], Math.min(1, u + .01*f.dir) );
  b.model.position.copy(_fp);
  // 進む向きを向く。着地の手前で定位置の向きへ戻す
  const dx = _fq.x - _fp.x, dz = _fq.z - _fp.z;   // _fq はすでに進む先の点（帰りは u−0.01）。dir を掛けると逆向きになる
  let yaw = Math.abs(dx) + Math.abs(dz) > 1e-6 ? Math.atan2(dx, dz) : b.home.rotY;
  const settle = f.dir > 0 ? sstep(.75, 1, s) : 0;   // 来るときだけ、着地の手前で定位置の向きへ戻す
  const dy = Math.atan2(Math.sin(b.home.rotY - yaw), Math.cos(b.home.rotY - yaw));
  b.model.rotation.y = yaw + dy*settle;
  if(f.dir < 0 && !f.took && f.t > TURN + .45){ f.took = true; setAnim(b, 'flying', true, .3, true); }
  if(f.dir > 0 && !f.landed && s > .72){ f.landed = true; setAnim(b, 'landing', false, .3, true); }
  if(s >= 1){
    if(f.dir > 0){ b.model.position.copy(b.home.pos); b.model.rotation.y = b.home.rotY; enterPerch(b); }

function enterPerch(b){
  b.mode = 'perch'; b.singing = false; b.state = ''; b.wait = .4;
  if(isDay()){ b.seated = false; setAnim(b, 'idle', true, .4, true); }
  else { sitDown(b); }
}

/* ---- ホバリングして歌う（昼・外の鳥・同時に1羽） ---- */
function beginHover(b){
  b.mode = 'hover';
  const h = b.home.pos;
  b.hv = { phase:'rise', t:0, bars:2 + Math.floor(Math.random()*3), from:h.clone(),
           to:new THREE.Vector3(h.x*.7, RAIL_TOP + .5, RAIL_Z + .5) };
  setAnim(b, 'hover', true, .3, true);
}
const HOVER_MOVE = 1.2;
function updateHover(b, dt, barTick){
  const v = b.hv; v.t += dt;
  const bob = Math.sin(clock*3.1 + b.idx)*.015;
  if(v.phase === 'rise'){
    b.model.position.lerpVectors(v.from, v.to, sstep(0, 1, v.t/HOVER_MOVE)); b.model.position.y += bob;
    if(v.t >= HOVER_MOVE){ v.phase = 'hold'; v.t = 0; }
  } else if(v.phase === 'hold'){
    b.model.position.copy(v.to); b.model.position.y += bob;
    if(barTick && --v.bars <= 0){ v.phase = 'fall'; v.t = 0; v.from.copy(b.model.position); }
  } else {
    b.model.position.lerpVectors(v.from, b.home.pos, sstep(0, 1, v.t/HOVER_MOVE));
    if(v.t >= HOVER_MOVE){
      b.model.position.copy(b.home.pos);
      hoverCool = 25 + Math.random()*30;
      if(b.singing){ b.mode = 'sing'; b.singPhase = targetPhase(); setAnim(b, isDay() ? 'sing' : 'sing_hop', true, SING_FADE, true); }
      else enterPerch(b);
    }
  }
}

/* ---- 歌っていない鳥の小さな動作 ---- */
const DAY_ACTS = [['peck',1.5],['stretch',3],['preen',2.6],['hop',.5],['peer_in',.5]];
function perchIdle(b, dt){
  b.wait -= dt;
  if(!isDay()){
    if(b.seated){
      if(b.wait <= 0 && b.anim !== 'sit') setAnim(b, 'sit', true, .3);
      return;
    }
    if(b.state === 'sit_out' && b.wait <= 0){ b.state = ''; setAnim(b, 'idle', true, .3); }
    if(b.state === 'touched' && b.wait <= 0){ b.state = ''; setAnim(b, 'idle', true, .3); }
    b.standT -= dt;
    if(b.standT <= 0) sitDown(b);
    return;
  }
  if(b.wait > 0) return;
  if(b.state === 'peer_in'){ b.state = 'peer'; setAnim(b, 'peer'); b.wait = 1 + Math.random()*2; return; }
  if(b.state === 'peer'){ b.state = 'peer_out'; setAnim(b, 'peer_out', false, .25, true); b.wait = .5; return; }
  if(b.state !== 'idle'){ b.state = 'idle'; setAnim(b, 'idle'); b.wait = 1.5 + Math.random()*4; return; }
  const [name, len] = DAY_ACTS[Math.floor(Math.random()*DAY_ACTS.length)];
  b.state = name; setAnim(b, name, false, .25, true); b.wait = len;
}

/* ---- 毎フレーム ---- */
let wasPlaying = false, wasNight = null, lastTrack = null, lastPos = 0, lastPhrase = -1, lastBar = -1, phraseCount = 0;
function birdsUpdate(dt){
  if(!birds.length) return;
  const playing = playingNow();
  const night = !isDay();

  // 最初の再生で飛来を始める
  if(!firstPlayDone && isPlaying){ firstPlayDone = true; }

  // 出入り：時刻で決まる。2羽以上が同時に動かないよう、鳥ごとに待ちをずらす
  let stagger = 0;
  for(const b of birds){
    const want = wantPresent(b, dayT);
    if(want && b.mode === 'away'){
      if(b.needDraw || b.loading){ if(!b.loading) assignBird(b); continue; }   // 顔ぶれを決めてテクスチャが届くまで待つ
      if(b.arriveAt < 0){ b.arriveAt = clock + stagger + Math.random()*1.2; stagger += 1.1 + Math.random()*.9; }
      // 撮影で飛来の秒を指定した鳥は、その秒ちょうどに来る（他の鳥とのずらしは使わない）
      const capHold = CAPTURE && CAP.hold && CAP.hold[b.idx] != null ? CAP.hold[b.idx] : null;
      if(capHold != null ? CAP.rec && CAP.time >= capHold : clock >= b.arriveAt) beginArrive(b);
    } else if(!want && b.mode !== 'away' && !(b.mode === 'fly' && b.fl.dir < 0)){
      if(b.leaveAt < 0){ b.leaveAt = clock + stagger + Math.random()*.8; stagger += 1.1 + Math.random()*.9; }
      if(clock >= b.leaveAt){ b.leaveAt = -1; beginLeave(b); }
    } else if(want){ b.leaveAt = -1; }
    else if(b.mode === 'away'){ b.arriveAt = -1; }
  }

  // 夜になった／夜が明けた
  if(wasNight === null) wasNight = night;
  if(night !== wasNight){
    wasNight = night;
    for(const b of birds){
      if(b.mode === 'hover'){ b.singing = false; b.hv.phase = 'fall'; b.hv.t = 0; b.hv.from.copy(b.model.position); continue; }
      if(night){
        if(b.singing) stopSing(b, { sit:true });
        else if(b.mode === 'perch') sitDown(b);
      } else {
        if(b.singing){ setAnim(b, 'sing', true, SING_FADE); }                 // sing_hop で歌っていた鳥はそのまま sing へ
        else if(b.mode === 'perch'){ if(b.seated){ b.seated = false; b.state = 'sit_out'; b.wait = .65; setAnim(b, 'sit_out', false, .3, true); } else { b.state = ''; b.wait = 0; } }
      }
    }
  }

  // 一時停止と再開
  if(wasPlaying && !playing && !isPlaying){
    pausedSingers = singingBirds();
    for(const b of pausedSingers) stopSing(b);
  }
  if(!wasPlaying && playing){
    if(birdVoice) for(const b of pausedSingers){
      if(b.mode === 'perch' && !b.singing) startSing(b);
      else if(b.mode === 'hover' && !b.singing){ b.singing = true; b.singOrder = ++singOrderCtr; }   // 降りている途中なら、着地してから歌に戻る
    }
    pausedSingers = [];
  }

  // 曲の頭・小節・フレーズの区切り
  let head = false, barTick = false, phraseTick = false, trackChanged = false;
  if(playing){
    const bar = barSecOf(song.track);
    if(song.track !== lastTrack){ trackChanged = lastTrack !== null; lastTrack = song.track; head = true; }
    if(!wasPlaying) head = true;
    if(song.pos + .5 < lastPos) head = true;                                   // ループの頭
    const bi = Math.floor(song.pos/bar), pi = Math.floor(bi/PHRASE_BARS);
    if(bi !== lastBar){ barTick = true; lastBar = bi; }
    if(pi !== lastPhrase){ phraseTick = true; lastPhrase = pi; }
    if(head){ phraseTick = barTick = true; lastBar = bi; lastPhrase = pi; }
    lastPos = song.pos;
    if(phraseTick) phraseCount++;
  }
  wasPlaying = playing;

  // 曲送り：歌っている鳥は歌い続け、モーションには緩やかに入り直す
  if(trackChanged) for(const b of birds) if(b.mode === 'sing'){ setAnim(b, isDay() ? 'sing' : 'sing_hop', true, SING_FADE_TRACK, true); }

  // 自然に歌い出す・やめる（昼・再生中・声オン・区切りだけ）
  if(playing && !night && birdVoice && phraseTick){
    for(const b of singingBirds()) if(b.mode === 'sing' && !head && Math.random() < .25) stopSing(b);
    const cands = birds.filter(b=>b.mode === 'perch' && !b.singing && phraseCount >= b.quietUntil);
    for(let i = cands.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [cands[i], cands[j]] = [cands[j], cands[i]]; }
    for(const b of cands){
      if(singingBirds().length >= MAX_SINGERS) break;
      if(Math.random() < (head ? .7 : .35)) startSing(b, trackChanged ? SING_FADE_TRACK : SING_FADE);
    }
    if(head && cands.length && !singingBirds().length) startSing(cands[0]);   // 曲を再生したら、少なくとも1羽は歌う
  }

  // ホバリング：昼・再生中・外で歌っている鳥・同時に1羽・数十秒に一度
  if(playing && !night) hoverCool -= dt;
  if(playing && !night && birdVoice && barTick && hoverCool <= 0 && !birds.some(b=>b.mode === 'hover')){
    const c = birds.filter(b=>b.outside && b.mode === 'sing');
    if(c.length) beginHover(c[Math.floor(Math.random()*c.length)]);
  }

  // 鳥ごとの更新
  for(const b of birds){
    if(b.mode === 'fly'){ updateFlight(b, dt); continue; }
    if(b.mode === 'hover') updateHover(b, dt, barTick);
    if(b.mode === 'perch') perchIdle(b, dt);
    if(b.singing){
      if(b.mode === 'sing') syncSingPhase(b, dt);
      // 拍ごとに声。鳥ごとに2拍に1回、鳥の番号でずらして重なりすぎないようにする
      const beat = Math.floor(song.pos*song.track.bpm/60);
      if(playing && beat !== b.singBeat){
        b.singBeat = beat;
        if((beat + b.idx) % 2 === 0 && Math.random() < .8) voice(b, 1, .7);
      }
    }
  }
}

/* ---- 触れたとき ---- */
function touchBird(b, point){
  if(b.mode === 'fly' || b.mode === 'away') return;
  const ctx = ensureAudioCtx(); if(ctx && ctx.state === 'suspended') ctx.resume();
  b.lookAt = point.clone(); b.lookT = 1.6;
  const night = !isDay(), playing = playingNow();
  // 声オフ：昼は跳ねるだけ（音なし）。夜は動かず音符だけ
  if(!birdVoice){
    if(night) emitNote(beakPos(b, _beak), walkNote(b), BIRD_NOTE);
    else if(b.mode === 'perch') hopReact(b);
    return;
  }
  // 一時停止中：一声だけ。歌い出さない。夜は立ち上がらない
  if(!playing){
    voice(b, 0, 1);
    if(!night && b.mode === 'perch') hopReact(b);
    return;
  }
  if(!night){
    if(b.singing){ stopSing(b); b.quietUntil = phraseCount + 2; if(b.mode === 'perch') hopReact(b); }   // 少なくとも次の区切りまでは歌わない
    else startSing(b);
    return;
  }
  // 夜：座っている → 立つ。立っている（10秒以内）→ sing_hop で歌う。歌っている → やめる
  if(b.singing){ stopSing(b); return; }
  if(b.seated){ standUp(b); return; }
  startSing(b);
}

const raycaster = new THREE.Raycaster(), _ndc = new THREE.Vector2();
function pickBird(clientX, clientY){
  _ndc.set(clientX/window.innerWidth*2 - 1, -(clientY/window.innerHeight)*2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObjects(birds.filter(b=>b.mode !== 'away' && b.mode !== 'fly').map(b=>b.hit), false);
  return hits.length ? { bird:hits[0].object.userData.bird, point:hits[0].point } : null;

async function loadBirds(){
  const loader = new GLTFLoader();
  birdSrc[BIRD_VARIANT] = await loader.loadAsync(ASSET_BASE + BIRD_FILES[BIRD_VARIANT]);
  // 定位置は3つ（手すり左・手すり右・窓台）。どの鳥が来るかは抽選。モデルの正面は +z（rotation.y = 0 で部屋を向く）
  // outside：窓の外（手すり）。夜、座り始める前に帰り（leaveT）、夜明けに戻る（backT）。室内の鳥はずっと居る
  const defs = [
    // 外の鳥は、座って休み始める約10秒前に帰る（手すり左が少し先、右が後）。夜明けに抽選し直した鳥が戻る
    { pos:[-.42, RAIL_TOP + .035, RAIL_Z], rotY:.3,          outside:true,  leaveT:beforeSit(14), backT:afterWake(8) },
    { pos:[.42, RAIL_TOP + .035, RAIL_Z],  rotY:-.3,         outside:true,  leaveT:beforeSit(10), backT:afterWake(20) },
    { pos:[.52, SILL_TOP, .2],             rotY:-Math.PI/4,  outside:false },   // 窓台：ずっと居る。体は斜め45°。カーテン（x≥.875）に掛からない位置
  ];
  defs.forEach((d, i)=>{
    const b = makeBird(i);
    b.home = { pos:new THREE.Vector3(...d.pos), rotY:d.rotY };
    b.outside = d.outside; b.leaveT = d.leaveT; b.backT = d.backT;
    b.mode = 'away'; b.arriveAt = -1; b.leaveAt = -1; b.singing = false; b.singOrder = 0; b.quietUntil = 0;
    b.seated = false; b.standT = 0; b.anim = ''; b.singPhase = 0; b.lastPitch = 0;
    b.model.position.copy(b.home.pos); b.model.rotation.y = b.home.rotY;
    b.model.visible = false;
  });
  // 最初に開いたときに、その時刻に居る鳥の顔ぶれを抽選してテクスチャを読む（夜は窓台の1羽だけ）
  await Promise.all(birds.filter(b=>wantPresent(b, dayT) || !b.outside || !firstPlayDone && inOutsideHours(b, dayT)).map(assignBird));
  // ?birds：最初から定位置に居る（確認用）
  for(const b of birds) if(firstPlayDone && wantPresent(b, dayT) && !b.needDraw){ b.model.visible = true; enterPerch(b); if(!isDay()) { b.seated = true; setAnim(b, 'sit', true, 0, true); } }
  if(PARAMS.has('lookbird')){ const bd = birds[+PARAMS.get('lookbird')]; ORBIT.pan.copy(bd.home.pos).sub(ORBIT_CENTER); ORBIT.pan.y += .12; ORBIT.pan.divideScalar(Math.min(1, ORBIT.dist/3.2)); ORBIT.PAN_MAX = 99; ORBIT.cPan.copy(ORBIT.pan); }   // 確認用：鳥を中心にする
}

const _v = new THREE.Vector3(), _c = new THREE.Color();
const SUN_WHITE = new THREE.Color(0xfff6e0), MOON_LIGHT = new THREE.Color(0xb7c3ff);
function applyTime(t){
  evalPalette(t);
  updateSky(t);
  const p = cur;
  const lamps = lampsOn(t), room = roomOn(t);
  const sunLow = 1 - sstep(0, .35, sunDir.y);   // 太陽が低い（照り返しを強く、温かく）

  toSrgb(skyMat.uniforms.uTop.value, p.skyTop);
  toSrgb(skyMat.uniforms.uBot.value, p.skyBot);
  toSrgb(skyMat.uniforms.uGlow.value, p.glow);
  toSrgb(skyMat.uniforms.uFog.value, p.fog);
  skyMat.uniforms.uMoonUp.value = moonUp;
  skyMat.uniforms.uSunUp.value = sunUp;

  toSrgb(seaMat.uniforms.uDeep.value, p.seaDeep);
  toSrgb(seaMat.uniforms.uLight.value, p.seaLight);
  toSrgb(seaMat.uniforms.uFog.value, p.fog);
  toSrgb(seaMat.uniforms.uGlow.value, p.glow);
  seaMat.uniforms.uSunUp.value = sunUp;
  seaMat.uniforms.uSunLow.value = sunLow;
  seaMat.uniforms.uMoonUp.value = moonUp;

  scene.fog.color.copy(p.fog);
  paintHills(p);
  starMat.uniforms.uOpacity.value = p.stars;

  // 太陽の円盤：低いほど温かい色。月：満ち欠け
  _c.copy(SUN_WHITE).lerp(p.glow, sunLow*.85);
  toSrgb(sunMat.uniforms.uCol.value, _c);
  sunMat.uniforms.uLow.value = sunLow;
  sunMat.uniforms.uVis.value = sstep(-.03, .01, sunDir.y);
  sun.scale.setScalar(ORB_DIST*(.085 + .03*sunLow));
  moonMat.uniforms.uPhase.value = moonPhase;
  moonMat.uniforms.uVis.value = moonUp*(.55 + .45*p.stars);
  moon.scale.setScalar(ORB_DIST*.085);

  // 光：昼は太陽、夜は月
  hemi.color.copy(p.hemiSky); hemi.groundColor.copy(p.hemiGround); hemi.intensity = p.hemiI;
  if(sunUp > 0.01){
    dirLight.color.copy(p.sunColor); dirLight.intensity = p.sunI*sunUp;
    dirLight.position.copy(sunDir).multiplyScalar(60);
  } else {
    dirLight.color.copy(MOON_LIGHT); dirLight.intensity = .45*moonUp;
    dirLight.position.copy(moonDir).multiplyScalar(60);
  }
  roomLight.intensity = 16*room;
  sillFill.intensity = .3*(sunUp*.5 + .5) + .35*room;

  tinted.forEach(o=>o.m.color.copy(p[o.key]));
  interior.forEach(o=>o.m.color.copy(o.base).multiply(p.inLight));
  const lift = BOX_LIFT*(sunUp*.5 + .5 + room);   // 昼は外光、夜は部屋の灯りの照り返し
  const boxNight = BOX_NIGHT*(1 - sunUp)*(1 - room);
  boxInside.forEach(m=>m.emissive.copy(m.color).multiplyScalar(lift).add(_boxC.copy(m.userData.base).multiplyScalar(boxNight)));
  clouds.forEach(c=>c.material.color.copy(p.cloud));

  paintWindows(p, litFrac(t), false);
  lampMat.opacity = lamps;
  headMat.color.setRGB(1, .81, .52).multiplyScalar(.35 + lamps*.65);
  beamMat.uniforms.uOp.value = .18*lamps;
  lanternGlow.material.opacity = lamps*.9;
  lanternBox.material.color.setRGB(1, .86, .63).multiplyScalar(.5 + lamps*.5);
  lanternMat.color.setRGB(1, .9, .66).multiplyScalar(.55 + lamps*.45);
  lhGlow.material.opacity = lamps;
  boats.forEach(b=>{ b.userData.light.material.opacity = lamps; });
}

/* ---------- カメラ操作：オルゴールを中心に回る ----------
   1本指ドラッグ：回る（方位・仰角）。ピンチ／トラックパッドのピンチ：寄る・引く。

  AZ_MAX:THREE.MathUtils.degToRad(60), EL_MIN:THREE.MathUtils.degToRad(2), EL_MAX:THREE.MathUtils.degToRad(60),

if(PARAMS.has('panx')) ORBIT.pan.x = ORBIT.cPan.x = parseFloat(PARAMS.get('panx'));

if(PARAMS.has('look')){ const [x,y,z] = PARAMS.get('look').split(',').map(Number); ORBIT.pan.set(x,y,z).sub(ORBIT_CENTER).divideScalar(Math.min(1, ORBIT.dist/3.2)); ORBIT.PAN_MAX = 99; ORBIT.cPan.copy(ORBIT.pan); }
const hint = document.getElementById('hint');
// マウスのある PC では操作の説明を PC 用にする
if(matchMedia('(hover: hover) and (pointer: fine)').matches) hint.textContent = 'ドラッグで回る／ホイールで寄る／右ドラッグで移動／鳥をクリックすると鳴く';
let hinted = false;
function hideHint(){ if(!hinted){ hinted = true; hint.style.opacity = '0'; } }
const clampO = ()=>{
  ORBIT.az = THREE.MathUtils.clamp(ORBIT.az, -ORBIT.AZ_MAX, ORBIT.AZ_MAX);
  ORBIT.el = THREE.MathUtils.clamp(ORBIT.el, ORBIT.EL_MIN, ORBIT.EL_MAX);
  ORBIT.dist = THREE.MathUtils.clamp(ORBIT.dist, ORBIT.DIST_MIN, ORBIT.DIST_MAX);
  ORBIT.pan.x = THREE.MathUtils.clamp(ORBIT.pan.x, -ORBIT.PAN_MAX, ORBIT.PAN_MAX);
  ORBIT.pan.y = THREE.MathUtils.clamp(ORBIT.pan.y, -.3, ORBIT.PAN_MAX);

const _pr = new THREE.Vector3(), _pu = new THREE.Vector3();
function panBy(dx, dy){   // 画面の右・上の向きへ、距離に応じた量だけ動かす
  const k = ORBIT.cDist*.0016/Math.min(1, ORBIT.cDist/3.2);

const pointers = new Map();

// マウス：左ドラッグで回る、右（中）ドラッグで平行移動、ホイールで寄る・引く。タッチは指の本数で決める
canvas.addEventListener('pointerdown', e=>{
  const panBtn = e.pointerType === 'mouse' && (e.button === 2 || e.button === 1);
  const hit = pointers.size === 0 && !panBtn ? pickBird(e.clientX, e.clientY) : null;
  if(hit){ touchBird(hit.bird, hit.point); hideHint(); return; }
