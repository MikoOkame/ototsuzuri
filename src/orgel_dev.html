<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音綴り - OtoTsuzuri -</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --bg:#141238; --ink:#fff4dc; --ink-dim:rgba(255,244,220,.7);
    --panel:rgba(30,24,58,.5); --line:rgba(255,228,196,.28);
    --accent:#ffd494; --accent-ink:#3a2a30;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; }
  body{
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #c{ position:fixed; top:0; left:0; width:100%; height:100%; display:block; }
  #paper{
    position:fixed; inset:0; pointer-events:none; opacity:.32; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .52  0 0 0 0 .47  0 0 0 0 .44  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(18,12,38,.42) 100%);
  }
  #tag{ position:fixed; top:0; left:0; padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0; pointer-events:none; }
  #tag h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:.1em; text-shadow:0 1px 10px rgba(20,10,40,.5); }
  #tag h1 span{ font-size:12px; font-weight:500; letter-spacing:.06em; color:var(--ink-dim); margin-left:.4em; }
  #hint{
    position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom,0px));
    margin:0; text-align:center; font-size:12px; color:var(--ink-dim); letter-spacing:.08em;
    pointer-events:none; transition:opacity 1.2s;
  }
  /* デバッグ表示（?debug のときだけ出す） */
  #dbg{
    display:none; position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding:8px 10px; border-radius:12px; background:var(--panel); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); font-size:12px;
  }
  #dbg.on{ display:block; }
  #dbg .row{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  #dbg input[type=range]{ flex:1; }
  #dbg button{
    font-family:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer;
  }
  #dbg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  #dbg #tLabel{ min-width:9em; }
  /* 再生の操作（v10 の構成。鍵盤はない） */
  #listBtn{
    position:fixed; top:0; right:16px; margin-top:calc(14px + env(safe-area-inset-top,0px));
    font:500 12.5px/1 inherit; font-family:inherit; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 14px;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer;
  }
  #player{
    position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding:10px 14px 8px; border-radius:16px; background:var(--panel); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  #nowPlaying{ text-align:center; }
  #npTitle{ font-size:15px; font-weight:700; letter-spacing:.06em; }
  #npSubtitle{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  #transport{ display:flex; justify-content:center; align-items:center; gap:18px; margin-top:6px; }
  .transportBtn{
    font-family:inherit; font-size:18px; color:var(--ink); background:transparent; border:1px solid var(--line);
    border-radius:999px; width:44px; height:44px; cursor:pointer;
  }
  #playBtn{ width:54px; height:54px; font-size:22px; background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  #subRow{ display:flex; align-items:center; gap:10px; margin-top:6px; }
  #modeBtn{ font-family:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  #muteBtn{ font-size:16px; background:transparent; border:0; color:var(--ink); cursor:pointer; }
  #volSlider{ flex:1; accent-color:var(--accent); }
  .modalOverlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,8,24,.55); z-index:10; }
  .modalOverlay.show{ display:flex; }
  .modal{ width:min(92vw, 420px); max-height:80vh; overflow:auto; padding:14px; border-radius:16px; background:rgba(30,24,58,.92); border:1px solid var(--line); }
  .modal h2{ margin:0 0 10px; font-size:15px; }
  .trackRow{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px; cursor:pointer; }
  .trackRow.active, .trackRow:hover{ background:rgba(255,255,255,.08); }
  .trackRow .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .tTitle{ font-size:14px; font-weight:700; }
  .tSub{ font-size:11px; color:var(--ink-dim); }
  .modalCloseBtn{ margin-top:10px; width:100%; font-family:inherit; font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:8px; cursor:pointer; }
  #hint{ bottom:calc(192px + env(safe-area-inset-bottom,0px)); }
  #dbg{ bottom:calc(186px + env(safe-area-inset-bottom,0px)); }
</style>
</head>
<body>
<canvas id="c" aria-label="海辺の町を見下ろす窓辺の風景"></canvas>
<div id="paper"></div>
<div id="vignette"></div>

<header id="tag">
  <h1>音綴り<span>- OtoTsuzuri -</span></h1>
</header>
<button id="listBtn">🎵 曲一覧</button>
<div id="player">
  <div id="nowPlaying"><div id="npTitle">-</div><div id="npSubtitle">タップして再生</div></div>
  <div id="transport">
    <button class="transportBtn" id="prevBtn" aria-label="前の曲">⏮</button>
    <button class="transportBtn" id="playBtn" aria-label="再生">▶</button>
    <button class="transportBtn" id="nextBtn" aria-label="次の曲">⏭</button>
  </div>
  <div id="subRow">
    <button id="modeBtn">🔂 1曲</button>
    <button id="muteBtn" aria-label="消音">🔊</button>
    <input type="range" id="volSlider" min="0" max="100" value="55" aria-label="音量">
  </div>
</div>
<div class="modalOverlay" id="listModal">
  <div class="modal" role="dialog" aria-label="曲一覧">
    <h2>曲一覧</h2>
    <div id="trackList"></div>
    <button class="modalCloseBtn" id="listCloseBtn">とじる</button>
  </div>
</div>
<p id="hint">ドラッグで回る　二本指で寄る・動かす</p>

<div id="dbg">
  <div class="row"><span id="tLabel">-</span><input type="range" id="tSlider" min="0" max="1000" value="0"></div>
  <div class="row">
    <span>速さ</span>
    <button data-speed="0">停止</button><button data-speed="1">×1</button><button data-speed="10">×10</button><button data-speed="60">×60</button>
    <button id="spotBtn" aria-pressed="false">置き場所</button><button id="windBtn">ゼンマイ切れ</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script>
  window.__err = null;
  window.addEventListener('error', e=>{ window.__err = (window.__err||'') + e.message + '\n'; });
  window.addEventListener('unhandledrejection', e=>{ window.__err = (window.__err||'') + String(e.reason) + '\n'; });
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reduceMotion ? 0.25 : 1;
const PARAMS = new URLSearchParams(location.search);

/* ================================================================
   一日の時計
   dayT：0 が真夜中、1 で一周。一日の長さは DAY_LEN 秒（ここだけで変える）。
   ?t=0.66 で時刻を固定、?speed=60 で早送り、?debug でスライダーを出す。
================================================================ */
const DAY_LEN = 720;                 // 一日 = 12 分
const DAY_START = 0.62;              // 開いたときは夕方
const SUNRISE = 0.08, SUNSET = 0.70; // 太陽が水平線を越える時刻
const MOONRISE = 0.74, MOONSET = 1.06;   // 月（翌朝 0.06 に沈む）
const MOON_CYCLE_DAYS = 30;          // 満ち欠けの一周り（ゲーム内の日数。実時間で6時間）
let dayT = PARAMS.has('t') ? parseFloat(PARAMS.get('t')) : DAY_START;
let dayCount = 0;                    // 経過した日数（満ち欠け用）
let timeSpeed = PARAMS.has('t') ? 0 : (parseFloat(PARAMS.get('speed')) || 1);

/* ---------- 乱数（毎回同じ町並みになるよう固定シード） ---------- */
let seed = 20260924;
function rnd(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
const clamp01 = x => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a)/(b - a)); return t*t*(3 - 2*t); };

/* ---------- レンダラ ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x34325f, 40, 420);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 4000);

/* ---------- 色の受け渡し ---------- */
// 自前シェーダーは色空間の変換を通らないので、sRGB の値にして渡す
function srgb(hex){ const c = new THREE.Color(hex); c.convertLinearToSRGB(); return new THREE.Vector3(c.r, c.g, c.b); }
function toSrgb(v, c){ const s = c.clone().convertLinearToSRGB(); v.set(s.r, s.g, s.b); return v; }

const GLSL_NOISE = `
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.),f.x), f.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+17.; a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=p*2.03+17.; a*=.5; } return v*1.107; }
`;

/* ================================================================
   配色：夜明け・朝・昼・夕方・夜 の5つを基準点にして補間する
   昼は羽結び（一日目・海渡り）の配色を下敷きにしている。
================================================================ */
const KEYS = [
  { t:.07, name:'夜明け',
    skyTop:0x5a6aa8, skyBot:0xf1c9b4, glow:0xffb98a, fog:0xd9c9c9,
    seaDeep:0x4f6893, seaLight:0xa8b4c8, hills:[0x8f9ab8,0x74809f,0x5e6a8a], cloud:0xe8c9c6,
    hemiSky:0xc9c7de, hemiGround:0x6a6480, hemiI:1.2, sunColor:0xffd3b0, sunI:1.0,
    stars:.25, inLight:0x6c6a80, ground:0x7a7693, glass:0x9ca6c8 },
  { t:.18, name:'朝',
    skyTop:0x7fa8d8, skyBot:0xf3e4cf, glow:0xfff0cc, fog:0xe6e1d2,
    seaDeep:0x6f9fae, seaLight:0xbfd5cf, hills:[0xb7c6c4,0x9bb0b0,0x80999a], cloud:0xfffaf2,
    hemiSky:0xe8eef5, hemiGround:0xa8b0c8, hemiI:1.8, sunColor:0xfff1d6, sunI:2.2,
    stars:0, inLight:0xaaa49c, ground:0x8f9a86, glass:0xb9c9d8 },
  { t:.42, name:'昼',
    skyTop:0xf4c49a, skyBot:0xf2e5c9, glow:0xffd9a8, fog:0xf0e2c6,
    seaDeep:0x7fa3a0, seaLight:0xc2d3c2, hills:[0xc2cfb2,0xa7bca6,0x87a39a], cloud:0xfff6e8,
    hemiSky:0xfbe6cc, hemiGround:0xc6bff4, hemiI:1.7, sunColor:0xffe4c0, sunI:1.8,
    stars:0, inLight:0xb8b2a8, ground:0x9aa88c, glass:0xc6d3c9 },
  { t:.66, name:'夕方',
    skyTop:0x6a6eae, skyBot:0xffd3a2, glow:0xffb070, fog:0xefbba1,
    seaDeep:0x4d6098, seaLight:0xc3919e, hills:[0xa08aa6,0x7f6d92,0x68587e], cloud:0xf4baae,
    hemiSky:0xf2c4b5, hemiGround:0x6b5b7b, hemiI:1.3, sunColor:0xffc79f, sunI:1.6,
    stars:.1, inLight:0x8c8088, ground:0x8e80a1, glass:0xcaa0a8 },
  { t:.85, name:'夜',
    skyTop:0x0e0c2e, skyBot:0x3a3870, glow:0x8d8fc0, fog:0x3f3b6a,
    seaDeep:0x111b44, seaLight:0x28356d, hills:[0x2f2f5e,0x262650,0x1e1e42], cloud:0x4a4878,
    hemiSky:0x5c62a8, hemiGround:0x221c3a, hemiI:.7, sunColor:0xb7c3ff, sunI:.5,
    stars:1, inLight:0x3a3850, ground:0x3e3c68, glass:0x2e2d55 },
];
const COLOR_KEYS = ['skyTop','skyBot','glow','fog','seaDeep','seaLight','cloud','hemiSky','hemiGround','sunColor','inLight','ground','glass'];
const NUM_KEYS = ['hemiI','sunI','stars'];
function makePal(src){
  const p = { hills:[] };
  for(const k of COLOR_KEYS) p[k] = new THREE.Color(src ? src[k] : 0);
  for(const k of NUM_KEYS) p[k] = src ? src[k] : 0;
  for(let i=0;i<3;i++) p.hills.push(new THREE.Color(src ? src.hills[i] : 0));
  return p;
}
const PALS = KEYS.map(makePal);
const cur = makePal(null);
let curName = '';
function evalPalette(t){
  t = ((t % 1) + 1) % 1;
  let i = KEYS.length - 1;
  for(let k=0;k<KEYS.length;k++){ if(t >= KEYS[k].t) i = k; }
  const j = (i + 1) % KEYS.length;
  const a = KEYS[i].t, b = KEYS[j].t + (j === 0 ? 1 : 0);
  const tt = t < a ? t + 1 : t;
  const e = sstep(a, b, tt);
  const A = PALS[i], B = PALS[j];
  for(const k of COLOR_KEYS) cur[k].copy(A[k]).lerp(B[k], e);
  for(const k of NUM_KEYS) cur[k] = A[k] + (B[k] - A[k])*e;
  for(let h=0;h<3;h++) cur.hills[h].copy(A.hills[h]).lerp(B.hills[h], e);
  curName = e < .5 ? KEYS[i].name : KEYS[j].name;
}

/* ---------- 時刻から決まる量 ---------- */
// 上がる区間 [a,b] と下がる区間 [c,d] を持つ 0/1 のスイッチ
function onOff(t, a, b, c, d){
  const rise = sstep(a, b, t), fall = 1 - sstep(c, d, t);
  if(a < c) return Math.min(rise, fall);          // 同じ日の中で点いて消える
  return Math.max(rise, fall);                      // 日をまたぐ（夜に点いて朝に消える）
}
const lampsOn   = t => onOff(t, .63, .70, .05, .10);   // 街灯・灯台・ランタン・小舟
const roomOn    = t => onOff(t, .58, .62, .79, .81);   // 室内の照明。家主は早寝
function litFrac(t){                                   // 町の窓明かりの割合
  if(t < .04) return .12;
  if(t < .10) return .12*(1 - sstep(.04, .10, t));
  if(t < .60) return 0;
  if(t < .74) return .85*sstep(.60, .74, t);
  if(t < .80) return .85;
  if(t < .95) return .85 - .73*sstep(.80, .95, t);
  return .12;
}

// 窓は南向き。太陽は左（東）から昇って右（西）へ沈む。弧は画角に寄せて狭めてある
// 窓の上端は視線から約17°。太陽は沈む前、月は一晩じゅう窓の中に入る高さにしてある
const sunDir = new THREE.Vector3(0, 1, 0), moonDir = new THREE.Vector3(0, 1, 0);
function arcDir(out, p, azSpan, elMax){
  const az = (p - .5)*azSpan, el = Math.sin(Math.PI*p)*elMax;
  out.set(Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el));
}
let sunUp = 0, moonUp = 0, moonPhase = 0;
function updateSky(t){
  const p = (t - SUNRISE)/(SUNSET - SUNRISE);
  arcDir(sunDir, p, THREE.MathUtils.degToRad(24), THREE.MathUtils.degToRad(66));
  sunUp = sstep(-.04, .04, sunDir.y);
  let tm = t < MOONSET - 1 ? t + 1 : t;
  const q = (tm - MOONRISE)/(MOONSET - MOONRISE);
  arcDir(moonDir, q, THREE.MathUtils.degToRad(40), THREE.MathUtils.degToRad(14));
  moonUp = (q >= 0 && q <= 1) ? sstep(-.02, .06, moonDir.y) : 0;
  moonPhase = ((dayCount + t)/MOON_CYCLE_DAYS) % 1;
}

/* ---------- トゥーン用の3段階グラデーション ---------- */
const gradMap = new THREE.DataTexture(new Uint8Array([95,95,95,255, 175,175,175,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;
gradMap.generateMipmaps = false;
gradMap.needsUpdate = true;
function toon(color, extra){ return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap:gradMap }, extra || {})); }
/* 室内の素材：時間帯の明るさを色に掛けて、部屋を暗く沈める */
const interior = [];
function inToon(color, extra){
  const m = toon(color, extra);
  interior.push({ m, base:new THREE.Color(color) });
  return m;
}
/* 時間帯の色をそのまま持つ素材 */
const tinted = [];
function tintToon(key, extra){ const m = toon(0xffffff, extra); tinted.push({ m, key }); return m; }

/* ---------- 輪郭線（反転ハル。体色に近い暗色で描く） ---------- */
const OUT_IN = 0x4a3446, OUT_EX = 0x2c2749;
const outlineMats = {};
function outlineMat(col){
  if(!outlineMats[col]) outlineMats[col] = new THREE.MeshBasicMaterial({ color:col, side:THREE.BackSide });
  return outlineMats[col];
}
function addOutline(mesh, t, col){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = new THREE.Vector3(); g.boundingBox.getSize(s);
  const o = new THREE.Mesh(g, outlineMat(col));
  o.scale.set(s.x > 1e-4 ? (s.x + 2*t)/s.x : 1, s.y > 1e-4 ? (s.y + 2*t)/s.y : 1, s.z > 1e-4 ? (s.z + 2*t)/s.z : 1);
  mesh.add(o);
  return o;
}
function box(w,h,d,mat,x,y,z,parent,outline,oc){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  (parent || scene).add(m);
  if(outline) addOutline(m, outline, oc || OUT_IN);
  return m;
}

/* ---------- テクスチャ ----------
   透明に近い画素を持つものは、キャンバスのグラデーションでなく画素を直接書く
   （iOS でキャンバスの半透明画素が虹色の点々に崩れるため） */
function radialTex(n, fn){
  const px = new Uint8Array(n*n*4), c = n/2;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const d = Math.min(1, Math.hypot(x - c + .5, y - c + .5)/c);
    const [r,g,b,a] = fn(d), o = (y*n + x)*4;
    px[o] = r; px[o+1] = g; px[o+2] = b; px[o+3] = a;
  }
  const t = new THREE.DataTexture(px, n, n);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
const glowTex = radialTex(64, d => [255,255,255, 255*Math.pow(1 - d, 2.2)]);
function canvasTex(size, draw, h){
  const c = document.createElement('canvas');
  c.width = size; c.height = h || size;
  draw(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;

/* ================================================================
   遠山：地平を囲む重なったシルエット。頂点色で下端を霧色へ寄せる。
   海の先は水平線にしたいので、正面は低く、左右の端ほど高くする。
================================================================ */
const HILLS = [
  { r:900, h:60, seed:1.3, bias:-.05, fade:.8 },
  { r:820, h:46, seed:4.1, bias:-.15, fade:.65 },
  { r:740, h:32, seed:7.7, bias:-.30, fade:.5 },
];
const hills = new THREE.Group();
const hillMeshes = [];
for(const L of HILLS){
  const N = 420, pos=[], col=[], mask=[], idx=[];
  for(let i=0;i<=N;i++){
    const a = i/N*Math.PI*2;
    let n = 0.55*Math.sin(a*3+L.seed) + 0.30*Math.sin(a*7+L.seed*2.3)
          + 0.18*Math.sin(a*13+L.seed*5.1) + 0.11*Math.sin(a*29+L.seed*9.7)
          + 0.07*Math.sin(a*61+L.seed*3.3) + 0.04*Math.sin(a*131+L.seed*7.9);
    n = Math.max(0, n*0.5+0.5+L.bias);
    // 視線（-z）からの方位。正面は低くなだらかに、横へ行くほど高く
    let da = a + Math.PI/2; da = Math.atan2(Math.sin(da), Math.cos(da));
    const side = .6 + .4*sstep(.3, 1.1, Math.abs(da));
    const h = (L.h * Math.pow(n,1.1) + 2) * side;
    const x = Math.cos(a)*L.r, z = Math.sin(a)*L.r;
    pos.push(x,h,z, x,-60,z);
    col.push(0,0,0, 0,0,0);
    mask.push(side*L.fade, 0);
    if(i<N){ const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, fog:false, side:THREE.DoubleSide }));
  m.renderOrder = -1;
  hills.add(m);
  hillMeshes.push({ m, mask });
}
scene.add(hills);
const _hc = new THREE.Color();
function paintHills(p){
  hillMeshes.forEach((H, li)=>{
    const top = p.hills[li], fog = p.fog, ca = H.m.geometry.attributes.color;
    for(let i=0;i<ca.count;i++){
      // 下端は霧色、上端も霧色に大きく寄せて、水平線の向こうにうっすら見える程度にする
      _hc.copy(fog).lerp(top, H.mask[i]);
      ca.setXYZ(i, _hc.r, _hc.g, _hc.b);
    }
    ca.needsUpdate = true;
  });
}

/* ================================================================
   海：fbm で歪ませた水彩の濃淡、うねり、太陽と月の照り返し、きらめき、霧。
   波紋・浅瀬・鳥の影は持ってこない。
================================================================ */
const SEA_Y = -6;
const seaMat = new THREE.ShaderMaterial({
  fog:false,
  uniforms:{ uT:{value:0}, uDeep:{value:new THREE.Vector3()}, uLight:{value:new THREE.Vector3()},
             uFog:{value:new THREE.Vector3()}, uNear:{value:50}, uFar:{value:470},
             uSun:{value:sunDir}, uGlow:{value:new THREE.Vector3()}, uSunUp:{value:0}, uSunLow:{value:0},
             uMoon:{value:moonDir}, uMoonCol:{value:new THREE.Vector3(.85,.87,1)}, uMoonUp:{value:0},
             uCalm:{value:PARAMS.has('calm') ? parseFloat(PARAMS.get('calm')) : 1} },
  vertexShader:`varying vec3 vW;
    void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader:`precision highp float; varying vec3 vW;
    uniform float uT,uNear,uFar,uSunUp,uSunLow,uMoonUp,uCalm; uniform vec3 uDeep,uLight,uFog,uSun,uGlow,uMoon,uMoonCol;
    ${GLSL_NOISE}
    vec3 waves(vec2 p, float t){
      vec2 D[4]; D[0]=vec2(.8,.6); D[1]=vec2(-.5,.87); D[2]=vec2(.2,-.98); D[3]=vec2(-.9,-.3);
      float F[4]; F[0]=.35; F[1]=.62; F[2]=1.1; F[3]=1.9;
      float h=0.; vec2 g=vec2(0.);
      for(int i=0;i<4;i++){
        float ph=dot(p,D[i])*F[i] + t*1.6*sqrt(9.8*F[i]);
        float a=.12/F[i];
        h+=a*sin(ph); g+=a*F[i]*cos(ph)*D[i];
      }
      return vec3(g,h);
    }
    void main(){
      vec2 p=vW.xz;
      float dist=length(p-cameraPosition.xz);
      if(dist>=uFar){ gl_FragColor=vec4(uFog,1.); return; }
      float t=uT*2.2;
      float near=1.-smoothstep(25.,110.,dist);

      vec2 q=p+8.*vec2(fbm3(p*.02+vec2(t*.05,0.)), fbm3(p*.02+vec2(0.,-t*.04)));
      float big=fbm3(q*.005+vec2(t*.012,0.));
      float mid=fbm(q*.022+vec2(t*.02,t*.03));
      vec3 col=mix(uDeep,uLight,smoothstep(.3,.72,big));
      // 中くらいの模様（顔料の溜まり・明るい斑）。見下ろすと汚れに見えるので静かな海では消す
      float midK=1.-uCalm*.9;
      float edge=1.-smoothstep(0.,.035,abs(mid-.52));
      col=mix(col,uDeep*.88,edge*.3*midK);
      col=mix(col,uLight*1.03,smoothstep(.55,.75,mid)*.3*midK);
      float r1=fbm3(vec2(q.x*.07,q.y*.24)+vec2(t*.35,t*.12));
      float r2=fbm3(vec2(q.x*.22,q.y*.08)+vec2(-t*.22,t*.3));
      float fine=1.-uCalm*.7;
      col+=(smoothstep(.6,.76,r1)*.05 + smoothstep(.62,.78,r2)*.035)*fine;
      col-=smoothstep(.6,.3,r1*r2*2.)*.02*fine;

      vec3 w=waves(mix(p,q,.7),uT);
      float gust=mix(.3,1.35,smoothstep(.28,.72,fbm3(q*.011+vec2(-t*.03,t*.02))));
      vec2 gsum=w.xy*1.6*gust*.8*(1.-uCalm*.75);
      vec2 cg=vec2(0.);
      if(near>0. && uCalm<.99){
        vec2 E[3]; E[0]=vec2(.94,.34); E[1]=vec2(-.6,.8); E[2]=vec2(.1,-1.);
        float G[3]; G[0]=3.1; G[1]=5.3; G[2]=8.7;
        for(int i=0;i<3;i++){
          float ph=dot(p,E[i])*G[i] + uT*1.6*sqrt(9.8*G[i]);
          cg+=.03*cos(ph)*E[i];
        }
        vec2 e=vec2(.35,0.), o=vec2(uT*.9,uT*.6);
        float nn=fbm3(p*1.1+o);
        cg+=vec2(fbm3(p*1.1+e+o)-nn, fbm3(p*1.1+e.yx+o)-nn)*.3;
        gsum+=cg*near*mix(.6,1.1,gust)*(1.-uCalm);
      }
      vec3 n=normalize(vec3(-gsum.x,1.,-gsum.y));
      vec3 v=normalize(vW-cameraPosition);
      vec3 r=reflect(v,n);
      float s=max(dot(r,uSun),0.);
      float sm=max(dot(r,uMoon),0.);
      float fr=pow(1.-max(dot(-v,n),0.),4.);

      float lit=dot(n,uSun)-uSun.y;
      col+=lit*vec3(.9,.8,.6)*(.08+near*.22)*uSunUp;
      col=mix(col,uFog*1.02,fr*.3);
      col=mix(col,uDeep*.92,(1.-fr)*near*.18);
      if(near>0.){
        float crest=smoothstep(.62,.7,fbm3(vec2(p.x*.9,p.y*.45)+cg*2.+vec2(uT*.7,uT*.3)));
        col=mix(col,uLight*1.08,crest*near*.35);
      }
      // 照り返し：太陽が低いほど強く、温かく。月は弱く
      float sheen=pow(s,mix(10.,5.,uSunLow)*(1.-uCalm*.5))*mix(.22,.7,uSunLow)*uSunUp*(1.-uCalm*.35);
      col=mix(col,uGlow*1.05,sheen);
      col=mix(col,uMoonCol,pow(sm,16.)*.28*uMoonUp);
      // きらめき：点に砕けた鋭いハイライト
      if(dist<500. && uCalm<.99){
        float cell=hash(floor(q*1.3));
        float blink=.5+.5*sin(t*(3.+cell*5.)+cell*40.);
        float dots=smoothstep(.74,.95,noise(q*1.3+vec2(t*.6,t*.4)))*blink*mix(.55,1.1,gust);
        float sp=pow(s,110.)*dots*(2.6+2.*uSunLow)*uSunUp + pow(sm,110.)*dots*1.6*uMoonUp;
        sp*=(1.-smoothstep(200.,500.,dist))*(1.-uCalm);
        col=mix(col,vec3(1.,.97,.9),min(sp,1.)*.85);
      }
      col=mix(col,uFog,smoothstep(uNear,uFar,dist));
      gl_FragColor=vec4(col,1.);
    }`
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(2600, 2600), seaMat);

/* ================================================================
   雲：画素を直接書いた水彩の塊。時間帯で色を変える。
================================================================ */
const cloudMats = [];
{
  const cn = (x,y,sd)=>{
    let v=0,a=.5,f=1;
    for(let o=0;o<4;o++){
      const X=x*f+sd*13.1, Y=y*f+sd*7.7, xi=Math.floor(X), yi=Math.floor(Y);
      const fx=X-xi, fy=Y-yi, u=fx*fx*(3-2*fx), w=fy*fy*(3-2*fy);
      const h=(p,q)=>{ const t=Math.sin(p*127.1+q*311.7)*43758.5453; return t-Math.floor(t); };
      v+=a*((h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-w)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*w);
      a*=.5; f*=2;
    }
    return v;
  };
  for(let k=0;k<4;k++){
    const W=256,H=128, px=new Uint8Array(W*H*4);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const nx=(x-W/2)/(W/2), ny=(y-H*.62)/(H*.5);
      let body = 1 - (nx*nx + (ny<0? ny*ny*.9 : ny*ny*4.0));
      body += (cn(x/40,y/40,k)-.5)*1.1;
      const d = Math.min(1, Math.max(0, body*2.2));
      const rim = Math.max(0, 1-Math.abs(body-.08)/.08);
      const ex = Math.min(x, W-1-x)/(W*.12), ey = Math.min(y, H-1-y)/(H*.12);
      const edge = Math.min(1, ex)*Math.min(1, ey);
      const al = (d*.55 + rim*.25) * edge*edge*(3-2*edge);
      const shade = 1 - rim*.08 - Math.max(0,ny)*.06;
      const o=((H-1-y)*W+x)*4;
      px[o]=255*shade; px[o+1]=250*shade; px[o+2]=240*shade; px[o+3]=Math.min(255,al*255);
    }
    const t=new THREE.DataTexture(px,W,H); t.colorSpace=THREE.SRGBColorSpace;
    t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearFilter; t.needsUpdate=true;
    cloudMats.push(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false, opacity:.85 }));
  }
}

function bump(x,z,cx,cz,h,sx,sz){ return h*Math.exp(-(((x-cx)*(x-cx))/sx + ((z-cz)*(z-cz))/sz)); }
function groundY(x,z){
  const d = -z;
  let y;
  if(d < 6) y = -1.5;
  else if(d < 34) y = -1.5 - (d-6)/28*4.3;
  else y = -5.8 - (d-34)*.35;
  y += Math.pow(Math.abs(x)/34, 2) * 7 * Math.min(1, Math.max(0, (d-4)/10));
  y += bump(x,z,19,-47,6,70,140) + bump(x,z,-30,-62,11,160,220);
  return y;
}

function midiToFreq(m){ return 440*Math.pow(2, (m-69)/12); }

function ensureAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : volume;

    masterCompressor.threshold.value = -12;

function buildImpulseResponse(ctx, seconds, decay){
  const rate = ctx.sampleRate, length = Math.max(1, Math.floor(rate*seconds));
  const impulse = ctx.createBuffer(2, length, rate);
  for(let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i=0;i<length;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/length, decay);

  return impulse;

  flue:playFlueNote, feltpiano:playFeltPianoNote, mutedmusicbox:playMutedMusicBoxNote, bell:playBellNote, strings:playStringsNote };
const DEFAULT_INSTRUMENTS = { melody:'musicbox', arp:'triangle', pad:'pad', bass:'bass', bell:'bell', strings:'strings' };
const PARTS = ['melody','arp','pad','bass','bell','strings'];
function trackInstruments(track){ return Object.assign({}, DEFAULT_INSTRUMENTS, track.instruments || {}); }

function stopAllAudio(){
  playGeneration++;
  if(bgmLoopTimer){ clearTimeout(bgmLoopTimer); bgmLoopTimer = null; }
  if(audioCtx && masterGain){
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);

/* ---- 先読みスケジューラ（回転速度に追従） ----
   25ms ごとに起き、曲の位置 song.pos を audio の時計 × speed で進める。
   予約するのは「曲の位置が pos + 先読み秒×speed までのノート」。
   発音時刻 = 今 + (ノートの位置 - pos)/speed。長さも /speed で伸びる。 */
const LOOKAHEAD_INTERVAL_MS = 25, SCHEDULE_AHEAD_SEC = .2;
function scheduleTrackLoop(track, startAt, gen){
  const insts = trackInstruments(track);
  const flat = [];
  for(const part of PARTS){
    const events = track[part];
    if(!events || !events.length) continue;
    const fn = INSTRUMENTS[insts[part]] || INSTRUMENTS[DEFAULT_INSTRUMENTS[part]];
    for(const [t,midi,dur,vel] of events) flat.push({ t, midi, dur, vel, fn });
  }
  flat.sort((a,b)=>a.t - b.t);
  let cursor = 0, loopIdx = 0;   // flat の次の予約位置と、何周目を予約しているか
  let absPos = 0, lastNow = startAt;
  song.pos = 0; song.started = true;

  function tick(){
    if(gen !== playGeneration) return;
    const now = audioCtx.currentTime;
    const n = Math.max(now, startAt);
    // ゼンマイ切れ：テンポが落ち、やがて止まる
    if(song.winding){
      song.windT += n - lastNow;
      song.speed = Math.max(0, 1 - Math.pow(song.windT/WIND_SEC, 1.7));
      if(song.speed <= .015){ stopAllAudio(); return; }
    }
    absPos += (n - lastNow)*song.speed;
    lastNow = n;
    song.pos = absPos % track.loopSec;

    // 1曲モード以外は1周で次へ（タブ復帰などで大きく進んでいても1周で区切る）
    if(playMode !== 'single' && absPos >= track.loopSec){ advanceTrack(); return; }
    // タブ復帰で何周も進んでいたら予約位置を追いつかせる（重ね鳴り防止）
    while(absPos >= (loopIdx + 1)*track.loopSec){ loopIdx++; cursor = 0; }

    const velK = .35 + .65*Math.sqrt(song.speed);          // 弾く力
    const ahead = absPos + SCHEDULE_AHEAD_SEC*song.speed;
    if(song.speed > 0){
      for(;;){
        if(cursor >= flat.length){
          if(playMode !== 'single') break;                  // 次の曲へ回すので先の周は予約しない
          loopIdx++; cursor = 0;
        }
        const ev = flat[cursor], evAbs = ev.t + loopIdx*track.loopSec;
        if(evAbs > ahead) break;
        const at = n + (evAbs - absPos)/song.speed;
        ev.fn(Math.max(at, now), ev.midi, ev.dur/song.speed, ev.vel*velK);
        cursor++;
      }
    }
    bgmLoopTimer = setTimeout(tick, LOOKAHEAD_INTERVAL_MS);
  }
  tick();
}
function advanceTrack(){
  let nextIdx;
  if(playMode === 'shuffle'){
    if(TRACKS.length <= 1) nextIdx = currentTrackIdx;
    else { do { nextIdx = Math.floor(Math.random()*TRACKS.length); } while(nextIdx === currentTrackIdx); }
  } else {
    const order = FIXED_ORDER_IDS.map(id => TRACKS.findIndex(t=>t.id===id)).filter(i=>i>=0);
    const pos = order.indexOf(currentTrackIdx);
    nextIdx = order[(pos+1) % order.length];
  }
  playTrack(nextIdx, .8);
}
function playTrack(idx, gapSec){
  if(gapSec === undefined) gapSec = .12;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume();
  stopAllAudio();
  currentTrackIdx = idx;
  const track = TRACKS[idx];
  song.track = track; song.pos = 0; song.speed = 1; song.winding = false; song.windT = 0;
  orgel.setTrack(track);
  const gen = playGeneration;
  const startAt = ctx.currentTime + gapSec;
  const targetVol = muted ? 0 : volume;
  masterGain.gain.cancelScheduledValues(ctx.currentTime);
  masterGain.gain.setValueAtTime(.0001, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(targetVol, startAt + .05);

  updateNowPlaying(); updatePlayBtn(); renderTrackList();
}

    while(combGroup.children.length) combGroup.remove(combGroup.children[0]);
    teeth = [];
    for(let i=0;i<n;i++){
      const pivot = new THREE.Group(); pivot.position.set(toothX(i), TIP_Y, COMB_ROOT); combGroup.add(pivot);
      const t = new THREE.Mesh(new THREE.BoxGeometry(slot*.78, .08, TL), steel);
      t.position.z = -TL/2; pivot.add(t); addOutline(t, .012, OUT_MECH);
      if(i < n/3){   // 低音側は裏の鉛で調律する
        const w = new THREE.Mesh(new THREE.BoxGeometry(slot*.66, .14, .6 - (i/(n/3))*.3), leadMat);
        w.position.set(0, -.11, -TL + .45); pivot.add(w); addOutline(w, .01, OUT_MECH);
      }
      teeth.push({ pivot, age:99, amp:0, midi:pitches[i] });
    }
    // ピン：ノートごとに1本。同じ歯の同時刻は1本にまとめる
    const seen = new Set(); notes = [];
    for(const part of ['melody','arp']) for(const [t,midi] of (track[part] || [])){
      const tooth = pitches.indexOf(midi), key = t.toFixed(3) + ':' + tooth;
      if(seen.has(key)) continue; seen.add(key);
      notes.push({ t, tooth, psi:-t/loopSec*Math.PI*2 });
    }
    notes.sort((a,b)=>a.t-b.t);
    if(pins){ cyl.remove(pins); pins.dispose(); }
    pins = new THREE.InstancedMesh(pinGeo, pinMat, Math.max(1, notes.length));
    const Mm = new THREE.Matrix4(), Qq = new THREE.Quaternion(), E = new THREE.Euler(), P = new THREE.Vector3(), S1 = new THREE.Vector3(1,1,1);
    notes.forEach((nt,i)=>{
      const rr = R + .1;
      P.set(toothX(nt.tooth), Math.sin(nt.psi)*rr, Math.cos(nt.psi)*rr);
      Qq.setFromEuler(E.set(Math.PI/2 - nt.psi, 0, 0));
      Mm.compose(P, Qq, S1); pins.setMatrixAt(i, Mm);
      pins.setColorAt(i, PIN_BASE);
    });
    pins.instanceMatrix.needsUpdate = true;
    cyl.add(pins);
    lastPos = 0;
  }

  /* 歯の先端の世界座標（音符を出す位置に使う） */
  const _tip = new THREE.Vector3();
  function tipWorld(toothIdx, out){
    const t = teeth[toothIdx]; if(!t) return out.set(0,0,0);
    return t.pivot.localToWorld(out.set(0, 0, -TL));
  }

  /* ---- 毎フレーム：song.pos から回転と弾きを出す ---- */
  let lastPos = 0;
  const struck = [];   // このフレームで弾いた歯（音符の発生に使う）
  function update(dt){
    const pos = song.started ? song.pos : lastPos;
    struck.length = 0;
    if(song.started){
      const a = lastPos, b = pos;
      for(const nt of notes){
        const hit = b >= a ? (nt.t > a && nt.t <= b) : (nt.t > a || nt.t <= b);
        if(hit){ const tt = teeth[nt.tooth]; tt.age = 0; tt.amp = .09*(.35 + .65*Math.sqrt(song.speed)); struck.push(nt.tooth); }
      }
      lastPos = pos;
    }
    const ang = pos/loopSec*Math.PI*2;
    cyl.rotation.x = -ang;
    const w2 = ang*(1.3/.45);
    shaft2.rotation.x = w2;
    shaft3.rotation.x = -w2*(.8/.3);
    fan.rotation.x = -w2*(.8/.3)*5;
    barrel.rotation.y = -ang*.4;
    if(pins){
      for(let i=0;i<notes.length;i++){
        let w = notes[i].psi + ang;
        w = Math.atan2(Math.sin(w), Math.cos(w));
        const hot = w > -.5 && w < .06 ? Math.pow(1 - Math.abs(w + .05)/.55, 2) : 0;
        pins.setColorAt(i, _pc.copy(PIN_BASE).lerp(PIN_HOT, hot));
      }
      pins.instanceColor.needsUpdate = true;
    }
    for(const t of teeth){
      t.age += dt;
      t.pivot.rotation.x = t.age < 3 ? t.amp*Math.exp(-t.age*9)*Math.sin(t.age*70) : 0;
    }
  }
  setTrack(TRACKS[0]);
  return { update, setTrack, tipWorld, struck, get teeth(){ return teeth; } };
})();

/* ================================================================
   鳥：assets/bird_mdl の28クリップ版。モデルは共通で、テクスチャだけ鳥ごとに差し替える。
   第4段階の最初は、輪郭線なし／輪郭線あり（モデル同梱）／輪郭線なし＋コード側の輪郭線 の
   3羽を手すりに並べて比較する（どれを使うかはユーザーが決める）。
================================================================ */
const ASSET_BASE = '../assets/';
const BIRD_FILES = { plain:'bird_mdl/glb/MyBird_v1.1_notex.glb', outline:'bird_mdl/glb/MyBird_v1.1_outline_notex.glb' };
const BIRD_TEX_IDS = ['01_shiro','02_shirube','03_momo','04_sumire','05_minamo','06_sora','07_kinako','08_ame','09_kurumi','10_hoshi','11_tsuki'];
const birdTexCache = {};
function birdTex(id){
  if(!birdTexCache[id]){
    const t = new THREE.TextureLoader().load(ASSET_BASE + 'bird_mdl/texture/tex_bird_' + id + '.png');
    t.colorSpace = THREE.SRGBColorSpace; t.flipY = false;
    birdTexCache[id] = t;
  }
  return birdTexCache[id];
}
const birdSrc = {};          // 読み込んだ glb（複製の元）
const birds = [];            // 置いた鳥
const BIRD_OUTLINE_COL = 0x4a3a44;
function makeBird(variant, texId, codeOutline){
  const src = birdSrc[variant]; if(!src) return null;
  const model = SkeletonUtils.clone(src.scene);
  let body = null, outline = null;
  model.traverse(o=>{
    if(!o.isSkinnedMesh) return;
    if(/outline/i.test(o.name)){
      outline = o;
      o.material = new THREE.MeshBasicMaterial({ color:BIRD_OUTLINE_COL });
    } else {
      body = o;
      o.material = new THREE.MeshToonMaterial({ map:birdTex(texId), gradientMap:gradMap });
      o.frustumCulled = false;
    }
  });
  // コード側の輪郭線：同じ骨を共有する複製を、法線方向に押し出して裏面だけ描く
  if(codeOutline && body){
    const o = new THREE.SkinnedMesh(body.geometry, new THREE.MeshBasicMaterial({ color:BIRD_OUTLINE_COL, side:THREE.BackSide }));
    o.material.onBeforeCompile = sh=>{
      sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n transformed += normalize(objectNormal) * 0.004;');
    };
    o.bind(body.skeleton, body.bindMatrix);
    o.frustumCulled = false;
    body.parent.add(o);
    outline = o;
  }
  const mixer = new THREE.AnimationMixer(model);
  const clips = {}; for(const c of src.animations) clips[c.name] = c;
  const bird = { model, mixer, clips, body, outline, current:null };
  bird.play = (name, fade=.25)=>{
    const c = clips[name]; if(!c) return;
    const a = mixer.clipAction(c);
    if(bird.current && bird.current !== a){ a.reset().play(); bird.current.crossFadeTo(a, fade, false); }
    else a.reset().play();
    bird.current = a;
  };
  scene.add(model); birds.push(bird);
  return bird;
}
async function loadBirds(){
  const loader = new GLTFLoader();
  for(const k in BIRD_FILES) birdSrc[k] = await loader.loadAsync(ASSET_BASE + BIRD_FILES[k]);
  // 比較用の3羽。手すりの上、部屋の方を向いて
  const a = makeBird('plain', '01_shiro', false);   a.model.position.set(-.46, SILL_TOP, .1);  a.model.rotation.y = Math.PI*.35;  a.play('idle');
  const b = makeBird('outline', '03_momo', false);  b.model.position.set(.46, SILL_TOP, .1);   b.model.rotation.y = -Math.PI*.35; b.play('idle');
  const c = makeBird('plain', '06_sora', true);     c.model.position.set(-.3, RAIL_TOP + .035, RAIL_Z); c.model.rotation.y = Math.PI*.8; c.play('preen');

}

  evalPalette(t);
  updateSky(t);
  const p = cur;
  const lamps = lampsOn(t), room = roomOn(t);

  paintHills(p);

  // 太陽の円盤：低いほど温かい色。月：満ち欠け
  _c.copy(SUN_WHITE).lerp(p.glow, sunLow*.85);
  toSrgb(sunMat.uniforms.uCol.value, _c);
  sunMat.uniforms.uLow.value = sunLow;
  sunMat.uniforms.uVis.value = sstep(-.03, .01, sunDir.y);

  moon.scale.setScalar(ORB_DIST*.085);

  // 光：昼は太陽、夜は月
  hemi.color.copy(p.hemiSky); hemi.groundColor.copy(p.hemiGround); hemi.intensity = p.hemiI;
  if(sunUp > 0.01){

    dirLight.position.copy(moonDir).multiplyScalar(60);
  }
  roomLight.intensity = 16*room;

  tinted.forEach(o=>o.m.color.copy(p[o.key]));
  interior.forEach(o=>o.m.color.copy(o.base).multiply(p.inLight));
  clouds.forEach(c=>c.material.color.copy(p.cloud));

  paintWindows(p, litFrac(t), false);
  lampMat.opacity = lamps;

  beamMat.uniforms.uOp.value = .18*lamps;
  lanternGlow.material.opacity = lamps*.9;
  lanternBox.material.color.setRGB(1, .86, .63).multiplyScalar(.5 + lamps*.5);

  boats.forEach(b=>{ b.userData.light.material.opacity = lamps; });
}

/* ---------- カメラ操作：オルゴールを中心に回る ----------
   1本指ドラッグ：回る（方位・仰角）。ピンチ／トラックパッドのピンチ：寄る・引く。
   2本指ドラッグ／トラックパッドの2本指スクロール：平行移動。
   URL 引数 ?az= ?el= ?dist=（度・度・m）で固定できる。 */
const ORBIT = {
  az:0, el:.21, dist:3.2,                    // 目標値
  cAz:0, cEl:.21, cDist:3.2,                 // 追従する現在値
  // 平行移動。既定では窓が収まるよう少し上を見る。寄るほど（距離に比例して）オルゴールの中心へ戻る
  pan:new THREE.Vector3(0, .55, 0), cPan:new THREE.Vector3(0, .55, 0),
  AZ_MAX:THREE.MathUtils.degToRad(60), EL_MIN:THREE.MathUtils.degToRad(2), EL_MAX:THREE.MathUtils.degToRad(60),
  DIST_MIN:.25, DIST_MAX:3.6, PAN_MAX:.9,
};
const ORBIT_CENTER = new THREE.Vector3(0, SILL_TOP + .05, .06);   // オルゴールの中心あたり
if(PARAMS.has('az')) ORBIT.az = ORBIT.cAz = THREE.MathUtils.degToRad(parseFloat(PARAMS.get('az')));
if(PARAMS.has('el')) ORBIT.el = ORBIT.cEl = THREE.MathUtils.degToRad(parseFloat(PARAMS.get('el')));
if(PARAMS.has('dist')) ORBIT.dist = ORBIT.cDist = parseFloat(PARAMS.get('dist'));
if(PARAMS.has('pany')) ORBIT.pan.y = ORBIT.cPan.y = parseFloat(PARAMS.get('pany'));
if(PARAMS.has('panx')) ORBIT.pan.x = ORBIT.cPan.x = parseFloat(PARAMS.get('panx'));
if(PARAMS.has('panz')) ORBIT.pan.z = ORBIT.cPan.z = parseFloat(PARAMS.get('panz'));
const hint = document.getElementById('hint');
let hinted = false;
function hideHint(){ if(!hinted){ hinted = true; hint.style.opacity = '0'; } }
const clampO = ()=>{
  ORBIT.az = THREE.MathUtils.clamp(ORBIT.az, -ORBIT.AZ_MAX, ORBIT.AZ_MAX);
  ORBIT.el = THREE.MathUtils.clamp(ORBIT.el, ORBIT.EL_MIN, ORBIT.EL_MAX);
  ORBIT.dist = THREE.MathUtils.clamp(ORBIT.dist, ORBIT.DIST_MIN, ORBIT.DIST_MAX);
  ORBIT.pan.x = THREE.MathUtils.clamp(ORBIT.pan.x, -ORBIT.PAN_MAX, ORBIT.PAN_MAX);
  ORBIT.pan.y = THREE.MathUtils.clamp(ORBIT.pan.y, -.3, ORBIT.PAN_MAX);
  ORBIT.pan.z = THREE.MathUtils.clamp(ORBIT.pan.z, -.2, .6);
};
const _pr = new THREE.Vector3(), _pu = new THREE.Vector3();
function panBy(dx, dy){   // 画面の右・上の向きへ、距離に応じた量だけ動かす
  const k = ORBIT.cDist*.0016/Math.min(1, ORBIT.cDist/3.2);
  camera.matrixWorld.extractBasis(_pr, _pu, new THREE.Vector3());
  ORBIT.pan.addScaledVector(_pr, -dx*k).addScaledVector(_pu, dy*k);
}
const pointers = new Map();
let lastPinch = 0, lastMid = null;
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  lastPinch = 0; lastMid = null;
  hideHint();
});
canvas.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p) return;
  if(pointers.size === 1){
    ORBIT.az -= (e.clientX - p.x)*.005;
    ORBIT.el += (e.clientY - p.y)*.004;
  }
  p.x = e.clientX; p.y = e.clientY;
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    if(lastPinch) ORBIT.dist *= lastPinch/d;
    if(lastMid) panBy(mx - lastMid.x, my - lastMid.y);
    lastPinch = d; lastMid = { x:mx, y:my };
  }
  clampO();
});
function endPointer(e){ pointers.delete(e.pointerId); lastPinch = 0; lastMid = null; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  if(e.ctrlKey) ORBIT.dist *= 1 + e.deltaY*.01;          // トラックパッドのピンチ
  else panBy(-e.deltaX, -e.deltaY);                       // 2本指スクロール
  clampO();
  hideHint();
}, { passive:false });

/* ---------- ループ ---------- */
let last = performance.now(), clock = 0, curtainTick = 0;
const LOOK = new THREE.Vector3();
applyTime(dayT);
paintWindows(cur, litFrac(dayT), true);
renderer.setAnimationLoop(now=>{
  const dt = Math.min((now - last)/1000, .05);
  last = now; clock += dt;

  dayT += dt*timeSpeed/DAY_LEN;
  if(dayT >= 1){ dayT -= 1; dayCount++; }
  applyTime(dayT);
  refreshDebug();

  const k = Math.min(1, dt*6);
  ORBIT.cAz += (ORBIT.az - ORBIT.cAz)*k; ORBIT.cEl += (ORBIT.el - ORBIT.cEl)*k;
  ORBIT.cDist += (ORBIT.dist - ORBIT.cDist)*k; ORBIT.cPan.lerp(ORBIT.pan, k);
  LOOK.copy(ORBIT_CENTER).addScaledVector(ORBIT.cPan, Math.min(1, ORBIT.cDist/3.2));
  camera.position.set(
    LOOK.x + Math.sin(ORBIT.cAz)*Math.cos(ORBIT.cEl)*ORBIT.cDist,
    LOOK.y + Math.sin(ORBIT.cEl)*ORBIT.cDist,
    LOOK.z + Math.cos(ORBIT.cAz)*Math.cos(ORBIT.cEl)*ORBIT.cDist);
  camera.lookAt(LOOK);

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  hills.position.set(camera.position.x, 0, camera.position.z);
  sun.position.copy(camera.position).addScaledVector(sunDir, ORB_DIST); sun.lookAt(camera.position);
  moon.position.copy(camera.position).addScaledVector(moonDir, ORB_DIST); moon.lookAt(camera.position);
  seaMat.uniforms.uT.value = clock*MOTION;
  starMat.uniforms.uTime.value = clock;

  clouds.forEach(c=>{
    c.position.x += c.userData.v*dt;
    if(c.position.x > 600) c.position.x = -600;
  });
  boats.forEach(b=>{
    const ph = b.userData.phase;
    b.position.y = SEA_Y + .12 + Math.sin(clock*1.1 + ph)*.06*MOTION;
    b.rotation.z = Math.sin(clock*.9 + ph)*.05*MOTION;
  });

  beamPivot.rotation.y = clock*.7*MOTION;
  {
    const bx = Math.cos(beamPivot.rotation.y), bz = -Math.sin(beamPivot.rotation.y);
    const tx = camera.position.x - lhX, tz = camera.position.z - lhZ;
    const tl = Math.hypot(tx,tz);
    const facing = Math.max(0, (bx*tx + bz*tz)/tl);
    const flash = Math.pow(facing, 30);
    const s = 1.6 + flash*6*beamMat.uniforms.uOp.value/.18;
    lhGlow.scale.set(s, s, 1);
  }

  curtainTick += dt;
  if(curtainTick > 1/30){
    curtainTick = 0;
    curtains.forEach(c=>{
      const pa = c.m.geometry.attributes.position;
      const arr = pa.array, b = c.base;
      for(let i=0;i<pa.count;i++){
        const x = b[i*3], y = b[i*3+1];
        const u = (x + c.w/2)/c.w;
        const v = (c.h/2 - y)/c.h;
        const pleat = Math.sin(u*19)*.035;
        const wave = Math.sin(u*6 + clock*1.2 + c.sign*2)*.045*v*MOTION;
        const breeze = (Math.sin(clock*.55 + c.sign) *.5 + .5) * v*v * .09 * MOTION;
        arr[i*3] = x - c.sign*breeze*.6;
        arr[i*3+2] = pleat + wave + breeze*.5;
      }
      pa.needsUpdate = true;
      c.m.geometry.computeVertexNormals();
    });
  }
  orgel.update(dt);
  for(const b of birds) b.mixer.update(dt);
  if(guide.visible) ring.material.opacity = .55 + Math.sin(clock*3)*.35;

  renderer.render(scene, camera);
});
</script>
