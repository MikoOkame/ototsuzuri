<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ほしのおんがくかい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff9ec4; --pink-deep:#ff7fb0; --blue:#8cc8ff; --blue-deep:#5fa8ee;
    --panel-bg: rgba(20,16,40,0.55); --panel-border: rgba(255,210,240,0.3);
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    background:#050318;
    font-family:'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  canvas#sky{ position:absolute; top:0; left:0; display:block; }

  #topbar{
    position:fixed; top:0; left:0; right:0;
    padding: max(14px, env(safe-area-inset-top)) 18px 0 18px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:20; pointer-events:none;
  }
  #titleTag{
    color:#fff1cf; font-size:14px; font-weight:700; letter-spacing:0.06em;
    text-shadow: 0 0 12px rgba(255,217,160,0.6), 0 1px 3px rgba(0,0,0,0.6);
  }
  .iconBtn{
    pointer-events:auto;
    background: var(--panel-bg); border:1px solid var(--panel-border);
    backdrop-filter: blur(6px); color:#fff1cf; font-family:inherit;
    font-size:13px; padding:9px 14px; border-radius:999px;
    display:flex; align-items:center; gap:6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .iconBtn:active{ transform:scale(0.95); }

  #nowPlaying{
    position:fixed; top:50%; left:0; right:0; transform:translateY(-58%);
    text-align:center; z-index:10; pointer-events:none; padding:0 24px;
  }
  #npTitle{
    font-size:22px; font-weight:900; color:#fff3d0;
    text-shadow: 0 0 18px rgba(255,214,160,0.7);
  }
  #npSubtitle{ font-size:12.5px; color:rgba(255,240,225,0.7); margin-top:6px; }

  #player{
    position:fixed; left:0; right:0; bottom:0;
    padding: 14px 18px max(18px, env(safe-area-inset-bottom)) 18px;
    z-index:20;
    background: linear-gradient(to top, rgba(8,6,22,0.75), rgba(8,6,22,0));
  }
  #transport{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-bottom:14px;
  }
  .transportBtn{
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
    color:#fff; border-radius:50%; width:44px; height:44px;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .transportBtn:active{ transform:scale(0.92); }
  #playBtn{
    width:60px; height:60px; font-size:22px;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    border:none; box-shadow:0 6px 18px rgba(255,126,176,0.4);
  }
  #volRow{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  #muteBtn{
    background:none; border:none; color:#fff1cf; font-size:17px; flex-shrink:0; padding:4px;
  }
  #volSlider{ flex:1; -webkit-appearance:none; height:4px; border-radius:2px;
    background: rgba(255,255,255,0.2); outline:none; }
  #volSlider::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; box-shadow:0 0 6px rgba(255,255,255,0.6);
  }

  .modalOverlay{
    position:fixed; inset:0; z-index:50;
    background: rgba(6,4,20,0.68); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease; padding:24px;
  }
  .modalOverlay.show{ opacity:1; pointer-events:auto; }
  .modalCard{
    width:100%; max-width:340px;
    background: linear-gradient(160deg, rgba(42,30,70,0.96), rgba(24,16,46,0.96));
    border:1px solid rgba(255,210,240,0.3); border-radius:22px;
    padding:22px 20px; box-shadow:0 20px 60px rgba(0,0,0,0.5); color:#fdeef7;
    transform: scale(0.92) translateY(10px); transition: transform 0.28s cubic-bezier(.2,1.4,.4,1);
  }
  .modalOverlay.show .modalCard{ transform:scale(1) translateY(0); }
  .modalTitle{ font-size:16px; font-weight:700; text-align:center; margin:0 0 14px 0; color:#fff1cf; }
  #trackList{ display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; }
  .trackRow{
    display:flex; align-items:center; gap:12px;
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    border-radius:14px; padding:11px 13px;
  }
  .trackRow.active{ background: rgba(255,158,196,0.2); border-color: rgba(255,158,196,0.45); }
  .trackRow .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .trackRow .info{ flex:1; min-width:0; }
  .trackRow .tTitle{ font-size:13.5px; font-weight:700; color:#fff; }
  .trackRow .tSub{ font-size:10.5px; opacity:0.6; margin-top:2px; }
  .modalCloseBtn{
    width:100%; margin-top:16px; padding:11px 0; border-radius:12px;
    background: rgba(255,255,255,0.08); color:#e9dcf2; border:1px solid rgba(255,255,255,0.15);
    font-family:inherit; font-size:14px; font-weight:700;
  }
  #keyboardWrap{
    margin: 14px auto 0; width: 100%; max-width: 420px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  #keyboardHeader{
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 0.05em;
  }
  #keyboardHeader button{
    background: rgba(255,255,255,0.08); color:#e9dcf2; border:1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  #pianoKeys{
    position: relative; width: 100%; height: 130px;
    display: flex; user-select: none; touch-action: none;
  }
  .whiteKey{
    position: relative; flex: 1; height: 100%;
    background: linear-gradient(to bottom, #fdfaf5, #ece4d8);
    border: 1px solid rgba(0,0,0,0.25); border-radius: 0 0 6px 6px;
    box-sizing: border-box; z-index: 1;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; font-size: 10px; color: rgba(0,0,0,0.35);
  }
  .whiteKey.active{ background: linear-gradient(to bottom, #ffe3b0, #f0c98a); }
  .blackKey{
    position: absolute; top: 0; width: 8.5%; height: 62%;
    background: linear-gradient(to bottom, #2a2a2a, #0c0c0c);
    border: 1px solid #000; border-radius: 0 0 4px 4px;
    z-index: 2; box-sizing: border-box;
  }
  .blackKey.active{ background: linear-gradient(to bottom, #5a4a6a, #3a2a4a); }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div id="topbar">
  <div id="titleTag">✦ ほしのおんがくかい</div>
  <button class="iconBtn" id="listBtn">🎵 曲一覧</button>
</div>

<div id="nowPlaying">
  <div id="npTitle">-</div>
  <div id="npSubtitle">タップして再生</div>
</div>

<div id="player">
  <div id="transport">
    <button class="transportBtn" id="prevBtn">⏮</button>
    <button class="transportBtn" id="playBtn">▶</button>
    <button class="transportBtn" id="nextBtn">⏭</button>
  </div>
  <div id="modeRow" style="display:flex; justify-content:center; margin-top:6px;">
    <button class="iconBtn" id="modeBtn">🔂 1曲</button>
  </div>
  <div id="volRow">
    <button id="muteBtn">🔊</button>
    <input type="range" id="volSlider" min="0" max="100" value="55">
  </div>
  <div id="keyboardWrap">
    <div id="keyboardHeader">
      <button id="octaveDownBtn">◀ 低く</button>
      <span id="octaveLabel">C5〜C6</span>
      <button id="octaveUpBtn">高く ▶</button>
    </div>
    <div id="pianoKeys"></div>
  </div>
</div>

<div class="modalOverlay" id="listModal">
  <div class="modalCard">
    <p class="modalTitle">曲一覧</p>
    <div id="trackList"></div>
    <button class="modalCloseBtn" id="listCloseBtn">とじる</button>
  </div>
</div>

  /* ---------------- 音声合成エンジン ----------------
     ほしつなぎ本編と同じ4種の音色をWeb Audioでその場合成する。
     トラック切り替え時に「前の曲が鳴り続ける」事故を防ぐため、
     生成した全オシレーターをactiveNodesで管理し、切り替え時に確実に停止する。
  ------------------------------------------------------- */
  let audioCtx = null;
  let masterGain = null;
  let masterCompressor = null;
  let reverbConvolver = null;
  let reverbWet = null;
  let muted = false;
  let volume = 0.55;
  let activeNodes = [];       // 現在生成済みの全オシレーター（強制停止用）
  let playGeneration = 0;     // 曲切り替え/停止のたびに変える世代カウンタ
  let bgmLoopTimer = null;
  let loopStartAudioTime = 0;
  let currentTrackIdx = 0;
  let playMode = 'single'; // 'single' | 'all' | 'shuffle'
  const FIXED_ORDER_IDS = ['hajimari00','waltz01','umiwatari01','yamagoe02','arashi03','clear'];
  let isPlaying = false;

  function midiToFreq(m){ return 440 * Math.pow(2, (m-69)/12); }
  function clampNum(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function ensureAudioCtx(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : volume;
      masterCompressor = audioCtx.createDynamicsCompressor();
      masterCompressor.threshold.value = -12;
      masterCompressor.knee.value = 18;
      masterCompressor.ratio.value = 6;
      masterCompressor.attack.value = 0.003;
      masterCompressor.release.value = 0.25;
      masterGain.connect(masterCompressor);
      masterCompressor.connect(audioCtx.destination);
      ensureReverb();
    }
    return audioCtx;
  }

  function buildImpulseResponse(ctx, seconds, decay){
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate*seconds));
    const impulse = ctx.createBuffer(2, length, rate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<length;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1-i/length, decay);
      }
    }
    return impulse;
  }

  function ensureReverb(){
    if(reverbConvolver) return;
    reverbConvolver = audioCtx.createConvolver();
    reverbConvolver.buffer = buildImpulseResponse(audioCtx, 2.8, 2.6);
    reverbWet = audioCtx.createGain();
    reverbWet.gain.value = 0.22; // 既定の深さ。クリア曲はノート側で個別に厚めに送る
    reverbConvolver.connect(reverbWet);
    reverbWet.connect(masterGain);
  }

  // 各シンセの出力ゲインgをリバーブへ送る共通ヘルパー。
  // sendAmountの値ごとにGainNodeを1個だけ生成して使い回す(1音ごとの新規生成をやめ、ノード数を抑える)
  const reverbSends = {};
  function sendToReverb(g, sendAmount){
    if(!reverbConvolver) return;
    const amt = (sendAmount===undefined ? 1.0 : sendAmount);
    const key = String(amt);
    if(!reverbSends[key]){
      const send = audioCtx.createGain();
      send.gain.value = amt;
      send.connect(reverbConvolver);
      reverbSends[key] = send;
    }
    g.connect(reverbSends[key]);
  }

  function trackNode(node){
    activeNodes.push(node);
    // 再生終了後は自動的に配列から除去してメモリ肥大を防ぐ
    node.addEventListener('ended', ()=>{
      const i = activeNodes.indexOf(node);
      if(i !== -1) activeNodes.splice(i,1);
    });
    return node;
  }

  function playMusicBoxNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const osc1 = trackNode(audioCtx.createOscillator());
    osc1.type = 'sine'; osc1.frequency.value = freq;
    const osc2 = trackNode(audioCtx.createOscillator());
    osc2.type = 'sine'; osc2.frequency.value = freq*2.008;

    const peak = clampNum(vel/127,0.05,1) * 0.5;
    const attack = 0.006;
    const release = Math.min(dur*2.4+0.3, 2.0);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime+attack+release);
    const g2 = audioCtx.createGain(); g2.gain.value = 0.25;

    osc1.connect(g); osc2.connect(g2); g2.connect(g); g.connect(masterGain); sendToReverb(g, 0.5);
    const stopAt = startTime+attack+release+0.05;
    osc1.start(startTime); osc1.stop(stopAt);
    osc2.start(startTime); osc2.stop(stopAt);
    osc1.addEventListener('ended', ()=>{ g.disconnect(); g2.disconnect(); });
  }

  function playTriangleNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const osc = trackNode(audioCtx.createOscillator());
    osc.type = 'triangle'; osc.frequency.value = freq;
    const peak = clampNum(vel/127,0.05,1) * 0.22;
    const attack = 0.008;
    const release = Math.min(dur*1.1+0.15, 1.0);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime+attack+release);
    osc.connect(g); g.connect(masterGain); sendToReverb(g, 0.5);
    osc.start(startTime); osc.stop(startTime+attack+release+0.05);
    osc.addEventListener('ended', ()=>{ g.disconnect(); });
  }

  function playPadNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const osc = trackNode(audioCtx.createOscillator());
    osc.type = 'sine'; osc.frequency.value = freq;
    const osc2 = trackNode(audioCtx.createOscillator());
    osc2.type = 'sine'; osc2.frequency.value = freq*1.003;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1400;
    const peak = clampNum(vel/127,0.05,1) * 0.14;
    const attack = Math.min(dur*0.4, 0.9);
    const release = Math.min(dur*0.5, 1.2);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
    g.gain.setValueAtTime(peak, startTime+Math.max(dur-release, attack));
    g.gain.exponentialRampToValueAtTime(0.0001, startTime+dur);
    osc.connect(filter); osc2.connect(filter); filter.connect(g); g.connect(masterGain); sendToReverb(g, 0.5);
    osc.start(startTime); osc.stop(startTime+dur+0.05);
    osc2.start(startTime); osc2.stop(startTime+dur+0.05);
    osc.addEventListener('ended', ()=>{ g.disconnect(); filter.disconnect(); });
  }

  function playBassNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);

    osc.type = 'sine'; osc.frequency.value = freq;

    const g = audioCtx.createGain();

  function playFlueNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);

    osc1.type = 'sine'; osc1.frequency.value = freq;

    osc2.type = 'triangle'; osc2.frequency.value = freq;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.12;
    const lfo = trackNode(audioCtx.createOscillator());
    lfo.type = 'sine'; lfo.frequency.value = 5;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = freq*0.006;
    lfo.connect(lfoGain); lfoGain.connect(osc1.frequency); lfoGain.connect(osc2.frequency);
    const peak = clampNum(vel/127,0.05,1) * 0.28;
    const attack = 0.08;
    const release = Math.min(dur*0.6+0.25, 1.1);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime+attack+release);
    osc1.connect(g); osc2.connect(g2); g2.connect(g); g.connect(masterGain); sendToReverb(g, 0.5);
    const stopAt = startTime+attack+release+0.05;
    osc1.start(startTime); osc1.stop(stopAt);
    osc2.start(startTime); osc2.stop(stopAt);
    lfo.start(startTime); lfo.stop(stopAt);
    osc1.addEventListener('ended', ()=>{ g.disconnect(); g2.disconnect(); });
  }

  function playFeltPianoNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const osc1 = trackNode(audioCtx.createOscillator());
    osc1.type = 'sine'; osc1.frequency.value = freq;

    osc2.type = 'sine'; osc2.frequency.value = freq*2.0;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.08;

    const peak = clampNum(vel/127,0.05,1) * 0.32;

    osc1.connect(filter); osc2.connect(g2); g2.connect(filter); filter.connect(g); g.connect(masterGain); sendToReverb(g, 0.5);

  function playMutedMusicBoxNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const osc1 = trackNode(audioCtx.createOscillator());
    osc1.type = 'sine'; osc1.frequency.value = freq;

    osc2.type = 'sine'; osc2.frequency.value = freq*2.008;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 3800;
    const peak = clampNum(vel/127,0.05,1) * 0.5;

  // ベル/グロッケン: 正弦波の高次倍音を数本重ね、長いリリースで「到達の一撃」を作る
  function playBellNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const partials = [1, 2.01, 3.0, 4.2, 5.4]; // わずかに非整数倍にして金属的な響きを出す
    const partialGains = [0.5, 0.28, 0.16, 0.09, 0.05];
    const peak = clampNum(vel/127,0.05,1) * 0.6;
    const attack = 0.004;
    const release = Math.min(dur*1.8+1.5, 4.0);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime+attack+release);
    const stopAt = startTime+attack+release+0.05;
    for(let i=0;i<partials.length;i++){
      const osc = trackNode(audioCtx.createOscillator());
      osc.type = 'sine';
      osc.frequency.value = freq*partials[i];
      const pg = audioCtx.createGain();
      pg.gain.value = partialGains[i];
      osc.connect(pg); pg.connect(g);
      osc.start(startTime); osc.stop(stopAt);
      if(i===0){ osc.addEventListener('ended', ()=>{ g.disconnect(); }); }
    }
    g.connect(masterGain); sendToReverb(g, 0.85); // 到達点は深めにリバーブへ送る
  }

  // ストリングス: デチューンしたtriangle波3基を重ね、遅いアタックで面の厚みを作る(通奏に耐える柔らかさ)
  function playStringsNote(startTime, midi, dur, vel){
    const freq = midiToFreq(midi);
    const detunes = [-7, 0, 7];
    const gSum = audioCtx.createGain();
    const oscs = [];
    for(const cents of detunes){
      const osc = trackNode(audioCtx.createOscillator());
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.detune.value = cents;
      osc.connect(gSum);
      oscs.push(osc);
    }
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 2400;
    const peak = clampNum(vel/127,0.05,1) * 0.16;
    const attack = Math.min(dur*0.5, 0.7);
    const release = Math.min(dur*0.6+0.3, 1.8);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.linearRampToValueAtTime(peak, startTime+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime+attack+release);
    gSum.connect(filter); filter.connect(g);
    const stopAt = startTime+attack+release+0.05;
    for(const osc of oscs){ osc.start(startTime); osc.stop(stopAt); }
    g.connect(masterGain); sendToReverb(g, 0.6);
    oscs[0].addEventListener('ended', ()=>{ g.disconnect(); gSum.disconnect(); filter.disconnect(); });
  }

  const INSTRUMENTS = {
    musicbox: playMusicBoxNote,
    triangle: playTriangleNote,
    pad: playPadNote,
    bass: playBassNote,
    flue: playFlueNote,
    feltpiano: playFeltPianoNote,
    mutedmusicbox: playMutedMusicBoxNote,
    bell: playBellNote,
    strings: playStringsNote
  };
  const DEFAULT_INSTRUMENTS = { melody:'musicbox', arp:'triangle', pad:'pad', bass:'bass', bell:'bell', strings:'strings' };

  function stopAllAudio(){
    playGeneration++; // 予約済みの次ループタイマーを無効化
    if(bgmLoopTimer){ clearTimeout(bgmLoopTimer); bgmLoopTimer = null; }
    if(audioCtx && masterGain){
      const now = audioCtx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      // 40msでゼロへフェード。波形の途中で瞬断すると「ブツッ」というクリックノイズになるため
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
    }
    const stopTime = audioCtx ? audioCtx.currentTime + 0.045 : 0;
    for(const node of activeNodes){
      try{ node.stop(stopTime); }catch(e){ /* 既に停止済みなら無視 */ }
    }
    activeNodes = [];
    isPlaying = false;
    updatePlayBtn();
  }

  // ---- 先読みスケジューラ ----
  // 曲の全ノートを一度に予約すると(数百〜千ノード)低スペック機でオーディオスレッドが詰まり、
  // 音割れ・停止に至る。25ms間隔で起き、これから200ms以内に鳴る音だけを予約する
  // "A Tale of Two Clocks"方式に変更。同時に存在するノードを常に数個〜十数個に抑える。
  const LOOKAHEAD_INTERVAL_MS = 25;
  const SCHEDULE_AHEAD_SEC = 0.2;

  function scheduleTrackLoop(track, startTime, gen){
    const insts = Object.assign({}, DEFAULT_INSTRUMENTS, track.instruments || {});
    const parts = ['melody','arp','pad','bass','bell','strings'];

    // 全パートのイベントを「曲頭からの絶対秒」でフラットな1本のリストにまとめ、時刻順にソートする
    const flat = [];
    for(const part of parts){
      const events = track[part];
      if(!events || events.length===0) continue;
      const fn = INSTRUMENTS[insts[part]] || INSTRUMENTS[DEFAULT_INSTRUMENTS[part]];
      for(const [t,midi,dur,vel] of events){
        flat.push({ t, midi, dur, vel, fn });
      }
    }
    flat.sort((a,b)=> a.t - b.t);

    let cursor = 0;       // flat内で次に予約すべきインデックス
    let loopCount = 0;    // このtrackで何周目か(絶対時刻計算用)
    let curLoopStart = startTime;

    function tick(){
      if(gen !== playGeneration) return; // 別の曲/停止に切り替わっていたら打ち切り

      const now = audioCtx.currentTime;
      const scheduleUntil = now + SCHEDULE_AHEAD_SEC;

      // タブ復帰などでnowが現ループの終端をとっくに過ぎている場合、
      // 経過ループ数をまとめて進めて二重発火(重ね鳴り)を防ぐ
      while(now > curLoopStart + track.loopSec){
        curLoopStart += track.loopSec;
        loopCount++;
        cursor = 0;
      }
      // 全曲連続/シャッフルモードでは1周のみで終わり、次曲へ進める。
      // (以前はここで無条件returnしており、次のtick予約もadvanceTrackも呼ばれず
      //  音が無音のまま永久に固まるバグがあった)
      if(playMode !== 'single' && loopCount > 0){
        advanceTrack();
        return;
      }

      while(cursor < flat.length && curLoopStart + flat[cursor].t <= scheduleUntil){
        const ev = flat[cursor];
        ev.fn(curLoopStart + ev.t, ev.midi, ev.dur, ev.vel);
        cursor++;
      }

      if(cursor >= flat.length){
        // このループの全ノート予約完了。次周へ回すか、曲送りするかを
        // 「曲の終端に到達したタイミング」で判定する
        const loopEndTime = curLoopStart + track.loopSec;
        if(now >= loopEndTime - LOOKAHEAD_INTERVAL_MS/1000){
          if(playMode === 'single'){
            curLoopStart += track.loopSec;
            loopCount++;
            cursor = 0;
          } else {
            bgmLoopTimer = setTimeout(()=>{
              if(gen !== playGeneration) return;
              advanceTrack();
            }, Math.max((loopEndTime - now) * 1000, 0));
            return;
          }
        }
      }

      bgmLoopTimer = setTimeout(tick, LOOKAHEAD_INTERVAL_MS);
    }

    tick();
  }

  function advanceTrack(){
    let nextIdx;
    if(playMode === 'shuffle'){
      if(TRACKS.length <= 1){
        nextIdx = currentTrackIdx;
      } else {
        do { nextIdx = Math.floor(Math.random()*TRACKS.length); } while(nextIdx === currentTrackIdx);
      }
    } else { // 'all' : 物語順(はじまり→ワルツ→うみわたり→やまごえ→あらし→クリア)で巡回
      const order = FIXED_ORDER_IDS.map(id => TRACKS.findIndex(t=>t.id===id)).filter(i=>i>=0);
      const pos = order.indexOf(currentTrackIdx);
      nextIdx = order[(pos+1) % order.length];
    }
    playTrack(nextIdx, 0.8); // 自動切り替えは0.8秒の間を挟み、前曲の余韻を切らずに区切る
  }

  function cyclePlayMode(){
    playMode = playMode==='single' ? 'all' : (playMode==='all' ? 'shuffle' : 'single');
    updateModeBtn();
  }

  function updateModeBtn(){
    if(!modeBtn) return;
    const labels = { single:'🔂 1曲', all:'🔁 全曲', shuffle:'🔀 シャッフル' };
    modeBtn.textContent = labels[playMode];
  }

  function playTrack(idx, gapSec){
    if(gapSec === undefined) gapSec = 0.12; // 既定: 手動切り替え時の短い間
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    stopAllAudio(); // 前の曲を確実に(フェードアウトしながら)止めてから切り替える
    currentTrackIdx = idx;
    const track = TRACKS[idx];
    const gen = playGeneration;
    loopStartAudioTime = ctx.currentTime + gapSec;
    // masterGainを0から目標音量へフェードイン(ギャップの間に静かに立ち上がる)
    const targetVol = muted ? 0 : volume;
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(targetVol, loopStartAudioTime + 0.05);
    scheduleTrackLoop(track, loopStartAudioTime, gen);
    isPlaying = true;
    updateNowPlaying();
    updatePlayBtn();
    renderTrackList();
  }

  function togglePlay(){
    if(isPlaying){
      stopAllAudio();
    }else{
      playTrack(currentTrackIdx);
    }
  }

  function nextTrack(){ playTrack((currentTrackIdx+1) % TRACKS.length); }
  function prevTrack(){ playTrack((currentTrackIdx-1+TRACKS.length) % TRACKS.length); }

  function setVolume(v){
    volume = v;
    if(masterGain) masterGain.gain.value = muted ? 0 : volume;
  }
  function setMuted(m){
    muted = m;
    if(masterGain) masterGain.gain.value = muted ? 0 : volume;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }

  /* ---------------- UI ---------------- */
  const npTitle = document.getElementById('npTitle');
  const npSubtitle = document.getElementById('npSubtitle');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const muteBtn = document.getElementById('muteBtn');
  const modeBtn = document.getElementById('modeBtn');
  const volSlider = document.getElementById('volSlider');
  const listBtn = document.getElementById('listBtn');
  const listModal = document.getElementById('listModal');
  const listCloseBtn = document.getElementById('listCloseBtn');
  const trackList = document.getElementById('trackList');

  function updateNowPlaying(){
    const track = TRACKS[currentTrackIdx];
    npTitle.textContent = track.title;
    npSubtitle.textContent = track.subtitle || '';
  }
  function updatePlayBtn(){
    playBtn.textContent = isPlaying ? '⏸' : '▶';
  }
  function renderTrackList(){
    trackList.innerHTML = '';
    TRACKS.forEach((track, i) => {
      const row = document.createElement('div');
      row.className = 'trackRow' + (i===currentTrackIdx ? ' active' : '');
      row.innerHTML = `
        <div class="dot" style="background:${track.color || '#ffd9a0'}"></div>
        <div class="info">
          <div class="tTitle">${escapeHtml(track.title)}</div>
          <div class="tSub">${escapeHtml(track.subtitle||'')} ・ ${Math.round(track.loopSec)}秒ループ</div>
        </div>`;
      row.addEventListener('click', ()=>{
        playTrack(i);
        listModal.classList.remove('show');
      });
      trackList.appendChild(row);
    });
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  playBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', prevTrack);
  nextBtn.addEventListener('click', nextTrack);
  muteBtn.addEventListener('click', ()=> setMuted(!muted));
  volSlider.addEventListener('input', (e)=> setVolume(e.target.value/100));
  listBtn.addEventListener('click', ()=>{ renderTrackList(); listModal.classList.add('show'); });
  modeBtn.addEventListener('click', cyclePlayMode);
  updateModeBtn();

  // タブが非アクティブから復帰した際、AudioContextがsuspendされていれば再開する。
  // (二重発火自体はscheduleTrackLoop側の時刻補正で防止済み、これは無音化の保険)
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && audioCtx && audioCtx.state === 'suspended' && isPlaying){
      audioCtx.resume();
    }
  });
  listCloseBtn.addEventListener('click', ()=> listModal.classList.remove('show'));

  // ---- 鍵盤 ----
  // 13鍵(C〜C、1オクターブ+主音)。白鍵7・黒鍵5。オクターブ切替でC3〜C7まで移動できる。
  const pianoKeys = document.getElementById('pianoKeys');
  const octaveLabel = document.getElementById('octaveLabel');
  const octaveDownBtn = document.getElementById('octaveDownBtn');
  const octaveUpBtn = document.getElementById('octaveUpBtn');

  let keyboardOctaveBase = 72; // C5 (MIDI 72)。ここから1オクターブ(0〜12半音)を鍵盤に敷く
  const MIN_OCTAVE_BASE = 36;  // C2
  const MAX_OCTAVE_BASE = 96;  // C7

  // 白鍵はC,D,E,F,G,A,B(半音オフセット 0,2,4,5,7,9,11) + オクターブ上のC
  const WHITE_OFFSETS = [0,2,4,5,7,9,11,12];
  // 黒鍵は白鍵の隙間にのみ存在(E-F, B-Cの間はない)。位置は「何番目の白鍵の右端寄り」かで指定
  // { offset: 半音オフセット, afterWhiteIndex: 直前の白鍵のインデックス(0始まり) }
  const BLACK_KEYS = [
    { offset: 1,  afterWhiteIndex: 0 }, // C#
    { offset: 3,  afterWhiteIndex: 1 }, // D#
    { offset: 6,  afterWhiteIndex: 3 }, // F#
    { offset: 8,  afterWhiteIndex: 4 }, // G#
    { offset: 10, afterWhiteIndex: 5 }, // A#
  ];

  // PCキーボード割り当て: 白鍵はASDFGHJ(+最後のCはK)、黒鍵はWETYU
  const WHITE_KEY_CODES = ['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK'];
  const BLACK_KEY_CODES = ['KeyW','KeyE','KeyT','KeyY','KeyU'];

  const activeKeyEls = {}; // midiノート番号 -> DOM要素(押下中のハイライト管理用)

  function currentMelodyInstrument(){
    if(!isPlaying) return DEFAULT_INSTRUMENTS.melody;
    const track = TRACKS[currentTrackIdx];
    if(!track) return DEFAULT_INSTRUMENTS.melody;
    const insts = Object.assign({}, DEFAULT_INSTRUMENTS, track.instruments || {});
    return insts.melody;
  }

  function playKeyNote(midi){
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    const instName = currentMelodyInstrument();
    const fn = INSTRUMENTS[instName] || INSTRUMENTS[DEFAULT_INSTRUMENTS.melody];
    fn(ctx.currentTime, midi, 0.6, 78);
  }

  function highlightKey(midi, on){
    const el = activeKeyEls[midi];
    if(el) el.classList.toggle('active', on);
  }

  function renderPianoKeys(){
    pianoKeys.innerHTML = '';
    for(const k in activeKeyEls) delete activeKeyEls[k];

    // 白鍵を先に敷く(flexで等分)
    const whiteEls = [];
    WHITE_OFFSETS.forEach((offset)=>{
      const midi = keyboardOctaveBase + offset;
      const el = document.createElement('div');
      el.className = 'whiteKey';
      el.dataset.midi = midi;
      pianoKeys.appendChild(el);
      whiteEls.push(el);
      activeKeyEls[midi] = el;
    });

    // 白鍵のレイアウト確定後、黒鍵を絶対配置で重ねる
    requestAnimationFrame(()=>{
      const totalWidth = pianoKeys.clientWidth;
      const whiteCount = WHITE_OFFSETS.length;
      const whiteW = totalWidth / whiteCount;
      BLACK_KEYS.forEach(({offset, afterWhiteIndex})=>{
        const midi = keyboardOctaveBase + offset;
        const el = document.createElement('div');
        el.className = 'blackKey';
        el.dataset.midi = midi;
        // 白鍵の境界線を中心に、黒鍵幅(全体の8.5%)の半分だけ左へずらして配置
        el.style.left = (whiteW * (afterWhiteIndex + 1) - (totalWidth*0.085)/2) + 'px';
        pianoKeys.appendChild(el);
        activeKeyEls[midi] = el;
      });
    });

    updateOctaveLabel();
  }

  function updateOctaveLabel(){
    const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const lowOct = Math.floor(keyboardOctaveBase/12) - 1;
    const highOct = Math.floor((keyboardOctaveBase+12)/12) - 1;
    octaveLabel.textContent = `C${lowOct}〜C${highOct}`;
  }

  function shiftOctave(delta){
    const next = keyboardOctaveBase + delta*12;
    if(next < MIN_OCTAVE_BASE || next > MAX_OCTAVE_BASE) return;
    keyboardOctaveBase = next;
    renderPianoKeys();
  }

  octaveDownBtn.addEventListener('click', ()=> shiftOctave(-1));
  octaveUpBtn.addEventListener('click', ()=> shiftOctave(1));

  // タップ/クリック/マウスドラッグでの演奏(スライド演奏は今回は非対応。押した瞬間だけ発音)
  pianoKeys.addEventListener('pointerdown', (e)=>{
    const target = e.target.closest('.whiteKey, .blackKey');
    if(!target) return;
    const midi = Number(target.dataset.midi);
    playKeyNote(midi);
    highlightKey(midi, true);
    setTimeout(()=> highlightKey(midi, false), 150);
  });

  // PCキーボード演奏。押しっぱなしでの連打を防ぐためkeydownの繰り返し(repeat)は無視する
  const pressedKeyCodes = new Set();
  document.addEventListener('keydown', (e)=>{
    if(e.repeat) return;
    if(pressedKeyCodes.has(e.code)) return;
    const wi = WHITE_KEY_CODES.indexOf(e.code);
    const bi = BLACK_KEY_CODES.indexOf(e.code);
    let midi = null;
    if(wi !== -1) midi = keyboardOctaveBase + WHITE_OFFSETS[wi];
    else if(bi !== -1) midi = keyboardOctaveBase + BLACK_KEYS[bi].offset;
    if(midi === null) return;
    pressedKeyCodes.add(e.code);
    playKeyNote(midi);
    highlightKey(midi, true);
  });
  document.addEventListener('keyup', (e)=>{
    pressedKeyCodes.delete(e.code);
    const wi = WHITE_KEY_CODES.indexOf(e.code);
    const bi = BLACK_KEY_CODES.indexOf(e.code);
    let midi = null;
    if(wi !== -1) midi = keyboardOctaveBase + WHITE_OFFSETS[wi];
    else if(bi !== -1) midi = keyboardOctaveBase + BLACK_KEYS[bi].offset;
    if(midi !== null) highlightKey(midi, false);
  });

  renderPianoKeys();
  window.addEventListener('resize', renderPianoKeys);

  setVolume(volSlider.value/100);
  updateNowPlaying();

  /* ============================================================
     ★★★ レイチェル素材 差し替えガイド ★★★
     raychell_sideA.png を base64 化して ASSETS_B64.sideA に入れれば、
     プレースホルダーの代わりに画像が表示される（ほしつなぎ本編と同じ方式）。
     ============================================================ */
  const ASSETS_B64 = { sideA: '' };
  const IMGS = {};
  for(const key in ASSETS_B64){
    const img = new Image();
    IMGS[key] = { img, ok:false };
    img.onload = ()=>{ IMGS[key].ok = true; };
    img.onerror = ()=>{ IMGS[key].ok = false; };
    if(ASSETS_B64[key]) img.src = 'data:image/png;base64,' + ASSETS_B64[key];
  }

  /* ---------------- 背景（簡易版：グラデ＋瞬く小さな星のみ） ---------------- */
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  let bgStars = [];

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function setupStars(){
    bgStars = [];
    const count = Math.floor((W*H)/1800);
    for(let i=0;i<count;i++){
      bgStars.push({
        x: rand(0,W), y: rand(0,H*0.9),
        r: rand(0.4,1.3),
        phase: rand(0,Math.PI*2),
        speed: rand(0.4,1.2),
        baseAlpha: rand(0.4,0.9)
      });
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    setupStars();
  }
  window.addEventListener('resize', resize);

  /* ---------------- ビジュアライザ ----------------
     再生中の音符に合わせて星がポワッと光る。FFT等は使わず、
     「今、audioCtxの現在時刻がどのノートの発音区間に入っているか」を
     ループ内時刻で判定するだけの軽量な仕組み。
  ------------------------------------------------------- */
  const PART_COLORS = {
    melody: 'rgba(255,240,200,ALPHA)',
    arp:    'rgba(160,220,255,ALPHA)',
    pad:    'rgba(200,170,255,ALPHA)',
    bass:   'rgba(255,170,190,ALPHA)'
  };

  function drawVisualizer(){
    if(!isPlaying || !audioCtx) return;
    const track = TRACKS[currentTrackIdx];
    const elapsed = ((audioCtx.currentTime - loopStartAudioTime) % track.loopSec + track.loopSec) % track.loopSec;

    for(const part of ['pad','arp','bass','melody']){
      const events = track[part];
      if(!events) continue;
      for(const [t,midi,dur,vel] of events){
        if(elapsed < t || elapsed > t+dur) continue;
        const prog = (elapsed - t) / dur; // 0→1
        const env = Math.sin(Math.PI * clamp(prog,0,1)) ; // 立ち上がって減衰
        const px = (t / track.loopSec) * W;
        const py = H*0.62 - clamp((midi-48)/48, 0, 1) * H*0.42;
        const size = 6 + env*16 + (vel/127)*10;
        ctx.globalAlpha = 0.15 + env*0.5;
        ctx.fillStyle = PART_COLORS[part].replace('ALPHA', String(0.5+env*0.4));
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- レイチェル（簡易プレースホルダー） ---------------- */
  function drawRaychell(t){
    const cx = W - 70, cy = H*0.78 + Math.sin(t*1.1)*4;
    if(IMGS.sideA.ok){
      const iw = 150, ih = iw*(IMGS.sideA.img.height/IMGS.sideA.img.width);
      ctx.drawImage(IMGS.sideA.img, cx-iw/2, cy-ih+10, iw, ih);
      return;
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(253,243,228,0.9)';
    ctx.beginPath(); ctx.ellipse(0,-20,38,46,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-28,-58); ctx.lineTo(-38,-92); ctx.lineTo(-10,-64); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20,-60); ctx.lineTo(38,-94); ctx.lineTo(34,-58); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(-4,-70,30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,158,196,0.85)';
    ctx.beginPath(); ctx.arc(-4,-34,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ---------------- メインループ ---------------- */
  let clock = 0, lastT = performance.now();
  function frame(now){
    const dt = Math.min((now-lastT)/1000, 0.05);
    lastT = now; clock += dt;

    const track = TRACKS[currentTrackIdx];
    const themeRgb = hexToRgb(track.color || '#8892c8');
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#050318');
    g.addColorStop(0.55, `rgba(${themeRgb.r*0.18|0},${themeRgb.g*0.18|0},${themeRgb.b*0.25|0},1)`);
    g.addColorStop(1, `rgba(${themeRgb.r*0.3|0},${themeRgb.g*0.26|0},${themeRgb.b*0.32|0},1)`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    for(const s of bgStars){
      const tw = 0.6 + 0.4*Math.sin(clock*s.speed + s.phase);
      ctx.globalAlpha = clamp(s.baseAlpha*tw, 0, 1);
      ctx.fillStyle = '#fdf7ec';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawVisualizer();
    drawRaychell(clock);

    requestAnimationFrame(frame);
  }
  function hexToRgb(hex){
    const n = parseInt(hex.slice(1),16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }

  resize();
  requestAnimationFrame(frame);

})();
