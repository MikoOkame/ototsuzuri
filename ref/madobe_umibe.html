<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>窓辺の風景｜海辺の町</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#141238; --ink:#fff4dc; --ink-dim:rgba(255,244,220,.7);
    --panel:rgba(30,24,58,.5); --line:rgba(255,228,196,.28);
    --accent:#ffd494; --accent-ink:#3a2a30;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141238; --ink:#fff4dc; --panel:rgba(30,24,58,.5); }
  }
  :root[data-theme="dark"]{ --bg:#141238; --ink:#fff4dc; --panel:rgba(30,24,58,.5); }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #c{ position:fixed; top:0; left:0; width:100%; height:100%; display:block; }
  #paper{
    position:fixed; inset:0; pointer-events:none; opacity:.32; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .52  0 0 0 0 .47  0 0 0 0 .44  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(18,12,38,.42) 100%);
  }
  #tag{ position:fixed; top:0; left:0; padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0; pointer-events:none; }
  #tag h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:.1em; text-shadow:0 1px 10px rgba(20,10,40,.5); }
  #tag p{ margin:4px 0 0; font-size:12px; color:var(--ink-dim); letter-spacing:.06em; }
  #spotBtn{
    position:fixed; top:0; right:16px; margin-top:calc(14px + env(safe-area-inset-top,0px));
    font:500 12.5px/1 inherit; font-family:inherit; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 14px;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer;
  }
  #spotBtn[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  #modesWrap{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); pointer-events:none;
  }
  #modes{
    display:flex; gap:2px; padding:4px; border-radius:999px; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  #modes button{
    font-family:inherit; font-size:14px; font-weight:500; color:var(--ink);
    background:transparent; border:0; border-radius:999px; padding:9px 18px; cursor:pointer;
    transition:background .3s, color .3s;
  }
  #modes button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #hint{
    position:fixed; left:0; right:0; bottom:calc(78px + env(safe-area-inset-bottom,0px));
    margin:0; text-align:center; font-size:12px; color:var(--ink-dim); letter-spacing:.08em;
    pointer-events:none; transition:opacity 1.2s;
  }
</style>
</head>
<body>
<canvas id="c" aria-label="海辺の町を見下ろす窓辺の3D風景"></canvas>
<div id="paper"></div>
<div id="vignette"></div>

<header id="tag">
  <h1>窓辺の風景</h1>
  <p>海辺の町　試作</p>
</header>
<button id="spotBtn" aria-pressed="false">オルゴールの置き場所</button>
<p id="hint">ドラッグで見まわす</p>
<div id="modesWrap">
  <div id="modes" role="group" aria-label="時間帯">
    <button data-mode="dusk" aria-pressed="false">夕暮れ</button>
    <button data-mode="night" aria-pressed="true">夜</button>
    <button data-mode="dawn" aria-pressed="false">夜明け</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reduceMotion ? 0.25 : 1;

/* ---------- 乱数（毎回同じ町並みになるよう固定シード） ---------- */
let seed = 20260924;
function rnd(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function pick(a){ return a[Math.floor(rnd()*a.length)]; }

/* ---------- レンダラ ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x34325f, 40, 300);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 1400);

/* ---------- トゥーン用の3段階グラデーション ---------- */
const gradMap = new THREE.DataTexture(new Uint8Array([
  95,95,95,255, 175,175,175,255, 255,255,255,255
]), 3, 1, THREE.RGBAFormat);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;
gradMap.generateMipmaps = false;
gradMap.needsUpdate = true;

function toon(color, extra){
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap:gradMap }, extra || {}));
}
/* 室内の素材：時間帯ごとの明るさを色に掛けて、部屋を暗く沈める */
const interior = [];
function inToon(color, near, extra){
  const m = toon(color, extra);
  interior.push({ m, base:new THREE.Color(color), near:!!near });
  return m;
}

/* ---------- 輪郭線（反転ハル。体色に近い暗色で描く） ---------- */
const OUT_IN  = 0x4a3446;   // 室内：温かい焦げ茶
const OUT_EX  = 0x2c2749;   // 屋外：夜の藍
const outlineMats = {};
function outlineMat(col){
  if(!outlineMats[col]) outlineMats[col] = new THREE.MeshBasicMaterial({ color:col, side:THREE.BackSide });
  return outlineMats[col];
}
function addOutline(mesh, t, col){
  const g = mesh.geometry;
  if(!g.boundingBox) g.computeBoundingBox();
  const s = new THREE.Vector3(); g.boundingBox.getSize(s);
  const o = new THREE.Mesh(g, outlineMat(col));
  o.scale.set(
    s.x > 1e-4 ? (s.x + 2*t)/s.x : 1,
    s.y > 1e-4 ? (s.y + 2*t)/s.y : 1,
    s.z > 1e-4 ? (s.z + 2*t)/s.z : 1
  );
  mesh.add(o);
  return o;
}
function box(w,h,d,mat,x,y,z,parent,outline,oc){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  (parent || scene).add(m);
  if(outline) addOutline(m, outline, oc || OUT_IN);
  return m;
}

/* ---------- キャンバス製テクスチャ ---------- */
function canvasTex(size, draw, h){
  const c = document.createElement('canvas');
  c.width = size; c.height = h || size;
  draw(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  return t;
}
const glowTex = canvasTex(64, (g,w)=>{
  const r = g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);
  r.addColorStop(0,'rgba(255,255,255,1)');
  r.addColorStop(.25,'rgba(255,255,255,.55)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0,0,w,w);
});
const orbTex = canvasTex(256, (g,w)=>{
  const c = w/2;
  const halo = g.createRadialGradient(c,c,30,c,c,c);
  halo.addColorStop(0,'rgba(255,255,255,.55)');
  halo.addColorStop(.35,'rgba(255,255,255,.14)');
  halo.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = halo; g.fillRect(0,0,w,w);
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(c,c,34,0,Math.PI*2); g.fill();
  g.fillStyle = 'rgba(120,110,150,.13)';
  [[-10,-8,9],[12,6,7],[-4,14,5],[10,-14,4]].forEach(([x,y,r])=>{
    g.beginPath(); g.arc(c+x,c+y,r,0,Math.PI*2); g.fill();
  });
});
const doilyTex = canvasTex(256, (g,w)=>{
  const c = w/2;
  g.fillStyle = '#fbf3e6';
  g.beginPath();
  for(let i=0;i<=240;i++){
    const a = i/240*Math.PI*2;
    const r = 118 + Math.sin(a*24)*7;
    const x = c + Math.cos(a)*r, y = c + Math.sin(a)*r;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.fill();
  g.globalCompositeOperation = 'destination-out';
  for(let ring=0; ring<3; ring++){
    const rr = 44 + ring*26, n = 12 + ring*8, size = 5 + ring*1.2;
    for(let i=0;i<n;i++){
      const a = i/n*Math.PI*2 + ring*.2;
      g.beginPath(); g.arc(c+Math.cos(a)*rr, c+Math.sin(a)*rr, size, 0, Math.PI*2); g.fill();
    }
  }
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(190,160,140,.5)'; g.lineWidth = 2;
  g.beginPath(); g.arc(c,c,30,0,Math.PI*2); g.stroke();
});

/* ---------- 時間帯パレット ---------- */
const PAL_SRC = {
  night:{
    skyTop:'#0e0c2e', skyMid:'#2b2a63', skyBot:'#5b5287', fog:'#4a4579',
    seaDeep:'#111b44', seaNear:'#28356d', orb:'#fff0c6', orbDir:[-0.09,0.2,-1], orbSize:26, glow:.7,
    stars:1, hemiSky:'#6b70b2', hemiGround:'#2b2442', hemiInt:.8, dirCol:'#b7c3ff', dirInt:.5,
    room:0, inFar:'#34324f', inNear:'#5d5b84', lit:.62, lamps:1, beam:.18, ground:'#4d4b7a', cloud:'#5d5b94', cloudOp:.55,
    island:'#3b3a69', glass:'#2e2d55'
  },
  dusk:{
    skyTop:'#6a6eae', skyMid:'#e5a7a2', skyBot:'#ffd3a2', fog:'#efbba1',
    seaDeep:'#4d6098', seaNear:'#c3919e', orb:'#ffcf90', orbDir:[-0.06,0.08,-1], orbSize:40, glow:1,
    stars:.1, hemiSky:'#f2c4b5', hemiGround:'#6b5b7b', hemiInt:1, dirCol:'#ffc79f', dirInt:.8,
    room:.3, inFar:'#8a737e', inNear:'#c4a7a4', lit:.22, lamps:.35, beam:.04, ground:'#8e80a1', cloud:'#f4baae', cloudOp:.85,
    island:'#8c7ba7', glass:'#caa0a8'
  },
  dawn:{
    skyTop:'#89a0d4', skyMid:'#d8c7e3', skyBot:'#f6dfc9', fog:'#e4d5da',
    seaDeep:'#5c78b0', seaNear:'#b8c3df', orb:'#fff4dc', orbDir:[0.1,0.07,-1], orbSize:32, glow:.7,
    stars:.22, hemiSky:'#dfe3f5', hemiGround:'#7e7b99', hemiInt:1.05, dirCol:'#ffe6cf', dirInt:.7,
    room:0, inFar:'#6c6983', inNear:'#a7a5bf', lit:.07, lamps:.14, beam:0, ground:'#9b98b9', cloud:'#f3e4ec', cloudOp:.8,
    island:'#9c9dc3', glass:'#aab4d6'
  }
};
function toPal(src){
  const p = {};
  for(const k in src){
    const v = src[k];
    if(typeof v === 'string') p[k] = new THREE.Color(v);
    else if(Array.isArray(v)) p[k] = new THREE.Vector3(v[0],v[1],v[2]).normalize();
    else p[k] = v;
  }
  return p;
}
const PAL = { night:toPal(PAL_SRC.night), dusk:toPal(PAL_SRC.dusk), dawn:toPal(PAL_SRC.dawn) };
function clonePal(p){
  const o = {};
  for(const k in p) o[k] = (p[k] && p[k].clone) ? p[k].clone() : p[k];
  return o;
}
const cur = clonePal(PAL.night);

/* ---------- 光源 ---------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1);
scene.add(hemi);
const sunMoon = new THREE.DirectionalLight(0xffffff, .5);
scene.add(sunMoon);
const roomLight = new THREE.PointLight(0xffc88a, 1.3, 14, 1.4);
roomLight.position.set(2.2, 3.4, 2.6);
scene.add(roomLight);

/* ---------- 空 ---------- */
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{
    uTop:{value:new THREE.Color()}, uMid:{value:new THREE.Color()}, uBot:{value:new THREE.Color()},
    uOrb:{value:new THREE.Color()}, uOrbDir:{value:new THREE.Vector3(0,.3,-1)}, uGlow:{value:1}
  },
  vertexShader:`
    varying vec3 vDir;
    void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`
    uniform vec3 uTop,uMid,uBot,uOrb,uOrbDir; uniform float uGlow;
    varying vec3 vDir;
    void main(){
      float h = vDir.y;
      vec3 col = mix(uBot, uMid, smoothstep(-.02,.16,h));
      col = mix(col, uTop, smoothstep(.12,.62,h));
      float g = max(dot(normalize(vDir), normalize(uOrbDir)), 0.);
      col += uOrb * (pow(g,28.)*.55 + pow(g,5.)*.18) * uGlow;
      gl_FragColor = vec4(col,1.);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat);
sky.renderOrder = -2;
scene.add(sky);

/* 星 */
const STAR_N = 750;
const starPos = new Float32Array(STAR_N*3), starSeed = new Float32Array(STAR_N), starSize = new Float32Array(STAR_N);
for(let i=0;i<STAR_N;i++){
  const u = rnd()*Math.PI*2, v = 0.03 + Math.pow(rnd(), .8)*0.97;
  const y = v, r = Math.sqrt(1-y*y);
  starPos[i*3] = Math.cos(u)*r*460; starPos[i*3+1] = y*460; starPos[i*3+2] = Math.sin(u)*r*460;
  starSeed[i] = rnd();
  starSize[i] = rnd() < .08 ? 5.5 + rnd()*3 : 1.6 + rnd()*2;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
starGeo.setAttribute('aSeed', new THREE.BufferAttribute(starSeed,1));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize,1));
const starMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, fog:false,
  uniforms:{ uTime:{value:0}, uOpacity:{value:1}, uDpr:{value:DPR} },
  vertexShader:`
    attribute float aSeed; attribute float aSize;
    uniform float uTime, uDpr; varying float vA;
    void main(){
      vec4 mv = modelViewMatrix*vec4(position,1.);
      gl_Position = projectionMatrix*mv;
      float tw = .55 + .45*sin(uTime*(.5+aSeed*1.5) + aSeed*40.);
      vA = tw;
      gl_PointSize = aSize*(.75+.4*tw)*uDpr;
    }`,
  fragmentShader:`
    uniform float uOpacity; varying float vA;
    void main(){
      vec2 c = gl_PointCoord - .5;
      float d = length(c);
      float core = smoothstep(.5, 0., d); core *= core;
      float cr = max(0.,1.-abs(c.x)*9.)*max(0.,1.-abs(c.y)*2.2) + max(0.,1.-abs(c.y)*9.)*max(0.,1.-abs(c.x)*2.2);
      float a = max(core, cr*.7) * vA * uOpacity;
      gl_FragColor = vec4(1.,.96,.88, a);
    }`
});
const stars = new THREE.Points(starGeo, starMat);
stars.renderOrder = -1;
scene.add(stars);

/* 月（夕暮れでは太陽） */
const orbMat = new THREE.SpriteMaterial({ map:orbTex, fog:false, depthWrite:false, transparent:true });
const orb = new THREE.Sprite(orbMat);
orb.renderOrder = -1;
scene.add(orb);

/* 雲 */
const clouds = [];
const cloudGeo = new THREE.PlaneGeometry(1, 1);
for(let i=0;i<8;i++){
  const m = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, fog:false,
    uniforms:{ uCol:{value:new THREE.Color()}, uOp:{value:.6}, uSeed:{value:rnd()*10} },
    vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`
      uniform vec3 uCol; uniform float uOp, uSeed; varying vec2 vUv;
      float blob(vec2 p, vec2 c, vec2 r){ vec2 d = (p - c)/r; return 1. - dot(d,d); }
      void main(){
        vec2 p = vUv;
        float f = -1.;
        for(int k=0; k<6; k++){
          float fk = float(k);
          vec2 c = vec2(.16 + fk*.135, .42 + .1*sin(uSeed*1.7 + fk*2.3));
          vec2 r = vec2(.13 + .05*sin(uSeed + fk*1.3), .2 + .1*cos(uSeed*.7 + fk*1.9));
          f = max(f, blob(p, c, r));
        }
        f *= smoothstep(.2, .34, p.y);
        float a = smoothstep(0., .06, f) * uOp;
        float lit = step(.5, p.y + f*.25);
        vec3 col = mix(uCol*.9, uCol*1.1, lit);
        if(a < .01) discard;
        gl_FragColor = vec4(col, a);
      }`
  });
  const c = new THREE.Mesh(cloudGeo, m);
  const sc = 55 + rnd()*45;
  c.scale.set(sc, sc*.45, 1);
  c.position.set(-240 + i*64 + rnd()*30, 18 + rnd()*40, -270 - rnd()*50);
  c.userData.speed = .6 + rnd()*.8;
  scene.add(c); clouds.push(c);
}

/* ---------- 海 ---------- */
const SEA_Y = -6;
const seaMat = new THREE.ShaderMaterial({
  fog:false,
  uniforms:{
    uTime:{value:0}, uCam:{value:new THREE.Vector3()},
    uDeep:{value:new THREE.Color()}, uNear:{value:new THREE.Color()},
    uOrb:{value:new THREE.Color()}, uFog:{value:new THREE.Color()},
    uOrbDir:{value:new THREE.Vector3()}, uGlow:{value:1}
  },
  vertexShader:`
    varying vec3 vW;
    void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`
    uniform float uTime, uGlow; uniform vec3 uCam,uDeep,uNear,uOrb,uFog,uOrbDir;
    varying vec3 vW;
    void main(){
      vec3 V = normalize(vW - uCam);
      float dist = length(vW.xz - uCam.xz);
      vec3 col = mix(uNear, uDeep, smoothstep(10., 150., dist));
      float t = uTime;
      vec3 n = normalize(vec3(
        sin(vW.x*.23 + t*.6)*.05 + sin(vW.x*.9 - vW.z*.4 + t*1.1)*.025,
        1.,
        sin(vW.z*.31 - t*.7)*.07 + cos(vW.x*.5 + vW.z*.7 + t*.9)*.03));
      vec3 R = reflect(V, n);
      float s = max(dot(R, normalize(uOrbDir)), 0.);
      float p = pow(s, 55.);
      float band = smoothstep(.10,.18,p)*.5 + smoothstep(.42,.52,p)*.5;
      float row = vW.z*.55;
      float id = floor(row), fr = fract(row);
      float h = fract(sin(id*91.7)*4375.5);
      float dx = fract(vW.x*.055 + h*7. + t*.02*(h-.5));
      float dash = smoothstep(0.,.12,fr)*smoothstep(.3,.16,fr)*step(.74,dx)*step(dx,.95);
      float nearFade = 1. - smoothstep(50., 170., dist);
      vec3 lineCol = mix(uNear*1.3 + .07, uOrb, .3);
      col = mix(col, lineCol, dash*.5*nearFade);
      col = mix(col, uOrb, band*uGlow*.9);
      col = mix(col, uFog, smoothstep(50., 380., dist)*.9);
      gl_FragColor = vec4(col,1.);
    }`
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), seaMat);
sea.rotation.x = -Math.PI/2;
sea.position.set(0, SEA_Y, -400);
scene.add(sea);

/* ---------- 地形 ---------- */
function bump(x,z,cx,cz,h,sx,sz){ return h*Math.exp(-(((x-cx)*(x-cx))/sx + ((z-cz)*(z-cz))/sz)); }
function groundY(x,z){
  const d = -z;
  let y;
  if(d < 6) y = -1.5;
  else if(d < 34) y = -1.5 - (d-6)/28*4.3;
  else y = -5.8 - (d-34)*.35;
  y += Math.pow(Math.abs(x)/34, 2) * 7 * Math.min(1, Math.max(0, (d-4)/10));
  y += bump(x,z,19,-47,6,70,140) + bump(x,z,-30,-62,11,160,220);
  return y;
}
const groundMat = toon(0x4d4b7a);
const gGeo = new THREE.PlaneGeometry(150, 115, 100, 80);
gGeo.rotateX(-Math.PI/2);
gGeo.translate(0, 0, -52);
{
  const pa = gGeo.attributes.position;
  for(let i=0;i<pa.count;i++) pa.setY(i, groundY(pa.getX(i), pa.getZ(i)));
  gGeo.computeVertexNormals();
}
scene.add(new THREE.Mesh(gGeo, groundMat));

/* 遠くの島影 */
const islandMat = toon(0x3b3a69);

const ROOFS = [0xb8705f,0x5f8f96,0x5e6aa0,0x9c6f8e,0xc98a5d,0x6f8a6a];
const houses = [];
for(let r=0;r<9;r++){
  const zc = -9.5 - r*2.9;
  const n = 6 + r*2, span = 5 + r*2.8;
  for(let i=0;i<n;i++){
    const x = -span + (i+.5)/n*2*span + (rnd()-.5)*1.4;
    const z = zc + (rnd()-.5)*1.2;
    const gy = groundY(x,z);
    if(gy < -5.3) continue;
    if(r < 4 && Math.abs(x) < 1.9) continue;          // 港へ下る中央の坂道
    const tower = r >= 3 && rnd() < .14;
    const w = tower ? 1.1 + rnd()*.4 : 1.3 + rnd()*1.1;
    const d = tower ? w : 1.3 + rnd()*.9;
    const h = tower ? 2.4 + rnd()*1.2 : (r < 3 ? .9 + rnd()*.7 : 1.1 + rnd()*1.3);
    houses.push({ x, z, gy, w, d, h, ry:(rnd()-.5)*.28, tower,
      wall:pick(WALLS), roof:pick(ROOFS), rh:tower ? 1.2 + rnd()*.4 : .6 + rnd()*.5 });
  }
}

/* 切妻屋根（中心原点のプリズム） */
function prismGeo(){
  const P = [
    -.5,-.5,.5,  .5,-.5,.5,  .5,.5,0,   -.5,-.5,.5,  .5,.5,0,  -.5,.5,0,
     .5,-.5,-.5, -.5,-.5,-.5, -.5,.5,0,  .5,-.5,-.5, -.5,.5,0,  .5,.5,0,
    -.5,-.5,-.5, -.5,-.5,.5, -.5,.5,0,
     .5,-.5,.5,  .5,-.5,-.5,  .5,.5,0
  ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.computeVertexNormals();
  return g;
}

const winList = [];
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V3 = new THREE.Vector3(), S3 = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);
const col = new THREE.Color();
const OT = .055;
let gi = 0, ti = 0;
houses.forEach((hs, i)=>{
  Q.setFromAxisAngle(UP, hs.ry);
  const cy = hs.gy + hs.h/2 - .3;
  V3.set(hs.x, cy, hs.z);
  M.compose(V3, Q, S3.set(hs.w, hs.h, hs.d)); bodyIM.setMatrixAt(i, M);
  M.compose(V3, Q, S3.set(hs.w+OT*2, hs.h+OT*2, hs.d+OT*2)); bodyOL.setMatrixAt(i, M);
  bodyIM.setColorAt(i, col.set(hs.wall));
  const top = cy + hs.h/2;
  if(hs.tower){
    V3.set(hs.x, top + hs.rh/2 - .02, hs.z);
    M.compose(V3, Q, S3.set(hs.w*1.18, hs.rh, hs.d*1.18)); pyrIM.setMatrixAt(ti, M);
    M.compose(V3, Q, S3.set(hs.w*1.18+OT*2, hs.rh+OT*2, hs.d*1.18+OT*2)); pyrOL.setMatrixAt(ti, M);
    pyrIM.setColorAt(ti, col.set(hs.roof)); ti++;
  } else {
    V3.set(hs.x, top + hs.rh/2 - .02, hs.z);
    M.compose(V3, Q, S3.set(hs.w*1.12, hs.rh, hs.d*1.18)); gableIM.setMatrixAt(gi, M);
    M.compose(V3, Q, S3.set(hs.w*1.12+OT*2, hs.rh+OT*2, hs.d*1.18+OT*2)); gableOL.setMatrixAt(gi, M);
    gableIM.setColorAt(gi, col.set(hs.roof)); gi++;
  }
  /* 窓：こちら向きの面に1〜3個 */
  const rows = hs.h > 1.8 ? 2 : 1;
  const cols = Math.max(1, Math.min(3, Math.floor(hs.w/.6)));
  for(let rr=0; rr<rows; rr++){
    for(let cc=0; cc<cols; cc++){
      if(rnd() < .25) continue;
      const lx = (cc - (cols-1)/2) * (hs.w/(cols+.4));
      const ly = hs.h/2 - .45 - rr*.75;
      const local = new THREE.Vector3(lx, ly, hs.d/2 + .012).applyQuaternion(Q);
      winList.push({ p:new THREE.Vector3(hs.x, cy, hs.z).add(local), q:Q.clone(), r:rnd(), tone:rnd() });
    }
  }
});

function casement(sign){
  const pivot = new THREE.Group();
  pivot.position.set(sign < 0 ? WIN_L : WIN_R, WIN_B, -.3);
  const g = new THREE.Group();
  const W = (WIN_R - WIN_L)/2, H = WIN_T - WIN_B, b = .065;
  g.position.x = -sign * W/2;
  pivot.add(g);
  const f = casMat;
  box(W, b, .05, f, 0, H - b/2, 0, g, .01);
  box(W, b, .05, f, 0, b/2, 0, g, .01);
  box(b, H, .05, f, -W/2 + b/2, H/2, 0, g, .01);
  box(b, H, .05, f,  W/2 - b/2, H/2, 0, g, .01);
  box(.035, H, .04, f, 0, H/2, 0, g);
  box(W, .035, .04, f, 0, H*.36, 0, g);
  box(W, .035, .04, f, 0, H*.68, 0, g);
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(W-.1, H-.1),
    new THREE.MeshBasicMaterial({ color:0xc9d8f2, transparent:true, opacity:.14, side:THREE.DoubleSide, depthWrite:false }));
  gl.position.y = H/2; g.add(gl);
  pivot.rotation.y = sign < 0 ? 1.15 : -1.15;
  scene.add(pivot);
  return pivot;
}

function stepPalette(dt){
  if(tMix >= 1) return;
  tMix = Math.min(1, tMix + dt/2.2);
  const e = tMix*tMix*(3 - 2*tMix);
  for(const k in cur){
    const a = from[k], b = to[k];
    if(a instanceof THREE.Color) cur[k].copy(a).lerp(b, e);
    else if(a instanceof THREE.Vector3) cur[k].copy(a).lerp(b, e).normalize();
    else cur[k] = a + (b - a)*e;
  }
  applyPalette(cur);
}
applyPalette(cur);
paintWindows(cur);

document.querySelectorAll('#modes button').forEach(b=>{
  b.addEventListener('click', ()=>setMode(b.dataset.mode));
});
const spotBtn = document.getElementById('spotBtn');
spotBtn.addEventListener('click', ()=>{
  guide.visible = !guide.visible;
  spotBtn.setAttribute('aria-pressed', String(guide.visible));
});

/* ---------- カメラ操作 ---------- */
const EYE_Y = 2.3;
let baseDist = 4, zoom = 1, yaw = 0, pitch = 0, tYaw = 0, tPitch = 0;
const hint = document.getElementById('hint');
let hinted = false;
function hideHint(){ if(!hinted){ hinted = true; hint.style.opacity = '0'; } }
const pointers = new Map();
let lastPinch = 0;
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  hideHint();
});
canvas.addEventListener('pointermove', e=>{
  const p = pointers.get(e.pointerId);
  if(!p) return;
  if(pointers.size === 1){
    tYaw = Math.max(-.4, Math.min(.4, tYaw - (e.clientX - p.x)*.0035));
    tPitch = Math.max(-.28, Math.min(.2, tPitch - (e.clientY - p.y)*.0028));
  }
  p.x = e.clientX; p.y = e.clientY;
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(lastPinch) zoom = Math.max(.72, Math.min(1.12, zoom * (lastPinch / d)));
    lastPinch = d;
  }
});
function endPointer(e){ pointers.delete(e.pointerId); if(pointers.size < 2) lastPinch = 0; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  zoom = Math.max(.72, Math.min(1.12, zoom * (1 + e.deltaY*.0008)));
  hideHint();
}, { passive:false });

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 70 : 52;
  camera.updateProjectionMatrix();
  const vh = camera.fov * Math.PI/180;
  const hh = 2*Math.atan(Math.tan(vh/2)*aspect);
  const needW = 1.2 / Math.tan(hh/2);
  const needH = 1.75 / Math.tan(vh/2);
  baseDist = Math.max(2.6, Math.min(3.4, Math.max(needW, needH)));
}
window.addEventListener('resize', resize);
resize();

/* ---------- ループ ---------- */
let last = performance.now(), clock = 0, curtainTick = 0, flickerT = 0;
const LOOK = new THREE.Vector3();
renderer.setAnimationLoop(now=>{
  const dt = Math.min((now - last)/1000, .05);
  last = now; clock += dt;

  stepPalette(dt);

  yaw += (tYaw - yaw)*Math.min(1, dt*5);
  pitch += (tPitch - pitch)*Math.min(1, dt*5);
  const sway = Math.sin(clock*.23)*.018*MOTION;
  const dist = baseDist * zoom;
  camera.position.set(-yaw*.9, EYE_Y + Math.sin(clock*.31)*.01*MOTION, dist);
  LOOK.set(0, 2.05, 0);
  camera.lookAt(LOOK);
  camera.rotateY(yaw + sway);
  camera.rotateX(pitch);

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  orb.position.copy(camera.position).addScaledVector(cur.orbDir, 380);
  seaMat.uniforms.uCam.value.copy(camera.position);
  seaMat.uniforms.uTime.value = clock*MOTION;
  starMat.uniforms.uTime.value = clock;

  clouds.forEach(c=>{
    c.position.x += c.userData.speed*dt*MOTION;
    if(c.position.x > 300) c.position.x = -300;
  });

  boats.forEach(b=>{
    const ph = b.userData.phase;
    b.position.y = SEA_Y + .12 + Math.sin(clock*1.1 + ph)*.06*MOTION;
    b.rotation.z = Math.sin(clock*.9 + ph)*.05*MOTION;
  });

  beamPivot.rotation.y = clock*.7*MOTION;
  {
    const bx = Math.cos(beamPivot.rotation.y), bz = -Math.sin(beamPivot.rotation.y);
    const tx = camera.position.x - lhX, tz = camera.position.z - lhZ;
    const tl = Math.hypot(tx,tz);
    const facing = Math.max(0, (bx*tx + bz*tz)/tl);
    const flash = Math.pow(facing, 30);
    const s = 1.6 + flash*6*cur.beam/.18;
    lhGlow.scale.set(s, s, 1);
    lhGlow.material.opacity = .35 + cur.lamps*.65;
  }

  /* 窓明かりのまたたき：ときどき1つ入れ替える */
  flickerT += dt;
  if(flickerT > .7){
    flickerT = 0;
    const w = winList[Math.floor(Math.random()*winList.length)];
    w.r = Math.random();
    const i = winList.indexOf(w);
    winIM.setColorAt(i, w.r < to.lit ? LIT_COLS[Math.floor(w.tone*3)] : to.glass);
    winIM.instanceColor.needsUpdate = true;
  }

  /* カーテンのゆらぎ */
  curtainTick += dt;
  if(curtainTick > 1/30){
    curtainTick = 0;
    curtains.forEach(c=>{
      const pa = c.m.geometry.attributes.position;
      const arr = pa.array, b = c.base;
      for(let i=0;i<pa.count;i++){
        const x = b[i*3], y = b[i*3+1];
        const u = (x + c.w/2)/c.w;
        const v = (c.h/2 - y)/c.h;
        const pleat = Math.sin(u*19)*.035;
        const wave = Math.sin(u*6 + clock*1.2 + c.sign*2)*.045*v*MOTION;
        const breeze = (Math.sin(clock*.55 + c.sign) *.5 + .5) * v*v * .09 * MOTION;
        arr[i*3] = x - c.sign*breeze*.6;
        arr[i*3+2] = pleat + wave + breeze*.5;
      }
      pa.needsUpdate = true;
      c.m.geometry.computeVertexNormals();
    });
  }

  if(guide.visible){
    ring.material.opacity = .55 + Math.sin(clock*3)*.35;
  }

  renderer.render(scene, camera);
});

})();
</script>
