  g.gain.setValueAtTime(.0001, startTime);
  g.gain.exponentialRampToValueAtTime(peak, startTime + attack);
  g.gain.exponentialRampToValueAtTime(.0001, startTime + attack + release);
  g.connect(masterGain); sendToReverb(g, .5);
  const parts = [g];
  const osc0 = trackNode(ctx.createOscillator()); osc0.type = 'sine'; osc0.frequency.value = freq; osc0.connect(g);
  osc0.start(startTime); osc0.stop(stopAt);
  // 上の音：[倍率, 基音に対する強さ, 消えるまでの秒]。それぞれ自分の包絡を持ち、基音の包絡（g）は通さず直接出す
  const overs = [[2.0, .063*hi, release*.6], [3.0, .158*hi*hi, release*.45], [6.27, .3*hi*hi, .07]];
  for(const [ratio, amp, life] of overs){
    const f = freq*ratio; if(f > 15000 || amp < .002) continue;
    const o = trackNode(ctx.createOscillator()); o.type = 'sine'; o.frequency.value = f;
    const og = ctx.createGain(), a = peak*amp;
    og.gain.setValueAtTime(.0001, startTime);
    og.gain.exponentialRampToValueAtTime(a, startTime + attack*.5);
    og.gain.exponentialRampToValueAtTime(.0001, startTime + attack*.5 + life);
    o.connect(og); og.connect(masterGain); sendToReverb(og, .5); parts.push(og);
    o.start(startTime); o.stop(Math.min(stopAt, startTime + attack + life + .05));
  }
  // ピンが歯を弾く雑音：5ms、高めの帯域
  const n = ctx.createBufferSource(); n.buffer = noiseBuf(ctx);
  const ng = ctx.createGain(), bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = Math.min(9000, 3500 + freq*1.5); bp.Q.value = 1.2;
  ng.gain.setValueAtTime(.0001, startTime);
  ng.gain.exponentialRampToValueAtTime(peak*.5, startTime + .0008);
  ng.gain.exponentialRampToValueAtTime(.0001, startTime + .006);
  n.connect(bp); bp.connect(ng); ng.connect(masterGain); parts.push(bp, ng);
  n.start(startTime, Math.random()*.03, .012); trackNode(n);
  osc0.addEventListener('ended', ()=>{ parts.forEach(x=>x.disconnect()); });
}
function playTriangleNote(startTime, midi, dur, vel){
  const freq = midiToFreq(midi);
  const osc = trackNode(audioCtx.createOscillator()); osc.type = 'sine'; osc.frequency.value = freq;   // 元 'triangle'
  const peak = clampNum(vel/127,.05,1)*.22, attack = .008, release = Math.min(dur*1.1+.15, 1);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(.0001, startTime);
  g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
  g.gain.exponentialRampToValueAtTime(.0001, startTime+attack+release);
  osc.connect(g); g.connect(masterGain); sendToReverb(g, .5);
  osc.start(startTime); osc.stop(startTime+attack+release+.05);
  // 柔らかい音：正弦波に2倍音を少し（三角波の奇数倍音の濁りを出さない）
  const o2 = trackNode(audioCtx.createOscillator()); o2.type = 'sine'; o2.frequency.value = freq*2;
  const g2 = audioCtx.createGain(); g2.gain.value = .12; o2.connect(g2); g2.connect(g);
  o2.start(startTime); o2.stop(startTime+attack+release+.05);
  osc.addEventListener('ended', ()=>{ g.disconnect(); g2.disconnect(); });
}
function playBassNote(startTime, midi, dur, vel){
  const freq = midiToFreq(midi);
  const osc = trackNode(audioCtx.createOscillator()); osc.type = 'sine'; osc.frequency.value = freq;
  const peak = clampNum(vel/127,.05,1)*.3, attack = .01, release = Math.min(dur*.9, .5);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(.0001, startTime);
  g.gain.exponentialRampToValueAtTime(peak, startTime+attack);
  g.gain.exponentialRampToValueAtTime(.0001, startTime+attack+release);
  osc.connect(g); g.connect(masterGain); sendToReverb(g, .5);
  osc.start(startTime); osc.stop(startTime+attack+release+.05);
  osc.addEventListener('ended', ()=>{ g.disconnect(); });
}
function playStringsNote(startTime, midi, dur, vel){
  const freq = midiToFreq(midi);
  const gSum = audioCtx.createGain(), oscs = [];
  for(const cents of [-7, 0, 7]){
    const osc = trackNode(audioCtx.createOscillator()); osc.type = 'triangle'; osc.frequency.value = freq; osc.detune.value = cents;
    osc.connect(gSum); oscs.push(osc);
  }
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2400;
  const peak = clampNum(vel/127,.05,1)*.16, attack = Math.min(dur*.5, .7), release = Math.min(dur*.6+.3, 1.8);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(.0001, startTime);
  g.gain.linearRampToValueAtTime(peak, startTime+attack);
  g.gain.exponentialRampToValueAtTime(.0001, startTime+attack+release);
  gSum.connect(filter); filter.connect(g);
  const stopAt = startTime+attack+release+.05;
  for(const osc of oscs){ osc.start(startTime); osc.stop(stopAt); }
  g.connect(masterGain); sendToReverb(g, .6);
  oscs[0].addEventListener('ended', ()=>{ g.disconnect(); gSum.disconnect(); filter.disconnect(); });
}

const INSTRUMENTS = { melody:playMusicBoxNote, arp:playTriangleNote, bass:playBassNote, strings:playStringsNote };
const PARTS = ['melody','arp','bass','strings'];

/* ---- 先読みの予約（25ms ごとに起き、0.2 秒先までの音だけを予約する） ---- */
const LOOKAHEAD_MS = 25, AHEAD_SEC = .2, TAIL_SEC = 3.2;   // TAIL：鳴り終わってから残響が消えるまで待つ秒
const EVENTS = [];
for(const part of PARTS) for(const [t, midi, dur, vel] of (TRACK[part] || [])) EVENTS.push([t, part, midi, dur, vel]);
EVENTS.sort((a, b)=>a[0] - b[0]);
let gen = 0, timer = null, startAt = 0, playing = false, loop = false;
function schedule(myGen){
  if(myGen !== gen) return;
  const now = audioCtx.currentTime, L = TRACK.loopSec;
  let pos = now - startAt;
  if(!loop && pos >= L + TAIL_SEC){ finish(); return; }
  const until = pos + AHEAD_SEC;
  while(true){
    const loopIdx = Math.floor(sched.next/EVENTS.length);
    if(!loop && loopIdx >= 1) break;
    const ev = EVENTS[sched.next % EVENTS.length], at = loopIdx*L + ev[0];
    if(at > until) break;
    if(at >= pos - .05) INSTRUMENTS[ev[1]](startAt + Math.max(at, pos), ev[2], ev[3], ev[4]);
    sched.next++;
  }
  timer = setTimeout(()=>schedule(myGen), LOOKAHEAD_MS);
}
const sched = { next:0 };
function play(opts){
  const ctx = ensureAudioCtx(); if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume();
  stopNow();
  loop = !!(opts && opts.loop);
  gen++; sched.next = 0; playing = true;
  startAt = ctx.currentTime + .12;
  masterGain.gain.cancelScheduledValues(ctx.currentTime);
  masterGain.gain.setValueAtTime(.0001, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(volume, startAt + .05);
  schedule(gen);
  ui();
}
function stopNow(){
  gen++; if(timer){ clearTimeout(timer); timer = null; }
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.linearRampToValueAtTime(.0001, now + .04);   // 瞬断するとクリックノイズになる
  for(const n of activeNodes){ try{ n.stop(now + .045); }catch(e){} }
  activeNodes = [];
  playing = false;
}
function stop(){ stopNow(); ui(); }
function fadeOut(sec){
  if(!playing || !audioCtx) return;
  const now = audioCtx.currentTime, s = Math.max(.1, sec || 3);
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.linearRampToValueAtTime(.0001, now + s);
  const myGen = gen; setTimeout(()=>{ if(myGen === gen){ stopNow(); ui(); } }, s*1000 + 60);
}
function finish(){ stopNow(); ui(); if(typeof API.onEnd === 'function') API.onEnd(); }
function setVolume(v){ volume = clampNum(v, 0, 1); if(masterGain && playing){ masterGain.gain.cancelScheduledValues(audioCtx.currentTime); masterGain.gain.setValueAtTime(volume, audioCtx.currentTime); } }
function position(){ return playing && audioCtx ? Math.max(0, audioCtx.currentTime - startAt) % (loop ? TRACK.loopSec : Infinity) : 0; }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && audioCtx && audioCtx.state === 'suspended' && playing) audioCtx.resume(); });

const API = { play, stop, fadeOut, setVolume, position, onEnd:null, duration:TRACK.loopSec, get playing(){ return playing; } };
window.OmoideWaltz = API;

/* ---- このページの確認用の操作盤（ゲームに取り込むときは不要） ---- */
const $ = id=>document.getElementById(id);
const fmt = s=>Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2, '0');
function ui(){ if(!$('playBtn')) return; $('stopBtn').disabled = $('fadeBtn').disabled = !playing; $('playBtn').textContent = playing ? '↺ 頭から' : '▶ 再生'; }
if($('playBtn')){
  $('playBtn').onclick = ()=>play({ loop:$('loopChk').checked });
  $('stopBtn').onclick = stop;
  $('fadeBtn').onclick = ()=>fadeOut(3);
  $('vol').oninput = e=>setVolume(e.target.value/100);
  setInterval(()=>{ $('time').textContent = fmt(Math.min(position(), TRACK.loopSec)) + ' / ' + fmt(TRACK.loopSec); }, 250);
}
})();
</script>
